から、国家と個人の関係を考えられる。","hook":"戦争から逃げる男が望むのは、勝利でも自由でもなく、母のもとへ帰り土に種をまくことだけ。","synopsis":"内戦下の名もない国。寡黙な庭師マイケル・Kは、病気の母を故郷の農場へ連れていこうと手製の荷車で旅に出る。検問、収容所、飢えをくぐり抜けた彼は、誰にも管理されず土地からわずかな食べ物を得る生活を選ぶ。しかし国家は、何も要求しない彼さえ放置しない。","appeal":"抵抗を叫ばない主人公の沈黙が、国家や善意ある援助の暴力を逆照射する。極端に削ぎ落とされた生を通じて、自由とは何かを問う。","recommend":"静かな反戦文学を読みたい人／国家と個人の関係を考えたい人／寡黙な主人公の寓話的物語が好きな人","before":"南アフリカのアパルトヘイト期を思わせるが、国名や戦争の詳細はぼかされている。主人公の沈黙を無知と決めつけないことが重要。","question":"誰にも依存せず何も所有しない生は自由なのか、それとも社会から排除された結果なのか。","mood":[1,4,3,5],"year":1983},{"no":456,"phase":19,"phaseTitle":"古典と世界の大河","category":"日本","title":"思い出トランプ","author":"向田邦子","region":"日本","era":"現代","genre":"短編集","difficulty":5,"length":"短","why":"家族や男女の一瞬の亀裂を、短い会話と鋭い観察で描く短編集。\n日常会話の裏にある感情を読み取る力が養われる。","hook":"家族の食卓や近所づきあいの小さな違和感が、最後の一枚で人生の痛みに変わる。","synopsis":"昭和の家庭や職場を舞台にした十三編の短編集。夫婦、親子、兄弟、隣人といった身近な関係の中で、人々は言えなかった本音や小さな嘘を抱えて生きている。何気ない会話や贈り物、思い出がきっかけとなり、過去の傷や孤独がふいに姿を現す。","appeal":"短い会話と生活の細部だけで人物の長い人生を感じさせる巧さがある。ユーモアの直後に切なさが訪れ、読後に題名の意味が残る。","recommend":"人間関係を描く短編が好きな人／昭和の生活風景に惹かれる人／読みやすく余韻の深い作品を求める人","before":"連作ではなく独立した短編。結末の意外性だけでなく、登場人物が口にしなかった言葉を想像すると深まる。","question":"家族だから分かり合えるという期待は、なぜしばしば互いを傷つけるのか。","mood":[1,2,4,4],"year":1980},{"no":457,"phase":19,"phaseTitle":"古典と世界の大河","category":"海外","title":"夷狄を待ちながら","author":"J・M・クッツェー","region":"南アフリカ","era":"20世紀","genre":"世界文学","difficulty":5,"length":"中","why":"帝国の辺境で異民族弾圧に加担する役人を通し、支配の論理を描く。\n「文明」と「野蛮」が権力によって作られることを理解できる。","hook":"辺境の砦で「蛮族」を待つ帝国。恐怖が敵を作り、善良な役人さえ加害者へ変えていく。","synopsis":"帝国の辺境で穏やかに暮らす行政官は、治安当局のジョル大佐が「蛮族」の脅威を調査するため訪れたことで日常を崩される。拷問を受けた人々を目にした彼は、傷ついた少女を故郷へ送り返そうとするが、その行動によって反逆者と見なされる。敵の存在を必要とする帝国の論理が町全体を覆っていく。","appeal":"固有の国や時代を示さない寓話だからこそ、植民地主義、戦争、治安政策に共通する恐怖の構造が鮮明になる。語り手自身の善意にも支配欲が混じる。","recommend":"権力と暴力の寓話を読みたい人／植民地主義を考えたい人／単純な英雄のいない小説が好きな人","before":"「蛮族」が実際にどれほど危険かはほとんど示されない。帝国が情報と恐怖をどう作るかに注目したい。拷問描写を含む。","question":"不正な制度の中で良心的に振る舞うだけで、加害への責任を免れることはできるのか。","mood":[1,4,3,5],"year":1980},{"no":458,"phase":19,"phaseTitle":"古典と世界の大河","category":"日本","title":"吉里吉里人","author":"井上ひさし","region":"日本","era":"現代","genre":"風刺","difficulty":5,"length":"超長","why":"東北の村が独立国を宣言する奇想から、言語・国家・地方を風刺する。\n方言と百科全書的知識を使った日本語小説の暴走を楽しめる。","hook":"東北の一村が日本から独立宣言。笑いと方言と膨大な知識で、国家の常識をひっくり返す。","synopsis":"東北地方の架空の村・吉里吉里村が、突然日本国からの独立を宣言する。独自通貨、軍隊、憲法、医療制度を整え、政府との交渉を始める村人たち。取材に訪れた小説家の視点を通じ、中央と地方、標準語と方言、権力と文化をめぐる騒動が巨大なスケールで展開する。","appeal":"荒唐無稽な独立劇の中に、東北差別、医療、農業、文化政策への本気の批評が詰まっている。言葉遊びと知識の洪水が圧倒的。","recommend":"風刺と笑いの長編が好きな人／地方と中央の関係に関心がある人／途方もないスケールの日本語小説に挑みたい人","before":"非常に長く、方言や専門知識も多い。すべてを理解しようとせず、章ごとの騒動を楽しむ読み方でよい。現在では古く感じる表現もある。","question":"国家への所属は、生まれた場所によって自動的に決まるものなのか。","mood":[1,2,3,5],"year":1981},{"no":459,"phase":19,"phaseTitle":"古典と世界の大河","category":"海外","title":"神の矢","author":"チヌア・アチェベ","region":"ナイジェリア","era":"20世紀","genre":"世界文学","difficulty":5,"length":"中","why":"植民地化前後のイボ社会を、宗教的指導者の葛藤から描く。\n共同体内部の権力と外部支配の双方を複雑に考えられる。","hook":"植民地支配が迫る村で、祭司エゼウルは神、共同体、自らの権威の間に引き裂かれる。","synopsis":"英国支配が広がる二十世紀初頭のナイジェリア。複数の村を結ぶ神ウルの最高祭司エゼウルは、宗教的権威と政治的影響力を持っている。植民地行政官は彼を統治に利用しようとし、村内部でも対立が深まる。誇り高いエゼウルの判断は、伝統を守るどころか共同体を危機へ導いていく。","appeal":"植民地支配を外からの侵略だけでなく、共同体内部の権力争いと結びつけて描く。伝統も近代も一枚岩ではないことが分かる。","recommend":"アフリカ文学を深く読みたい人／宗教と政治の関係に関心がある人／悲劇的な指導者の物語が好きな人","before":"イボ社会の祭礼や神々が重要。用語を完全に覚えるより、エゼウルが「神の代理人」と「一人の父親」の間で揺れる点を追うとよい。","question":"伝統を守る指導者が共同体より自らの権威を優先したとき、その伝統は誰のものになるのか。","mood":[1,3,3,5],"year":1964},{"no":460,"phase":19,"phaseTitle":"古典と世界の大河","category":"日本","title":"虚人たち","author":"筒井康隆","region":"日本","era":"現代","genre":"実験小説","difficulty":5,"length":"中","why":"人物の内面をあえて排し、行動だけで構成する実験小説。\n従来の心理描写に頼らず「人間」を描けるかという挑戦を体験できる。","hook":"時間も人物も筋書きも信用できない。小説という装置そのものが、読者の足元を崩していく。","synopsis":"研究所を舞台に、超能力を持つ人々や科学者たちの行動が描かれるが、物語は通常の因果関係や時間の順序に従わない。登場人物は自分が小説の中にいることを意識し、場面は中断され、別の可能性へ分岐する。読者が当然と考える「人物」「現実」「作者」の境界を解体する実験小説。","appeal":"物語に没入させるのではなく、物語が作られる仕組みをむき出しにする。難解さそのものがテーマで、日本SFとメタフィクションの極点。","recommend":"実験小説やメタフィクションが好きな人／筒井康隆の前衛性に触れたい人／分からなさを楽しめる人","before":"整った筋や明快な結末を期待すると苦しい。場面ごとに「いま小説のどの約束が壊されたか」を観察する読み方が向く。","question":"登場人物が作者に支配されているなら、現実の人間は何によって自分の物語を支配されているのか。","mood":[1,2,3,4],"year":1981},{"no":461,"phase":19,"phaseTitle":"古典と世界の大河","category":"海外","title":"真夜中の子供たち","author":"サルマン・ラシュディ","region":"インド／イギリス","era":"20世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"インド独立と同時に生まれた男の人生を、国家史と魔術的に重ねる。\n個人の記憶が歴史を語り替えるポストコロニアル文学の代表例を読める。","hook":"インド独立の瞬間に生まれた千一人の子どもたち。国家の歴史と一人の身体が絡み合う。","synopsis":"1947年8月15日午前零時、インド独立と同時に生まれたサリーム・シナイは、同じ一時間に生まれた子どもたちと精神的につながる能力を持つ。彼は家族の秘密を語りながら、印パ分離、戦争、非常事態へ至る国家の歴史を自らの身体の変化として経験する。記憶違いと誇張を含む語りが、個人史と国民史を混ぜ合わせる。","appeal":"魔術的な出来事、政治風刺、家族の秘密が猛烈な語り口で展開する。歴史が客観的な年表ではなく、身体と記憶によって語り直される。","recommend":"魔術的リアリズムが好きな人／インド現代史を物語で読みたい人／饒舌で複雑な家族年代記に挑戦したい人","before":"インド独立、印パ分離、非常事態の基礎を軽く確認するとよい。サリームは誤りを認める語り手なので、事実の正確さより語りの意味を見る。","question":"国家の歴史を一人の人生で代表させることは、理解を助けるのか、それとも多様な人々を消してしまうのか。","mood":[1,3,3,5],"year":1981},{"no":462,"phase":19,"phaseTitle":"古典と世界の大河","category":"日本","title":"果しなき流れの果に","author":"小松左京","region":"日本","era":"戦後","genre":"SF","difficulty":5,"length":"長","why":"宇宙と時間を越える壮大な物語で、人類の進化と文明の終末を描く。\n日本SFの思弁的スケールと、長い時間を物語にする力を体感できる。","hook":"未来から届く謎の遺物を追い、人類史の始まりと終わりが一本の時間へつながっていく。","synopsis":"古代遺跡から発見された不可解な物体をきっかけに、科学者たちは時間と宇宙をめぐる巨大な謎へ近づく。物語は現代、遠い未来、文明の終末を行き来し、超能力者、時間旅行、宇宙文明の痕跡が交錯する。人類の進化と滅亡を、個人の運命を超えた尺度で描く日本SFの大作。","appeal":"アイデアの壮大さと、離れた時代の物語が一つに収束する構成が魅力。人類が宇宙で特別な存在なのかという問いを突きつける。","recommend":"時間SFや宇宙SFが好きな人／文明の盛衰を描く大きな物語を読みたい人／小松左京の代表作に挑戦したい人","before":"複数の時代と人物が登場するので、細部を一度で把握しなくてもよい。刊行当時の科学観を含むが、中心は人類史への想像力。","question":"人類がいつか滅びるとしても、知識や文明を未来へ残すことにはどんな意味があるのか。","mood":[1,2,3,4],"year":1966},{"no":463,"phase":19,"phaseTitle":"古典と世界の大河","category":"海外","title":"恥","author":"サルマン・ラシュディ","region":"インド／イギリス","era":"20世紀","genre":"世界文学","difficulty":5,"length":"長","why":"パキスタンを思わせる国の一族史を通し、政治と「恥」の文化を描く。\n私的感情が国家的暴力へ変換される仕組みを考えられる。","hook":"ロンドンからパキスタンへ戻った三人の男女。私的な恥と国家の暴力が、怪物のように増殖する。","synopsis":"架空の国家パキスタンを思わせる国で、二つの政治家一族が権力を争う。移民の医師オマルは、三人の母から生まれた謎の女性スフィヤと出会う。彼女は周囲が押しつける「恥」を身体に蓄積し、やがて制御不能な暴力へ変えていく。家族の秘密、軍事独裁、宗教、性規範が幻想的に絡み合う。","appeal":"個人に押しつけられた羞恥心が国家的暴力へ変わるという大胆な寓話。笑い、猥雑さ、残酷さを混ぜて権力者の神話を解体する。","recommend":"政治風刺と魔術的リアリズムが好きな人／パキスタン政治に関心がある人／感情と権力の結びつきを考えたい人","before":"実在の政治家をモデルにした人物が登場するが、歴史小説ではなく寓話的な作品。性暴力や殺人の描写を含む。","question":"社会が女性に押しつけた「恥」が暴力として返ってきたとき、責任は誰にあるのか。","mood":[1,4,3,5],"year":1983},{"no":464,"phase":19,"phaseTitle":"古典と世界の大河","category":"日本","title":"世界99","author":"村田沙耶香","region":"日本","era":"現代","genre":"ディストピア","difficulty":5,"length":"超長","why":"二つに分かれた社会と女性の身体を描く、村田沙耶香の長大なディストピア。\n現代のジェンダー・家族・正常性を、極端な世界から総点検できる。","hook":"二つの常識を使い分ける世界で、「正しい側」に適応するほど、人間は自分を失っていく。","synopsis":"世界は価値観の異なる二つの領域に分かれ、人々は場面に応じて互いに矛盾する常識を受け入れて暮らしている。ある女性は周囲に適応しながら、恋愛、家族、仕事の中で自分の感覚を見失っていく。複数の人物と制度を通じ、「普通」が一つではない社会の不気味さを描く長編。","appeal":"『コンビニ人間』で描かれた同調圧力を、社会全体の仕組みへ拡張したような迫力がある。善意や多様性さえ新たな規範になる怖さを突く。","recommend":"村田沙耶香の世界観が好きな人／同調圧力や多様性の矛盾を考えたい人／不穏な近未来小説を読みたい人","before":"刊行時点で新しい長編のため、細部の受け取り方は読者に委ねられる。設定の正解探しより、人物がどんな言葉を強制されるかに注目したい。","question":"複数の価値観を尊重する社会が、別の形の「正しさ」を強制し始めるのはどんな瞬間か。","mood":[1,2,3,4],"year":2025},{"no":465,"phase":19,"phaseTitle":"古典と世界の大河","category":"海外","title":"ゴーラ","author":"ラビンドラナート・タゴール","region":"インド","era":"20世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"植民地下インドの青年を通し、宗教・民族・国家意識を描く。\n愛国心が排他性へ変わる危険と、複数の帰属を考えられる。","hook":"ヒンドゥー教徒として民族主義を掲げる青年ゴーラ。出自の秘密が、信仰と国家観を根底から揺らす。","synopsis":"十九世紀末のベンガル。青年ゴーラは厳格なヒンドゥー教徒として英国支配に反発し、伝統とインド民族の統一を主張する。友人ビノイとともに改革派ブラフモ・サマージの家庭と交流し、女性たちとの対話や恋愛を通じて自らの思想を試される。やがて彼の出生をめぐる秘密が明らかになり、民族と宗教の定義が崩れる。","appeal":"思想討論と青春・恋愛小説が結びつき、「インド人とは誰か」を多角的に問う。主人公の確信が崩れる過程に、普遍的な成長の力がある。","recommend":"民族、宗教、国家の関係に関心がある人／思想をめぐる長編対話が好きな人／タゴールの代表作を読みたい人","before":"英国統治下ベンガルと、ヒンドゥー改革運動ブラフモ・サマージの背景を知るとよい。登場人物の議論を作者の単一の結論とは考えない。","question":"自分の所属を証明する血統や信仰を失ったとき、それでも祖国を愛することはできるのか。","mood":[1,2,3,5],"year":1910},{"no":466,"phase":19,"phaseTitle":"古典と世界の大河","category":"日本","title":"源氏物語","author":"紫式部","region":"日本","era":"平安","genre":"古典物語","difficulty":5,"length":"超長","why":"宮廷の恋愛と権力を、光源氏と女性たちの長い時間から描く日本文学の源流。\n人物の感情、季節、和歌、語りの距離を総合的に読む力が育つ。","hook":"光源氏と彼を取り巻く女性たちの生涯を通して、恋、権力、老い、喪失を千年越しに描く。","synopsis":"帝の子として生まれながら臣下となった光源氏は、美貌と才能によって宮廷社会の中心へ進む。亡き母に似た藤壺への思慕を抱え、葵の上、紫の上、明石の君など多くの女性と関係を結ぶ。栄華の一方で別れや罪の意識が重なり、物語後半では次世代の薫と匂宮へ焦点が移る。","appeal":"恋愛絵巻にとどまらず、権力関係の中で女性がどう生きるか、時間が美と愛をどう変えるかを精密に描く。人物の感情が一つに決められない。","recommend":"長大な人間関係の物語が好きな人／古典文学の頂点に挑戦したい人／恋愛と権力を深く読みたい人","before":"現代語訳を選び、全五十四帖を一気に読む必要はない。人物系図を手元に置き、光源氏の行動を現代の恋愛倫理だけで単純化せず、当時の制度と女性側の視点も見る。","question":"光源氏の愛は相手を大切にする感情なのか、それとも自分の理想を相手に投影する欲望なのか。","mood":[1,2,3,5],"year":1008,"yearNote":"成立推定"},{"no":467,"phase":19,"phaseTitle":"古典と世界の大河","category":"海外","title":"家と世界","author":"ラビンドラナート・タゴール","region":"インド","era":"20世紀","genre":"世界文学","difficulty":5,"length":"中","why":"民族運動に揺れる家庭を、夫・妻・活動家の三者から描く。\n政治的理想が親密な関係を壊す過程と、女性の自立を考えられる。","hook":"民族運動に燃える男、穏健な夫、その間で目覚める妻。祖国への愛が家庭を戦場へ変える。","synopsis":"英国支配下のベンガル。地主ニキルは妻ビマラを伝統的な女性の領域である「家」から外の世界へ導こうとする。そこへ過激な民族主義者サンディプが現れ、外国製品排斥運動を扇動する。ビマラは彼の情熱に魅了されるが、運動の理念と現実の暴力、夫への思いの間で揺れていく。","appeal":"祖国愛を無条件に美化せず、正義の言葉が欲望や暴力を隠す危険を描く。三人の一人称が互いの盲点を照らす構成も巧み。","recommend":"政治と恋愛が交差する小説が好きな人／ナショナリズムを考えたい人／複数視点の心理劇を読みたい人","before":"1905年のベンガル分割令とスワデーシー運動が背景。タゴールは反植民地主義者だが、排他的民族主義には批判的だった。","question":"祖国を愛することが、目の前の人間を傷つける行為を正当化してよいのか。","mood":[1,3,3,5],"year":1916},{"no":468,"phase":19,"phaseTitle":"古典と世界の大河","category":"日本","title":"竹取物語","author":"作者未詳","region":"日本","era":"平安","genre":"古典物語","difficulty":5,"length":"短","why":"月から来た姫の物語を通し、求婚・権力・別離を描く日本最古級の物語。\n短い古典から、物語の原型と現代にも通じる批評性を味わえる。","hook":"月から来た少女は、地上の富も求婚も拒み、やがて誰にも止められない別れを迎える。","synopsis":"竹取の翁が光る竹の中から小さな少女を見つける。かぐや姫と名づけられた彼女は美しい女性に成長し、五人の貴公子から求婚されるが、それぞれに入手不可能な宝を求めて退ける。帝との交流を経ても地上にとどまることはできず、八月十五夜、月の都から迎えが訪れる。","appeal":"日本最古級の物語でありながら、権力や結婚を拒む主人公、偽物の宝をめぐる風刺、永遠の別れの哀しさが鮮やか。短く完成度が高い。","recommend":"古典文学の入口を探している人／短い幻想物語が好きな人／かぐや姫の原典を知りたい人","before":"現代語訳なら短時間で読める。昔話版では省かれがちな求婚者たちの失敗と、かぐや姫自身の感情に注目したい。","question":"かぐや姫が地上の求婚を拒んだのは自由な選択なのか、それとも月へ帰る運命に縛られていたからなのか。","mood":[1,2,3,5],"year":900,"yearNote":"成立推定"},{"no":469,"phase":19,"phaseTitle":"古典と世界の大河","category":"海外","title":"紅楼夢","author":"曹雪芹","region":"中国","era":"18世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"名門一族の繁栄と没落を、女性たちの生活と恋愛から描く中国古典の最高峰。\n家族・階級・文化の細部を長大な物語として読む体力がつく。","hook":"栄華を極める賈家と、宝玉・黛玉・宝釵の恋。巨大な家族の繁栄が、夢のように崩れていく。","synopsis":"清代中国の名門・賈家に生まれた賈宝玉は、科挙や出世に関心を持たず、聡明な従妹林黛玉や薛宝釵をはじめ、大観園の女性たちと暮らす。恋愛、詩作、宴、家政をめぐる日常の背後で、一族の財政と政治的地位は少しずつ傾いていく。若者たちの繊細な感情と名家の没落を描く超大作。","appeal":"数百人の人物が生きる世界の密度が圧倒的。恋愛だけでなく、女性たちの才能、使用人の生活、家族制度、富の脆さまで描き込まれている。","recommend":"巨大な家族小説が好きな人／中国古典文学の最高峰に挑戦したい人／繊細な恋愛と社会描写を両方味わいたい人","before":"登場人物が非常に多く、同じ姓や複数の呼び名もあるため人物表が必須。全百二十回のうち後半四十回は別作者による補作とされる。","question":"宝玉が拒む「立身出世」は本当に自由への道なのか、それとも特権に守られた逃避なのか。","mood":[1,2,3,5],"year":1791},{"no":470,"phase":19,"phaseTitle":"古典と世界の大河","category":"日本","title":"伊勢物語","author":"作者未詳","region":"日本","era":"平安","genre":"歌物語","difficulty":5,"length":"中","why":"和歌を軸に男女の恋と旅を連ねる歌物語。\n短い場面と言葉の余白から、古典の感情表現を読む方法が分かる。","hook":"「昔、男ありけり」。断片的な恋と旅の物語が、一人の人生と和歌の世界を浮かび上がらせる。","synopsis":"在原業平を思わせる「男」の元服から晩年までを、百二十五の短い章段で描く歌物語。禁じられた恋、東国への旅、友情、宮廷生活などの場面で和歌が詠まれ、説明されない感情や関係を補う。連続した伝記ではなく、記憶の断片のように一人の人物像が形づくられる。","appeal":"短い散文と和歌の組み合わせによって、言葉にできない恋心や別れを凝縮する。後世の文学や美意識に与えた影響も大きい。","recommend":"和歌と物語の関係を味わいたい人／短い古典から始めたい人／余白の多い恋愛文学が好きな人","before":"全章を筋のつながった小説として読む必要はない。現代語訳と原文を並べ、和歌が直前の場面をどう変えるかを見ると楽しめる。","question":"人生を代表するのは、連続した事実なのか、それとも後から選び取られた印象的な場面なのか。","mood":[1,2,3,4],"year":900,"yearNote":"成立推定"},{"no":471,"phase":19,"phaseTitle":"古典と世界の大河","category":"海外","title":"三国志演義","author":"羅貫中","region":"中国","era":"14世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"群雄が争う時代を、英雄・軍師・戦略の物語として描く中国歴史小説の原型。\n人物の魅力と政治的駆け引きで大長編を読む楽しさが得られる。","hook":"天下が乱れ、英雄たちが出会い、誓い、裏切り、敗れる。中国史上最大級の群雄劇。","synopsis":"後漢末、黄巾の乱をきっかけに各地の英雄が立ち上がる。劉備・関羽・張飛は義兄弟の契りを結び、曹操は圧倒的な政治力で北方を統一し、孫権は江南を守る。諸葛亮ら軍師の策謀、赤壁の戦い、魏・呉・蜀の成立を経て、天下統一をめぐる長い戦乱が描かれる。","appeal":"数多くの英雄と戦略、名場面が連続するエンターテインメントの原型。忠義を称えながら、理想だけでは勝てない政治の現実も見える。","recommend":"戦争と戦略の群像劇が好きな人／ゲームや漫画から三国志に興味を持った人／中国古典の長編に挑戦したい人","before":"史書『三国志』をもとにした歴史小説で、劉備側を理想化した創作が多い。人物名が多いため勢力別の図を用意するとよい。抄訳からでも楽しめる。","question":"乱世で人を導く力として、徳、知略、武力のうち最も重要なのは何か。","mood":[1,3,3,5],"year":1400,"yearNote":"成立推定"},{"no":472,"phase":19,"phaseTitle":"古典と世界の大河","category":"日本","title":"落窪物語","author":"作者未詳","region":"日本","era":"平安","genre":"古典物語","difficulty":5,"length":"中","why":"継母に虐げられた姫の逆転を描く平安時代の継子物語。\n『シンデレラ』型物語の日本的展開と、宮廷社会の家制度を読める。","hook":"継母に虐げられた姫君が、知性と人柄によって自分の居場所を取り戻す平安版シンデレラ。","synopsis":"母を失った落窪の君は、継母から粗末な部屋に住まわされ、裁縫や雑用を押しつけられている。彼女を支える女房あこきの働きで、貴公子・道頼と出会い、二人は結ばれる。道頼は姫を救い出すだけでなく、継母一家へ巧妙な仕返しを重ね、やがて家族関係も変化していく。","appeal":"分かりやすい逆転劇の楽しさと、平安時代の結婚・家族制度の具体的な描写を併せ持つ。侍女あこきの行動力も魅力。","recommend":"古典のシンデレラ物語を読みたい人／痛快な復讐と恋愛が好きな人／平安女性の生活に関心がある人","before":"現代語訳で読みやすい。道頼の復讐は現代感覚では過剰に見える部分もあるため、当時の家制度と物語上の報復の快感を分けて考えたい。","question":"落窪の君の幸福は、彼女自身の力で得たものか、それとも有力な男性に救われた結果なのか。","mood":[2,2,3,4],"year":980,"yearNote":"成立推定"},{"no":473,"phase":19,"phaseTitle":"古典と世界の大河","category":"海外","title":"水滸伝","author":"施耐庵","region":"中国","era":"14世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"腐敗した社会に抗う豪傑たちを描く中国の群像活劇。\n英雄的共同体の魅力と、反乱が新たな秩序になる矛盾を味わえる。","hook":"悪政に追われた百八人の豪傑が梁山泊へ集う。正義と無法が入り混じる反逆者たちの物語。","synopsis":"北宋末、腐敗した役人や権力者に苦しめられた武人、役人、盗賊らが、それぞれの事情から罪人となり梁山泊へ集まる。宋江を中心に百八人の好漢が結束し、官軍と戦いながら独自の秩序を築く。やがて朝廷から招安を受け、国家のために別の反乱軍や外敵と戦う道を選ぶ。","appeal":"個性の強い豪傑たちの登場譚と活劇が圧倒的。体制に反抗する痛快さと、最終的に体制へ回収される悲劇が共存する。","recommend":"アウトローの群像劇が好きな人／武侠や冒険活劇の源流を読みたい人／中国四大奇書に挑戦したい人","before":"版によって七十回、百回、百二十回など内容が異なる。暴力的で残酷な場面や、現代では差別的な表現もある。まず主要人物の登場回を楽しむ方法もよい。","question":"不正な国家に反抗した者が、その国家から認められることを望むのは矛盾なのか。","mood":[1,3,3,5],"year":1400,"yearNote":"成立推定"},{"no":474,"phase":19,"phaseTitle":"古典と世界の大河","category":"日本","title":"とりかへばや物語","author":"作者未詳","region":"日本","era":"平安","genre":"古典物語","difficulty":5,"length":"長","why":"男女の性別役割が入れ替わる宮廷物語。\n平安時代の作品から、ジェンダーが社会的役割であることを考えられる。","hook":"男として育てられた姫と、女として育てられた若君。入れ替わった性を生きる二人の運命。","synopsis":"男らしい性格の姫君と、女らしい性格の若君を持った父は、二人を世間の期待とは逆の性として宮廷へ出仕させる。姫君は男性として出世し、若君は女性として結婚するが、恋愛や妊娠を通じて秘密の維持が困難になる。二人はそれぞれの身体と社会的役割の間で揺れ、やがて「本来」の位置へ戻ろうとする。","appeal":"平安時代の物語とは思えないほど大胆に性別と役割のずれを描く。自由な越境の魅力と、制度が個人を元へ戻そうとする力の両方が見える。","recommend":"ジェンダーを扱う古典に関心がある人／宮廷恋愛と入れ替わり物語が好きな人／現代的な問いを古典から考えたい人","before":"現代のトランスジェンダー概念とそのまま同一視はできない。物語が性自認、身体、服装、社会的役割をどう区別しているかを見るとよい。","question":"物語の結末で二人が元の性役割へ戻ることは幸福なのか、それとも社会への屈服なのか。","mood":[1,2,3,5],"year":1100,"yearNote":"成立推定"},{"no":475,"phase":19,"phaseTitle":"古典と世界の大河","category":"海外","title":"西遊記","author":"呉承恩","region":"中国","era":"16世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"僧と妖怪たちの旅を、冒険・宗教・風刺で描く中国幻想文学の大作。\nエピソード型長編と、異形の仲間たちの成長を楽しめる。","hook":"石から生まれた孫悟空が、三蔵法師を守って天竺へ。八十一難を越える冒険と修行の旅。","synopsis":"天地の霊気を受けた石から生まれた孫悟空は、仙術を学び天界で大暴れした末、五行山に封じられる。数百年後、経典を求めて天竺へ向かう三蔵法師に救われ、猪八戒、沙悟浄とともに旅の護衛となる。妖怪の誘惑や策略と戦いながら、一行は長安からインドまでの長い道を進む。","appeal":"変身自在の悟空と妖怪たちの奇想天外な戦いが楽しい一方、仲間の欠点や欲望を通じて修行の意味を描く。東アジアの物語文化へ与えた影響も巨大。","recommend":"冒険ファンタジーが好きな人／孫悟空の原典を知りたい人／笑いと宗教寓話を両方楽しみたい人","before":"全百回の長編なので抄訳でもよい。仏教、道教、民間信仰が混ざっており、純粋な仏教教典ではない。三蔵より悟空が中心に見えるのも作品の面白さ。","question":"悟空が自由を失ってまで旅を続けることは、罰なのか、それとも成長の機会なのか。","mood":[1,2,3,5],"year":1592,"yearNote":"成立推定"},{"no":476,"phase":20,"phaseTitle":"最終ダンジョン","category":"日本","title":"堤中納言物語","author":"作者未詳","region":"日本","era":"平安","genre":"短編物語集","difficulty":5,"length":"中","why":"機知に富む短編を集めた平安後期の物語集。\n長編古典とは違う、落ちや反転を備えた短編の面白さを味わえる。","hook":"虫好きの姫君、逢えそうで逢えない恋人たち。常識から少し外れた人々を描く十一の短編。","synopsis":"平安後期に成立した十一編の短編集。毛虫を愛で化粧を嫌う姫君を描く「虫めづる姫君」、二人の姫に同時に近づこうとする男の失敗、手紙や噂が引き起こす恋のすれ違いなど、宮廷社会の多様な人物と事件を扱う。各編で語り口や主題が異なる。","appeal":"理想化された王朝世界だけでなく、変わり者、失敗、滑稽さを描く自由さがある。「虫めづる姫君」は個性と社会規範を考える作品として今も新鮮。","recommend":"短い古典を少しずつ読みたい人／平安時代のユーモアに触れたい人／型にはまらない女性像に関心がある人","before":"作品ごとに独立しているので好きな話から読める。「堤中納言」は特定の作者名ではなく、複数作者の作品を集めた可能性が高い。","question":"「変わった人」とされるのは本人の性質によるのか、それとも周囲の常識が狭いからなのか。","mood":[1,1,3,5],"year":1050,"yearNote":"成立推定"},{"no":477,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"吶喊","author":"魯迅","region":"中国","era":"20世紀","genre":"世界文学","difficulty":5,"length":"短編集","why":"革命前後の中国社会と人々の精神を描く魯迅の代表短編集。\n社会変革を阻む習慣や自己欺瞞を、鋭い風刺から理解できる。","hook":"狂人が見抜いた「人を食う」社会。近代中国の目覚めと絶望を刻んだ短編集。","synopsis":"中国近代の転換期を描く短編集。「狂人日記」では、周囲の言葉や歴史書から人々が互いを食う社会の構造を読み取る男を描く。「阿Q正伝」では、どんな敗北も心の中で勝利へ変える阿Qが革命の波に翻弄される。古い道徳、無知、権力への服従を鋭く風刺する。","appeal":"短く平明な物語の中に、社会批判と人間への痛い視線がある。弱者を単純に美化せず、抑圧された人も別の弱者を傷つける構造を描く。","recommend":"中国近代文学の入口を探している人／風刺と社会批判の短編が好きな人／「狂人日記」「阿Q正伝」を原作で読みたい人","before":"清朝崩壊後も古い身分意識が残る時代が背景。魯迅が批判する「国民性」を中国人の固定的本質と受け取らず、変革を促す自己批判として読む。","question":"自分が抑圧されていることを認めず、心の中で勝利したことにする態度は、生存の知恵か変化を妨げる逃避か。","mood":[1,3,3,5],"year":1923},{"no":478,"phase":20,"phaseTitle":"最終ダンジョン","category":"日本","title":"今昔物語集","author":"作者未詳","region":"日本","era":"平安","genre":"説話集","difficulty":5,"length":"超長","why":"日本・中国・インドの説話を集め、庶民から僧侶まで幅広く描く。\n物語が口承され変化する仕組みと、中世の世界観を知ることができる。","hook":"仏、鬼、盗賊、貴族、庶民。千を超える説話が、人間世界の善悪と奇怪さを映し出す。","synopsis":"インド、中国、日本の説話を集めた平安末期の大説話集。「今は昔」で始まり、仏教の因果応報、僧侶の奇跡、武士の活躍、盗賊、恋愛、動物や鬼の怪異まで、多様な物語を収める。高貴な人物だけでなく、名もない庶民の生活や欲望も生々しく描かれる。","appeal":"短い話の一つ一つに、当時の人々の恐怖、笑い、信仰が凝縮されている。後世の小説や映画の素材になった原話を発見する楽しみもある。","recommend":"怪談や説話が好きな人／古代・中世の庶民生活を知りたい人／短編を拾い読みしたい人","before":"全三十一巻を通読する必要はない。芥川龍之介作品の原話など興味のある話から読める。残酷描写や当時の差別観を含む説話もある。","question":"因果応報を語る物語は、人を倫理的にするのか、それとも不幸を本人のせいにしてしまうのか。","mood":[1,2,3,4],"year":1120,"yearNote":"成立推定"},{"no":479,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"彷徨","author":"魯迅","region":"中国","era":"20世紀","genre":"世界文学","difficulty":5,"length":"短編集","why":"近代中国の孤独や挫折を描く短編集。\n革命の理念だけでは救われない個人の内面を読む視点が得られる。","hook":"革命後も変わらない社会で、人々は希望を探しながら疲れ、孤独になり、沈黙していく。","synopsis":"『吶喊』に続く短編集。辛亥革命後の中国を舞台に、知識人、農民、女性たちが古い制度と新しい時代の間で行き場を失う姿を描く。「祝福」では寡婦祥林嫂が迷信と社会規範によって追い詰められ、「孤独者」では反抗的な知識人が周囲との断絶を深める。","appeal":"『吶喊』の鋭い叫びよりも、変革への期待が薄れた後の疲労と寂しさが濃い。個人の善意だけでは変えられない社会構造を静かに描く。","recommend":"魯迅をさらに読み進めたい人／革命後の失望を描く文学に関心がある人／暗く余韻の深い短編が好きな人","before":"先に『吶喊』を読むと作風の変化が分かりやすい。登場人物の悲劇を迷信だけの問題にせず、家族、経済、共同体の圧力と結びつけて読む。","question":"社会を変えようとした人が孤立したとき、理想を守り続けることにはどんな意味があるのか。","mood":[1,3,3,4],"year":1926},{"no":480,"phase":20,"phaseTitle":"最終ダンジョン","category":"日本","title":"平家物語","author":"作者未詳","region":"日本","era":"鎌倉","genre":"軍記物語","difficulty":5,"length":"超長","why":"平家一門の栄華と滅亡を、無常観と語りのリズムで描く軍記物語。\n歴史を勝敗だけでなく、滅びの美と記憶から読む感覚が身につく。","hook":"祇園精舎の鐘の声。栄華を誇った平家が滅びるまでを、戦と哀しみの響きで語る。","synopsis":"平清盛を中心に権勢を極めた平家一門が、反発する武士や寺社勢力との争いを経て没落していく。源頼朝・義経ら源氏の挙兵、木曾義仲の進軍、一ノ谷、屋島、壇ノ浦の合戦を描きながら、敵味方双方の武将、女性、子どもの運命を語る。すべては移ろうという無常観が全編を貫く。","appeal":"合戦の迫力だけでなく、滅びる者への深い哀れがある。琵琶法師の語りに由来するリズムと名文、数々の人物の最期が日本文化に残り続けている。","recommend":"軍記物語や歴史小説が好きな人／日本中世の無常観に触れたい人／音読したくなる古典を読みたい人","before":"現代語訳と原文の名場面を併読するとよい。史実そのものではなく、長い伝承と語りの中で形づくられた物語。人物系図と合戦地図があると読みやすい。","question":"滅びる者を美しく語ることは、戦争の悲惨さを伝えるのか、それとも戦いを美化してしまうのか。","mood":[1,3,3,5],"year":1300,"yearNote":"成立推定"},{"no":481,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"駱駝祥子","author":"老舎","region":"中国","era":"20世紀","genre":"世界文学","difficulty":5,"length":"中","why":"北京の車夫の人生を通し、貧困と都市社会の非情さを描く。\n努力すれば報われるという物語を、社会構造から問い直せる。","hook":"まじめに働けば人生は変えられる――そう信じた青年を、都市の貧困が少しずつ壊していく。","synopsis":"農村から北京へ出てきた祥子は、自分の人力車を持ち、誰にも頼らず働くことを夢見る。酒も賭博も避け、若さと体力だけを頼りに金を貯めるが、戦乱、搾取、裏切りによって努力の成果を何度も奪われる。車夫として自立しようとする一人の青年が、巨大都市の不公平な仕組みの中で希望を失っていく過程を描く。","appeal":"祥子の転落を性格の弱さだけで説明せず、貧困が人の誇りや倫理をどう削るかまで描く点が鋭い。北京の街路、季節、車夫の身体感覚が濃密で、社会小説でありながら一人の人間の悲劇として迫ってくる。","recommend":"努力と社会構造の関係を考えたい人／近代中国の都市生活に関心がある人／救いの少ない社会派小説を読める人","before":"題名の祥子は主人公の名前で、駱駝は物語前半の出来事からついたあだ名。彼の変化を単純な堕落として裁かず、何が選択肢を奪ったのかを見ると深まる。","question":"努力が報われない社会で、人はどこまで自分の生き方に責任を負えるのか。","mood":[5,5,4,5],"year":1937},{"no":482,"phase":20,"phaseTitle":"最終ダンジョン","category":"日本","title":"太平記","author":"作者未詳","region":"日本","era":"室町","genre":"軍記物語","difficulty":5,"length":"超長","why":"南北朝の動乱を、多数の武将と政争から描く大規模な軍記物語。\n不安定な正統性と、歴史が語りによって整理される過程を読める。","hook":"天皇が二人、将軍も次々に交代する。正義の所在さえ揺れる時代を描いた巨大な戦乱絵巻。","synopsis":"鎌倉幕府の滅亡から建武の新政、南北朝の対立へと続く激動を、後醍醐天皇、楠木正成、足利尊氏、新田義貞ら多数の人物を通して描く。忠義と野心、勝利と裏切りが入り乱れ、昨日の味方が今日の敵になる。個人の英雄譚を超えて、政治秩序そのものが崩れ、作り直されていく時代の混沌を語る軍記物語。","appeal":"合戦の迫力だけでなく、政変、策略、怨霊、説話まで何でも呑み込むスケールが魅力。誰が正統なのか決着しないまま物語が進むため、歴史が単純な善悪では動かないことを実感できる。","recommend":"日本中世史が好きな人／群像劇や大河ドラマが好きな人／『平家物語』の先の時代を読みたい人","before":"全巻を最初から精読するより、楠木正成、足利尊氏など関心のある人物や有名場面から入ってよい。史実そのものではなく、後世が南北朝をどう物語化したかを読む作品でもある。","question":"国家の正統性は、血筋、制度、武力、人々の支持のどれによって決まるのか。","mood":[5,5,4,5],"year":1370,"yearNote":"成立推定"},{"no":483,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"四世同堂","author":"老舎","region":"中国","era":"20世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"日中戦争下の北京一家を通し、占領と市民生活を描く大河小説。\n戦争を戦場ではなく、家庭と都市の日常から理解できる。","hook":"占領された北京で、同じ家に暮らす四世代は、誇りを守るか、生き延びるために妥協するかを迫られる。","synopsis":"日中戦争によって日本軍の占領下に置かれた北京。祁老人を中心とする大家族は、戦争が長引く中で、抵抗、沈黙、協力、逃亡という異なる選択をする。食料不足や密告が日常へ入り込み、家族や隣人の関係も変質していく。四世代が同居する一家の生活を通して、占領が都市と市民の心をどう壊していくかを描く大河小説。","appeal":"戦争を英雄の戦場ではなく、買い物、仕事、結婚、近所づきあいの崩壊として描く。多数の人物の弱さと勇気が並ぶため、占領下の人間を抵抗者と協力者の二色だけに分けない厚みがある。","recommend":"戦争下の日常を描く作品を読みたい人／家族を軸にした大河小説が好きな人／近代北京の社会に関心がある人","before":"非常に長いが、一家と近隣住民の群像劇として区切りながら読める。作者自身の戦争体験と愛国意識が強く反映されている点も意識したい。","question":"占領下で生き延びるための妥協は、どこから裏切りになるのか。","mood":[5,5,4,5],"year":1949},{"no":484,"phase":20,"phaseTitle":"最終ダンジョン","category":"日本","title":"義経記","author":"作者未詳","region":"日本","era":"室町","genre":"軍記物語","difficulty":5,"length":"長","why":"源義経の生涯を伝説化し、悲劇の英雄像を作った物語。\n歴史上の人物が後世の想像力でどう変化するかを考えられる。","hook":"歴史上の武将・源義経は、なぜ日本人が愛する『悲劇の英雄』になったのか。","synopsis":"幼少期の牛若丸から、弁慶との出会い、平氏との戦い、兄・頼朝との対立、奥州への逃避行まで、源義経の生涯を伝説と説話を交えて描く。超人的な武勇を持ちながら政治には敗れ、忠実な家臣たちと追われ続ける義経。その悲劇的な最期へ向かう旅を通して、敗者が英雄へ変わっていく過程が語られる。","appeal":"史実では確認できない逸話を大胆に加え、義経と弁慶のイメージを後世に定着させた物語。勝者の歴史とは別に、語り継がれることで敗者が文化的な勝者になる面白さがある。","recommend":"源平合戦や義経が好きな人／伝説が作られる仕組みに興味がある人／冒険と悲劇が結びつく古典を読みたい人","before":"歴史書ではなく、室町時代に成立した伝奇的な物語。『平家物語』『吾妻鏡』との違いを比べると、義経像がどう作られたか見えやすい。","question":"人はなぜ、現実の勝者よりも滅びた英雄に心を引かれるのか。","mood":[4,5,5,5],"year":1400,"yearNote":"成立推定"},{"no":485,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"赤い高粱","author":"莫言","region":"中国","era":"20世紀","genre":"世界文学","difficulty":5,"length":"長","why":"一族と土地の歴史を、戦争・欲望・幻想が入り混じる語りで描く。\n中国現代文学の土着的な力と、暴力的な歴史を五感で読める。","hook":"赤い高粱畑に刻まれた、祖父母の愛と戦争と血の記憶。美しく、野蛮で、生命力に満ちた一族史。","synopsis":"語り手は、山東省の高密東北郷で生きた祖父母たちの過去をたどる。酒造り、略奪、恋愛、抗日戦争が入り混じり、家族の記憶は英雄譚にも残酷な伝説にも変わっていく。高粱畑を舞台に、土地に根ざした人々の欲望と暴力、死と再生を、時間を行き来する語りで描く連作的長編。","appeal":"匂い、色、血、酒、土の感触まで押し寄せるような文章が圧倒的。歴史を整然と説明せず、家族の誇張された記憶として語ることで、神話と現実の境界を揺らす。","recommend":"土着的で生命力の強い文学が好きな人／戦争を神話的な語りで読みたい人／莫言の代表作に挑戦したい人","before":"時系列は直線的ではなく、語り手の記憶が何度も前後する。残酷な場面も多い。事実確認より、語り継がれるうちに歴史がどう変形するかを味わいたい。","question":"家族の記憶が誇張や創作を含んでいても、それは歴史と呼べるのか。","mood":[5,5,5,5],"year":1986},{"no":486,"phase":20,"phaseTitle":"最終ダンジョン","category":"日本","title":"好色一代男","author":"井原西鶴","region":"日本","era":"江戸","genre":"浮世草子","difficulty":5,"length":"中","why":"一人の男の色恋遍歴を通し、江戸町人社会を活写する浮世草子。\n性愛を道徳だけでなく、経済・都市文化から読む視点が得られる。","hook":"七歳から六十歳まで、愛欲だけを追い続けた男の一生。笑いと誇張で江戸の都市文化を映し出す。","synopsis":"京都の裕福な家に生まれた世之介は、幼い頃から女性への関心が強く、成長すると各地を巡って恋と遊興を重ねる。身分も年齢も異なる多くの相手との出会いを通して、遊郭、町人社会、金銭、人情の姿が次々に描かれる。理想の恋を探す物語ではなく、欲望に生涯を賭けた人物を戯画化した浮世草子。","appeal":"一人の人生を年代順に追う形式の中へ、江戸前期の風俗を大量に詰め込んだ勢いがある。現代の倫理観では問題のある描写も多いが、欲望と消費が結びつく都市文化を観察する作品として面白い。","recommend":"江戸の町人文化を知りたい人／風俗を描く古典に興味がある人／誇張された主人公を距離を置いて楽しめる人","before":"性愛を扱うが、現代的な恋愛小説ではない。女性の描かれ方や身分制度には時代的な偏りがあるため、主人公を理想化せず、風刺の対象として読む必要がある。","question":"世之介は自由に欲望を生きた人物なのか、それとも欲望から逃れられなかった人物なのか。","mood":[4,3,5,4],"year":1682},{"no":487,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"生死疲労","author":"莫言","region":"中国","era":"21世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"人間が動物へ転生しながら中国現代史を生きる壮大な物語。\n輪廻という形式で、土地・政治・生命の連続性を読むことができる。","hook":"地主だった男が、ロバ、牛、豚、犬、猿へ転生しながら、中国五十年の激変を見届ける。","synopsis":"土地改革で処刑された地主・西門鬧は、冥界で無実を訴え続けた末、人間ではなくロバとして現世へ戻される。その後も牛、豚、犬、猿へと転生し、自分の家族と村が革命、人民公社、文化大革命、市場経済を経験する姿を見る。動物の視点と人間たちの物語が交差し、土地をめぐる半世紀を描く壮大な年代記。","appeal":"悲惨な政治史を、動物の感覚、下品な笑い、民間説話のような誇張で語る発想が強烈。思想の正しさより、制度が変わっても続く欲望、家族、土地への執着を描き出す。","recommend":"長大で奇想に富む物語が好きな人／中国現代史を文学から読みたい人／笑いと残酷さが同居する作品を読める人","before":"中国近現代史の大まかな流れを知っていると読みやすい。語り手や視点が入れ替わり、作者自身を思わせる人物も登場するため、写実ではなく自己言及的な物語として楽しみたい。","question":"政治体制が何度変わっても残り続ける、人間の最も根本的な欲望は何か。","mood":[5,5,5,5],"year":2006},{"no":488,"phase":20,"phaseTitle":"最終ダンジョン","category":"日本","title":"日本永代蔵","author":"井原西鶴","region":"日本","era":"江戸","genre":"浮世草子","difficulty":5,"length":"中","why":"商人たちの成功と失敗を描き、江戸の経済倫理を示す。\n古典文学から商売・信用・欲望の具体的な姿を学べる。","hook":"金を儲ける者と失う者。その差は運か、才覚か、それとも信用か。江戸商人たちの成功と破産の物語。","synopsis":"全国各地の商人や町人を主人公に、富を築いた者、欲に目がくらんだ者、倹約で家を立て直した者など、多様な金銭譚を集める。商売の工夫、相続、借金、投機、人間関係を通して、貨幣経済が発達した江戸社会の現実を描く短編連作。成功談に見えても、富の不安定さや人間の欲深さが皮肉に示される。","appeal":"三百年以上前の作品なのに、節約、信用、起業、見栄、破産といった問題が驚くほど現代的。単なる勤勉礼賛ではなく、成功者の抜け目なさや社会の不公平も見える。","recommend":"経済や商売を扱う文学に興味がある人／短い古典から西鶴を読みたい人／江戸の生活感を知りたい人","before":"各話は独立しているので、順番にこだわらず読める。教訓話のように見えて、語り手が成功者を完全には称賛していない皮肉にも注目したい。","question":"富を築くために必要な才覚と、他者を出し抜く狡猾さはどこで分かれるのか。","mood":[4,3,4,4],"year":1688},{"no":489,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"大地","author":"パール・バック","region":"アメリカ／中国","era":"20世紀","genre":"世界文学","difficulty":5,"length":"長","why":"中国農民一家の生活を通し、土地・貧困・家族の変化を描く。\n近代中国を生活史として読む入口と、土地への執着を理解できる。","hook":"飢えも洪水も戦乱も越えて、農民は土地を手放さない。中国の大地と一族の盛衰を描く大河小説。","synopsis":"貧しい農民・王龍は、奴隷として働いていた阿蘭を妻に迎え、二人で土地を耕し始める。飢饉によって南方へ逃れる苦難を経験しながらも、王龍は故郷へ戻り、少しずつ土地と富を増やしていく。しかし豊かになるほど、家族の欲望と亀裂も大きくなる。農民一家の上昇と変質を通して、土地が人間に与える力を描く。","appeal":"王龍と阿蘭の労働が具体的に描かれ、土地が財産以上に生存と尊厳の基盤であることが伝わる。同時に、貧者だった王龍が富を得ると他者を傷つける側へ回る皮肉も鋭い。","recommend":"家族の盛衰を描く大河小説が好きな人／農民の生活を中心に歴史を読みたい人／読みやすい世界文学の長編を探している人","before":"中国を舞台にしたアメリカ人作家の作品であり、評価と同時に外部者の視点による限界も論じられてきた。阿蘭の沈黙や扱われ方にも注意したい。","question":"貧困から抜け出すことは、人を自由にするのか、それとも新しい欲望に縛るのか。","mood":[5,4,4,5],"year":1931},{"no":490,"phase":20,"phaseTitle":"最終ダンジョン","category":"日本","title":"雨月物語","author":"上田秋成","region":"日本","era":"江戸","genre":"怪異小説","difficulty":5,"length":"中","why":"怪異譚の形で、欲望・執念・因果を格調高い文体に凝縮する。\n日本幻想文学の源流と、古典的な恐怖の作り方を味わえる。","hook":"死者との約束、執念深い亡霊、化けた狐。美しい文章で、人間の欲望が怪異へ変わる九つの物語。","synopsis":"戦乱を避けて帰郷した男を待つ妻、約束を守るため命を超えて現れる友、僧を誘惑する妖女など、中国と日本の古典説話をもとにした九編を収める。怪異は突然現れるのではなく、人間の愛、欲望、裏切り、執着から生まれる。幻想的な出来事を格調高い文体で描いた江戸怪異文学の代表作。","appeal":"ただ怖いだけではなく、怪異の背後に人間の感情の強さがある。静かな情景から異界へ移る語りが美しく、後世の幻想文学や怪談に与えた影響も大きい。","recommend":"怪談や幻想文学が好きな人／短編で古典を味わいたい人／美しい文体と不気味さの両方を楽しみたい人","before":"原文は和漢混交で難しいため、現代語訳から入ってよい。各話の典拠を知らなくても楽しめるが、怪異が誰のどんな欲望に応えているかを見ると深まる。","question":"怪異は人間の外から来るものなのか、それとも人間の感情が生み出すものなのか。","mood":[4,5,5,5],"year":1776},{"no":491,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"人間の大地","author":"プラムディヤ・アナンタ・トゥール","region":"インドネシア","era":"20世紀","genre":"世界文学","difficulty":5,"length":"長","why":"植民地支配下のインドネシアで、青年が教育と民族意識に目覚める。\n植民地の近代化が自由と差別を同時にもたらす構図を理解できる。","hook":"植民地社会で、西洋教育を受けた青年は、自分が『人間』として扱われていないことに気づく。","synopsis":"十九世紀末、オランダ領東インド。ジャワ人青年ミンケは、西洋式学校で学び、オランダ語で文章を書く知識人として成長している。彼は聡明な現地人女性ニャイ・オントソロとその娘アンネリースに出会い、植民地法と人種差別の現実に直面する。恋愛と家族の危機を通して、教育、言語、民族意識へ目覚めていく青年の物語。","appeal":"近代教育が解放の道具であると同時に、植民者の価値観を内面化させる装置でもあるという矛盾を描く。特にニャイの知性と抵抗が鮮烈で、誰が文明人と呼ばれるのかを問い返す。","recommend":"植民地主義を扱う文学を読みたい人／成長小説が好きな人／東南アジア近代史への入口を探している人","before":"ブル島四部作の第一作。作者が政治犯として拘禁中、仲間へ口述した物語をもとに成立した。固有の身分区分や植民地法は、巻末解説を参照すると理解しやすい。","question":"支配者の言語と教育を身につけることは、解放への第一歩なのか、支配への同化なのか。","mood":[5,5,4,5],"year":1951},{"no":492,"phase":20,"phaseTitle":"最終ダンジョン","category":"日本","title":"東海道中膝栗毛","author":"十返舎一九","region":"日本","era":"江戸","genre":"滑稽本","difficulty":5,"length":"超長","why":"江戸から伊勢への旅を、弥次喜多の失敗と笑いで描く滑稽本。\n旅文学・会話・方言を通して、江戸庶民文化の活気を楽しめる。","hook":"江戸から伊勢へ向かう弥次さん喜多さん。旅の名所より、失敗と勘違いばかりが記憶に残る。","synopsis":"江戸っ子の弥次郎兵衛と喜多八は、東海道を通って伊勢参りへ出発する。宿場ごとの食事や風習を楽しむ一方、見栄を張り、勘違いし、いたずらを仕掛けては失敗する。道中の人々との会話や各地の名物を交えながら、旅の非日常と庶民の笑いを描く長編滑稽本。","appeal":"名所案内とコメディが一体になっており、江戸時代の旅を追体験できる。弥次喜多の掛け合いは現代の漫才にも近く、古典ながら失敗の構造が分かりやすい。","recommend":"旅と笑いの物語が好きな人／江戸庶民の生活を知りたい人／会話中心の古典を読みたい人","before":"原作は続編を含めると非常に長いので、抄訳や現代語訳で代表的な場面から読んでもよい。地域や身分を笑いの対象にする古い表現もある。","question":"旅の価値は目的地へ着くことにあるのか、それとも道中の失敗や出会いにあるのか。","mood":[3,2,5,3],"year":1802},{"no":493,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"すべての民族の子","author":"プラムディヤ・アナンタ・トゥール","region":"インドネシア","era":"20世紀","genre":"世界文学","difficulty":5,"length":"長","why":"植民地社会で新聞活動に進む青年を通し、言論と民族運動を描く。\n知識人が社会的責任を引き受ける過程を、歴史の内側から読める。","hook":"知識人は文章を書くだけで社会を変えられるのか。青年は机を離れ、植民地の現実へ踏み出す。","synopsis":"『人間の大地』に続き、ミンケは新聞や執筆を通して植民地社会の不正を伝えようとする。農民の土地を奪う企業、民族や階級によって分断された人々と出会う中で、彼は自分の知識が現実から離れていたことを知る。個人的な悲しみを抱えながら、ジャワ人だけでなく、支配されるすべての民族への連帯を考え始める。","appeal":"主人公が正義に目覚めて終わるのではなく、誰のために、どの言語で書くのかという難題に直面する。知識人の善意と傲慢さを同時に描き、文学と政治の関係を具体的に問う。","recommend":"『人間の大地』を読んだ人／ジャーナリズムと社会運動に関心がある人／知識人の責任を考えたい人","before":"ブル島四部作の第二作なので、第一作から読むことを推奨。民族名や政治勢力が増えるため、人物表や時代背景を確認しながら読むとよい。","question":"他者の苦しみを代わりに語ることは連帯なのか、それとも別の支配になり得るのか。","mood":[5,5,4,5],"year":1979},{"no":494,"phase":20,"phaseTitle":"最終ダンジョン","category":"日本","title":"南総里見八犬伝","author":"曲亭馬琴","region":"日本","era":"江戸","genre":"読本","difficulty":5,"length":"超長","why":"八つの珠を持つ犬士たちの冒険を描く、日本最大級の伝奇長編。\n伏線と人物群を長期に管理する江戸の物語技術を体感できる。","hook":"八つの珠に導かれ、離れ離れの八犬士が集う。日本最長級の伝奇小説が描く、運命と因果の冒険。","synopsis":"安房里見家の姫・伏姫と神犬八房をめぐる因縁から、仁・義・礼・智・忠・信・孝・悌の文字を刻んだ珠を持つ八人の若者が生まれる。各地で別々に育った犬士たちは、奇縁と戦いを重ねながら互いを見いだし、里見家を救うために集結していく。武侠、恋愛、怪異、復讐を盛り込んだ壮大な伝奇長編。","appeal":"人物が次々に結びつく伏線回収と、八犬士が集結する快感は現代の長期連載作品にも通じる。勧善懲悪を掲げながら、性別、血筋、名前、運命が揺れ動く複雑さもある。","recommend":"長大な冒険ファンタジーが好きな人／仲間集めの物語に弱い人／江戸のエンターテインメント小説を体験したい人","before":"原作は九輯百六冊に及ぶため、現代語訳の抄本や入門版からでもよい。八犬士の名前と珠の文字をメモすると混乱しにくい。","question":"八犬士の善は本人の選択によるものか、それとも生まれながらの運命によるものか。","mood":[5,4,5,5],"year":1814},{"no":495,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"悪魔の詩","author":"サルマン・ラシュディ","region":"インド／イギリス","era":"20世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"啓示を受けた主人公と移民家族を通し、宗教・国家・物語を大胆に再構成する。\n表現の自由と、神聖な物語を文学が扱う難しさを考えられる。","hook":"空から落ちた二人の俳優が、天使と悪魔へ変貌する。移民、信仰、物語が爆発する問題作。","synopsis":"ハイジャックされた旅客機から奇跡的に生還したインド系俳優ジブリールとサラディン。二人の身体には不可思議な変化が起こり、一方は天使的、もう一方は悪魔的な姿へ近づく。現代ロンドンの移民社会、預言者を思わせる人物の夢、巡礼する村人たちの物語が交差し、信仰、アイデンティティ、善悪の境界を揺さぶる。","appeal":"一つの意味に収まらない語りの奔流が魅力。宗教への風刺だけでなく、移民が名前、発音、身体まで変えて生きる苦しさを、変身譚として描いている。","recommend":"複雑なポストコロニアル文学に挑戦したい人／移民とアイデンティティの問題に関心がある人／幻想と風刺が混ざる長編が好きな人","before":"イスラム教をめぐる描写が国際的な論争を招いた作品。宗教知識だけでなく、英印関係や移民社会が重要で、語り手を作者の直接の主張と同一視しないこと。","question":"信仰や故郷について物語り直す自由は、共同体への冒瀆とどこで衝突するのか。","mood":[5,5,5,5],"year":1988},{"no":496,"phase":20,"phaseTitle":"最終ダンジョン","category":"日本","title":"椿説弓張月","author":"曲亭馬琴","region":"日本","era":"江戸","genre":"読本","difficulty":5,"length":"超長","why":"源為朝の伝説を、異国冒険と超人的活躍へ膨らませた読本大作。\n史実と虚構を自在に混ぜる江戸後期のエンターテインメント性を味わえる。","hook":"源為朝は海を渡り、怪物を倒し、王国の運命を変える。史実を大胆に拡張した江戸の英雄ファンタジー。","synopsis":"剛勇で知られる武将・源為朝の少年期から、保元の乱、伊豆大島への流刑、その後の海上冒険までを描く。史実では自害したとされる為朝を生き延びさせ、琉球を思わせる異国へ渡らせることで、妖術、怪異、戦争、王位継承をめぐる壮大な物語へ展開する。","appeal":"歴史の空白へ想像力を注ぎ込み、日本の武将を国境を越える冒険者へ変えたスケールが楽しい。挿絵と文章が協力して世界を作る、江戸後期のメディアミックス的な魅力もある。","recommend":"伝奇時代小説が好きな人／史実改変ものを楽しみたい人／『八犬伝』以外の馬琴を読みたい人","before":"琉球や異民族の描写には江戸時代の偏見と想像が含まれる。史実の為朝伝ではなく、当時の日本人が外部世界をどう空想したかを読む作品。","question":"史実を離れた英雄物語は、歴史理解を損なうのか、それとも別の文化的真実を伝えるのか。","mood":[5,4,5,4],"year":1807},{"no":497,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"2666","author":"ロベルト・ボラーニョ","region":"チリ","era":"21世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"未解決の女性殺害、文学者たち、欧州の戦争を五部構成で結ぶ巨大作。\n世界の暴力を一つの原因に還元せず、断片のまま見渡す読書体力が鍛えられる。","hook":"文学者たちの探索、謎の作家、消え続ける女性たち。二十世紀の暴力が五つの物語をのみ込む。","synopsis":"謎めいたドイツ人作家アルチンボルディを研究する四人の批評家、メキシコの国境都市サンタテレサで起こる女性連続殺人、戦争を生き延びた一人の男など、五部からなる物語がゆるやかにつながる。文学への情熱と大量の死が並置され、登場人物たちは世界の中心にあるはずの答えを探し続ける。","appeal":"探偵小説のように謎を提示しながら、完全な解答を拒む巨大な構造が圧倒的。特に反復される殺人記録は、個人の悲劇が統計へ変わる恐怖と、文学が暴力を前に何をできるかを突きつける。","recommend":"巨大で未完性のある文学が好きな人／文学と歴史的暴力の関係を考えたい人／複数の物語が遠くでつながる作品を楽しめる人","before":"作者の死後に刊行された長編で、明快な解決はない。第四部には女性殺害の記述が長く続く。五部を別々の小説のように区切って読むと進めやすい。","question":"世界の暴力を記録することは、犠牲者を忘れないための行為か、それとも苦痛を反復消費することか。","mood":[5,5,4,5],"year":2004},{"no":498,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"インフィニット・ジェスト","author":"デイヴィッド・フォスター・ウォレス","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"依存症・娯楽・教育・家族を、膨大な注釈と人物群で描く現代アメリカの難作。\n情報過多の時代を形式そのものにした小説を読み抜く力がつく。","hook":"あまりに面白く、見た者が生きることをやめてしまう映像。その行方をめぐり、依存だらけの社会が回り始める。","synopsis":"近未来の北米。テニス選手養成学校に通う少年ハル、薬物依存者の回復施設に集う人々、謎の映像作品を狙う工作員たちの物語が交錯する。広告によって年の名前まで売られた社会で、才能、家族、娯楽、依存が互いに絡み合う。膨大な脚注と時間の断片を通じ、人間が快楽と孤独にどう支配されるかを描く。","appeal":"難解で巨大だが、中心にあるのは『楽しさを求めすぎると、なぜ生きられなくなるのか』という切実な問い。滑稽な細部と深い悲しみが隣り合い、依存症者の会話には強い人間味がある。","recommend":"構造の複雑な現代小説に挑戦したい人／依存、娯楽、孤独を考えたい人／脚注や断片を組み立てる読書が好きな人","before":"物語は時系列順ではなく、重要な出来事が直接描かれないことも多い。脚注は飛ばさず本文の一部として読む。全理解を目指さず、人物ごとの流れを追うのが現実的。","question":"人を苦痛から救うはずの娯楽は、どの瞬間に人から生きる力を奪うのか。","mood":[5,5,4,5],"year":1996},{"no":499,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"失われた時を求めて","author":"マルセル・プルースト","region":"フランス","era":"20世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"一つの味や匂いから過去が蘇る感覚を起点に、記憶・恋愛・社交界を描く超大作。\n時間が意識の中で再構成される過程を、長い文章に身を委ねて味わえる。","hook":"紅茶に浸した菓子の味から、失われた幼年時代が丸ごとよみがえる。記憶と時間を追う世界最長級の小説。","synopsis":"語り手は、社交界、恋愛、芸術、嫉妬、家族との記憶をたどりながら、自分の人生が何だったのかを理解しようとする。幼年期のコンブレー、スワンの恋、ゲルマント家への憧れ、アルベルチーヌとの関係などが、現在の感覚から何度も書き換えられる。最後に、失われた時間を文学によって取り戻す道が見えてくる。","appeal":"大事件より、眠りに落ちる瞬間、名前への憧れ、恋人の一言で生まれる嫉妬など、意識の微細な動きを極限まで追う。記憶は保存された過去ではなく、現在の感覚によって突然再創造されるものだと体験させる。","recommend":"心理描写をじっくり味わいたい人／記憶、恋愛、芸術について考えたい人／長期的な読書プロジェクトを楽しめる人","before":"全七篇の超長編。最初から完璧に理解しようとせず、一日数ページでもよい。長い比喩や社交界の人物関係に迷ったら、筋より語り手の感覚を追う。まず第一篇だけ読む方法もある。","question":"過去は実際に起きた出来事の中にあるのか、それとも思い出す現在の自分が作り直すものなのか。","mood":[5,4,4,5],"year":1913,"yearNote":"第1篇刊行"},{"no":500,"phase":20,"phaseTitle":"最終ダンジョン","category":"海外","title":"ユリシーズ","author":"ジェイムズ・ジョイス","region":"アイルランド","era":"20世紀","genre":"世界文学","difficulty":5,"length":"超長","why":"ダブリンの一日を古代叙事詩に重ね、あらゆる文体を試すモダニズムの頂点。\n小説という形式がどこまで自由になれるかを、これまでの499作を総動員して体験できる。","hook":"1904年6月16日、ダブリンの一日。英雄の冒険は、朝食、仕事、排泄、酒、帰宅へと生まれ変わる。","synopsis":"広告取りのレオポルド・ブルーム、若い芸術家スティーヴン・デダラス、ブルームの妻モリーを中心に、ダブリンの一日を十八の挿話で描く。『オデュッセイア』の旅を下敷きにしながら、街を歩く人々の思考、会話、記憶、欲望が多様な文体で流れ込む。平凡な一日を、人間世界全体に匹敵する冒険へ変える実験小説。","appeal":"章ごとに文体と技法が変わり、新聞、芝居、音楽、内的独白など、言葉そのものが変身し続ける。難解さの奥には、孤独なブルームの優しさ、父と子を求める感情、身体を持って生きる人間への肯定がある。","recommend":"文学表現の限界に挑戦したい人／都市と意識を描く作品が好きな人／長い時間をかけて一冊と付き合いたい人","before":"注釈付きの訳を選び、十八章を一つずつ独立した実験として読む。『オデュッセイア』を先に完読する必要はない。分からない箇所を止まらず通過し、ブルームの移動と感情を軸にすると読み進めやすい。","question":"文学は、特別な事件のない一日をどこまで壮大なものに変えられるのか。","mood":[1,5,5,5],"year":1922}
];

 Object.entries(EX_GENRE_GROUPS).forEach(([group,names])=>names.forEach(name=>{let nos=EX_BOOKS.filter(b=>exGenreMatch(b,name)).map(b=>b.no);addSplitPacks({id:'g-'+name,type:'ジャンルパック',group,icon:EX_ICONS[name]||'📚',name:name+'の旅',desc:name+'に属するEX作品だけを巡り、文学世界を横へ広げる旅。',nos,titles:{beginner:name+'の旅人',mid:name+'の探究者',master:name+'マスター'}})}));

function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{books:{}}}catch(e){return {books:{}}}} function saveState(){localStorage.setItem(KEY,JSON.stringify(state))} function entry(no){if(!state.books)state.books={};if(!state.books[no])state.books[no]={got:false,rating:0,note:'',date:'',shelf:''};let e=state.books[no];if(e.shelf==null)e.shelf='';if(e.date==null)e.date='';if(!e.notes)e.notes={summary:'',scene:'',character:'',theme:'',question:'',ratingReason:'',quotes:'',reflection:e.note||''};if(!Array.isArray(e.sessions))e.sessions=e.date?[{date:e.date,type:'初読'}]:[];if(!e.reading)e.reading={status:e.got?'読了':'未読',startDate:'',currentPage:0,totalPages:0};if(e.note&&!e.notes.reflection)e.notes.reflection=e.note;return e} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function gotCount(list=BOOKS){return list.filter(b=>entry(b.no).got).length} function pct(n,d){return d?Math.round(n/d*100):0} function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}

 else if(/殺人|事件|探偵|警官|刑事|謎|死体|犯罪|容疑|密室/.test(text))focus='事件の謎だけでなく、証言・視点・動機のずれが真相をどう組み立てるか';

 else if(/戦争|革命|帝国|国家|政治|収容所|独裁/.test(text))focus='大きな歴史や制度が、個人の選択と言葉をどう変えてしまうか';
 else if(/少年|少女|子ども|学校|青春|冒険/.test(text))focus='成長の過程で、世界への信頼や自分の居場所がどう作り直されるか';
 else if(/神|神話|伝説|王|叙事詩|古典/.test(text))focus='神話的な型や古い物語が、現代にも残る欲望・運命・共同体をどう映すか';

function hira(s){return String(s).normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[・＝=＝・.．,，'’‘\"“”\-‐‑–—―ー\s]/g,'').toLowerCase()}
function authorReading(name){let n=String(name).normalize('NFKC');return AUTHOR_YOMI[n]||n}
function authorSortKey(name){let n=String(name).normalize('NFKC'),latin=/^[A-Za-z]/.test(n);return {group:latin?0:1,key:latin?hira(n):hira(AUTHOR_YOMI[n]||n)}}
const AUTHOR_COLLATOR=new Intl.Collator('ja',{usage:'sort',sensitivity:'base',numeric:true});
function compareAuthors(a,b){let x=authorSortKey(typeof a==='string'?a:a.name),y=authorSortKey(typeof b==='string'?b:b.name);return x.group-y.group||AUTHOR_COLLATOR.compare(x.key,y.key)||AUTHOR_COLLATOR.compare(typeof a==='string'?a:a.name,typeof b==='string'?b:b.name)}
function authorGroups(){let m={};BOOKS.forEach(b=>{if(!m[b.author])m[b.author]={name:b.author,books:[],regions:{},eras:{},genres:{}};let a=m[b.author];a.books.push(b);a.regions[b.region]=(a.regions[b.region]||0)+1;a.eras[b.era]=(a.eras[b.era]||0)+1;a.genres[b.genre]=(a.genres[b.genre]||0)+1});return Object.values(m).sort(compareAuthors)}
function dominant(obj){return Object.entries(obj).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ja'))[0]?.[0]||'-'}
function authorRead(a){return a.books.filter(b=>entry(b.no).got).length}
function openAuthor(name){selectedAuthor=name;setView('authors')}
function closeAuthor(){selectedAuthor='';renderAuthors();scrollTo({top:0,behavior:'smooth'})}
function renderAuthors(){let groups=authorGroups();if(selectedAuthor){let a=groups.find(x=>x.name===selectedAuthor);if(!a){selectedAuthor='';return renderAuthors()}let read=authorRead(a),first=[...a.books].sort((x,y)=>x.phase-y.phase||x.difficulty-y.difficulty||x.no-y.no)[0],avg=(a.books.reduce((n,b)=>n+Number(b.difficulty||0),0)/a.books.length).toFixed(1);authorsView.innerHTML=`<button class="library-back" onclick="closeAuthor()">← 作家一覧へ</button><div class="panel author-hero"><div class="meta" style="color:#ead8ca">作家図鑑</div><h2>${esc(a.name)}</h2><div>${esc(dominant(a.regions))}・${esc(dominant(a.eras))}</div><div class="xpbar"><i style="width:${pct(read,a.books.length)}%"></i></div><b>${read} / ${a.books.length}作品 読了</b> ${read===a.books.length?'<span class="master-badge">作家制覇</span>':''}</div><div class="profile-grid"><div class="stat-card">登録作品<b>${a.books.length}作</b></div><div class="stat-card">制覇率<b>${pct(read,a.books.length)}%</b></div><div class="stat-card">平均難易度<b>${avg}</b></div><div class="stat-card">主要ジャンル<b style="font-size:14px">${esc(dominant(a.genres))}</b></div></div><div class="panel" style="margin-top:12px"><h3 class="section-title">📖 図鑑の入口</h3><p class="meta">Phase順で最初に配置されている作品</p>${miniCard(first)}</div><div class="panel"><h3 class="section-title">📚 登録作品</h3><div class="author-books">${[...a.books].sort((x,y)=>x.phase-y.phase||x.no-y.no).map(b=>`<div class="author-book"><span>${entry(b.no).got?'✅':'📕'}</span><div><b>『${esc(b.title)}』</b><div class="meta">No.${b.no}・Phase ${b.phase}・${esc(b.era)}・難易度${b.difficulty}</div></div><button class="open-btn" onclick="openDetail(${b.no})">詳細</button></div>`).join('')}</div></div>`;return}let q=authorQuery.toLowerCase(),sort=authorSortMode;let filtered=filterAuthors(groups,q,sort);authorsView.innerHTML=`<div class="panel"><h2 class="section-title">✍️ 作家図鑑</h2><p class="meta">全${groups.length}名。作家ごとの登録作品、読了率、地域、時代、ジャンルを確認できる。</p><div class="author-toolbar"><input id="authorSearch" class="search" placeholder="作家名・地域・時代で検索" value="${esc(authorQuery)}" autocomplete="off" enterkeyhint="search"><select id="authorSort" class="filter"><option value="name" ${sort==='name'?'selected':''}>名前順</option><option value="count" ${sort==='count'?'selected':''}>登録作品数順</option><option value="progress" ${sort==='progress'?'selected':''}>制覇率順</option></select></div><div id="authorCount" class="meta">${filtered.length}名を表示</div></div><div id="authorGrid" class="author-grid">${authorCards(filtered)}</div>`;bindAuthorSearch()}
let authorQuery='',authorSortMode='name',authorSearchTimer=0,authorComposing=false;
function filterAuthors(groups,q,sort){let filtered=groups.filter(a=>[a.name,authorReading(a.name),dominant(a.regions),dominant(a.eras),dominant(a.genres)].join(' ').toLowerCase().includes(q));if(sort==='count')filtered.sort((a,b)=>b.books.length-a.books.length||compareAuthors(a,b));else if(sort==='progress')filtered.sort((a,b)=>pct(authorRead(b),b.books.length)-pct(authorRead(a),a.books.length)||compareAuthors(a,b));else filtered.sort(compareAuthors);return filtered}
function authorCards(list){return list.map(a=>{let r=authorRead(a),p=pct(r,a.books.length);return `<button class="author-card" onclick="openAuthor(decodeURIComponent('${encodeURIComponent(a.name)}'))"><h3>${esc(a.name)} ${r===a.books.length?'<span class="master-badge">MASTER</span>':''}</h3><div class="meta">${esc(dominant(a.regions))}・${esc(dominant(a.eras))}</div><div>${r} / ${a.books.length}作品</div><div class="author-progress"><i style="width:${p}%"></i></div></button>`}).join('')||'<div class="empty">該当する作家はいません。</div>'}
function refreshAuthorResults(){let grid=document.getElementById('authorGrid'),count=document.getElementById('authorCount');if(!grid||!count)return;let filtered=filterAuthors(authorGroups(),authorQuery.toLowerCase(),authorSortMode);grid.classList.add('author-grid-updating');grid.innerHTML=authorCards(filtered);count.textContent=filtered.length+'名を表示';requestAnimationFrame(()=>grid.classList.remove('author-grid-updating'))}
function bindAuthorSearch(){let input=document.getElementById('authorSearch'),sort=document.getElementById('authorSort');if(!input||!sort)return;input.addEventListener('compositionstart',()=>authorComposing=true);input.addEventListener('compositionend',e=>{authorComposing=false;authorQuery=e.target.value;refreshAuthorResults()});input.addEventListener('input',e=>{authorQuery=e.target.value;if(authorComposing)return;clearTimeout(authorSearchTimer);authorSearchTimer=setTimeout(refreshAuthorResults,70)});sort.addEventListener('change',e=>{authorSortMode=e.target.value;refreshAuthorResults()})}
function eraRank(e){if(Object.prototype.hasOwnProperty.call(TIMELINE_YEARS,e))return TIMELINE_YEARS[e];let m=String(e).match(/(\d+)世紀/);return m?(Number(m[1])-1)*100:9999}

function yearLabel(b){if(b.year==null)return '刊行年未登録';return `${b.year}${b.yearNote==='成立推定'?'年頃':'年'}${b.yearNote&&b.yearNote!=='成立推定'?`（${esc(b.yearNote)}）`:''}`}

function bookText(b){return [b.title,b.author,b.genre,b.why,b.hook,b.synopsis,b.appeal,b.recommend,b.before,b.question].join(' ')}

function movementFor(b){let t=bookText(b);if(t.includes('不条理'))return '不条理文学';if(t.includes('植民地'))return 'ポストコロニアル文学';if(t.includes('怪物')||t.includes('ゴシック'))return 'ゴシック文学';if(t.includes('監視')||t.includes('ディストピア'))return 'ディストピア';if(t.includes('成長')||b.genre==='青春')return '教養小説';if(b.era==='19世紀'&&b.category!=='日本')return '写実主義・近代小説';if((b.era==='大正'||b.era==='大正・昭和'||b.era==='昭和前期')&&b.category==='日本')return '日本近代文学';if(b.era==='20世紀'&&b.difficulty>=4)return 'モダニズム';if(b.era==='現代'||b.era==='21世紀')return '現代文学';return b.category==='日本'?'日本文学':'世界文学'}

function openTheme(name){selectedTheme=name;setView('themes')}
let selectedTheme='';
function renderGlossary(){let q=(document.getElementById('glossarySearch')?.value||'').trim().toLowerCase(),items=Object.entries(GLOSSARY).filter(([n,d])=>(n+' '+d.desc+' '+d.era).toLowerCase().includes(q));glossaryView.innerHTML=`<div class="panel"><h2 class="section-title">📘 文学用語図鑑</h2><p class="meta">作品詳細の「文学運動」からも移動できる。難しい用語を短く確認するための入口。</p><input id="glossarySearch" class="search" placeholder="用語・説明を検索" value="${esc(q)}"></div><div class="glossary-grid">${items.map(([n,d])=>{let bs=BOOKS.filter(b=>movementFor(b)===n).slice(0,6);return `<div class="glossary-card" id="gl-${esc(n)}"><h3>${esc(n)}</h3><div class="meta">${esc(d.era)}</div><p>${esc(d.desc)}</p>${bs.length?`<div class="meta">関連作品</div><div>${bs.map(b=>`<button class="link-chip" onclick="openDetail(${b.no})">${esc(b.title)}</button>`).join('')}</div>`:''}</div>`}).join('')}</div>`;glossarySearch.oninput=renderGlossary}
function renderThemes(){let data=THEME_RULES.map(([name])=>{let books=BOOKS.filter(b=>themesFor(b).includes(name));return {name,books}}).filter(x=>x.books.length).sort((a,b)=>b.books.length-a.books.length||a.name.localeCompare(b.name,'ja'));if(selectedTheme){let x=data.find(x=>x.name===selectedTheme);if(!x){selectedTheme='';return renderThemes()}let eras={};x.books.forEach(b=>eras[b.era]=(eras[b.era]||0)+1);themesView.innerHTML=`<button class="library-back" onclick="selectedTheme='';renderThemes()">← テーマ一覧へ</button><div class="panel"><h2>${esc(x.name)}</h2><div class="theme-count">${x.books.length}作品</div><div class="meta">時代や地域を横断して、このテーマがどう描かれるかを見る。</div></div><div class="panel"><h3>時代別</h3>${Object.entries(eras).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<div class="bar-row"><span>${esc(n)}</span><div class="progress"><i style="width:${Math.round(c/x.books.length*100)}%"></i></div><b>${c}</b></div>`).join('')}</div><div class="panel"><h3>作品一覧</h3><div class="related-books">${x.books.sort((a,b)=>a.year-b.year||a.no-b.no).map(b=>`<div class="related-book"><div><b>『${esc(b.title)}』</b><div class="meta">${esc(b.author)}｜${b.year}年｜${esc(movementFor(b))}</div></div><button class="open-btn" onclick="openDetail(${b.no})">詳細</button></div>`).join('')}</div></div>`;return}themesView.innerHTML=`<div class="panel"><h2 class="section-title">🧭 テーマ別マップ</h2><p class="meta">500作品を、内容に含まれる語と作品解説から横断分類。作品は複数テーマに属する。</p></div><div class="theme-grid">${data.map(x=>{let jp=x.books.filter(b=>b.category==='日本').length;return `<button class="theme-card" onclick="openTheme('${esc(x.name)}')"><h3>${esc(x.name)}</h3><div class="theme-count">${x.books.length}作品</div><div class="meta">日本 ${jp}・海外 ${x.books.length-jp}</div></button>`}).join('')}</div>`}

const HISTORY_EVENTS=[
[1000,'jp','平安文化が栄える'],[1192,'jp','鎌倉幕府成立'],[1336,'jp','室町幕府成立'],[1603,'jp','江戸幕府成立'],[1688,'jp','元禄文化の時代'],[1789,'world','フランス革命'],[1804,'world','ナポレオン皇帝即位'],[1861,'world','ロシア農奴解放'],[1868,'jp','明治維新'],[1877,'jp','西南戦争'],[1889,'jp','大日本帝国憲法発布'],[1894,'jp','日清戦争'],[1904,'jp','日露戦争'],[1914,'world','第一次世界大戦開戦'],[1917,'world','ロシア革命'],[1923,'jp','関東大震災'],[1929,'world','世界恐慌'],[1939,'world','第二次世界大戦開戦'],[1945,'world','第二次世界大戦終結'],[1945,'jp','日本の敗戦'],[1947,'jp','日本国憲法施行'],[1964,'jp','東京オリンピック'],[1968,'world','世界的な学生運動'],[1989,'world','ベルリンの壁崩壊'],[1989,'jp','平成開始'],[2001,'world','アメリカ同時多発テロ'],[2011,'jp','東日本大震災'],[2019,'jp','令和開始']
];
let timelineHistory={jp:true,world:true};
function toggleTimelineHistory(k){timelineHistory[k]=!timelineHistory[k];renderTimeline()}
function dailyChallenge(){let day=Math.floor(Date.now()/86400000),rules=[
{name:'世界文学を読む',desc:'海外文学を1冊読了する',test:b=>b.category!=='日本'},
{name:'女性作家を読む',desc:'女性作家の作品を1冊読了する',test:b=>/村田|川上|津村|小川|宮部|角田|吉本|恩田|アトウッド|ウルフ|オースティン|ブロンテ|モリスン|ル=グウィン/.test(b.author)},
{name:'19世紀へ旅する',desc:'19世紀作品を1冊読了する',test:b=>b.year>=1800&&b.year<1900},
{name:'難関へ挑む',desc:'難易度4以上を1冊読了する',test:b=>b.difficulty>=4},
{name:'日本近代文学を読む',desc:'明治・大正・昭和前期の作品を1冊読了する',test:b=>b.category==='日本'&&b.year>=1868&&b.year<1945}
];let r=rules[day%rules.length],today=new Date().toISOString().slice(0,10),done=BOOKS.some(b=>entry(b.no).history?.some(h=>h.date===today)&&r.test(b));return {...r,done,date:today}}
const LIT_TITLES=[
{name:'読書家見習い',icon:'📗',desc:'1冊読了',test:c=>c.n>=1},
{name:'世界文学探検家',icon:'🌍',desc:'海外文学25冊',test:c=>c.world>=25},
{name:'日本文学案内人',icon:'🗾',desc:'日本文学25冊',test:c=>c.jp>=25},
{name:'ロシア文学者',icon:'❄️',desc:'ロシア文学5冊',test:c=>(c.regionGroups['ロシア']||0)>=5},
{name:'明治文学研究家',icon:'🏮',desc:'明治作品5冊',test:c=>BOOKS.filter(b=>entry(b.no).got&&b.era.includes('明治')).length>=5},
{name:'実存主義マスター',icon:'🕯️',desc:'実存主義・不条理文学5冊',test:c=>BOOKS.filter(b=>entry(b.no).got&&['実存主義','不条理文学'].includes(movementFor(b))).length>=5},
{name:'再読王',icon:'🔁',desc:'再読10回',test:c=>BOOKS.reduce((n,b)=>n+Math.max(0,(entry(b.no).history||[]).length-1),0)>=10},
{name:'文学博士',icon:'🎓',desc:'200冊読了',test:c=>c.n>=200}
];
function collectionData(){let sets=[];let add=(name,icon,books)=>sets.push({name,icon,books});
add('ロシア文学','❄️',BOOKS.filter(b=>normRegion(b.region)==='ロシア'));
add('日本近代文学','🏮',BOOKS.filter(b=>b.category==='日本'&&b.year>=1868&&b.year<1945));
add('実存主義・不条理','🕯️',BOOKS.filter(b=>['実存主義','不条理文学'].includes(movementFor(b))));
add('女性作家','✒️',BOOKS.filter(b=>/村田|川上|津村|小川|宮部|角田|吉本|恩田|アトウッド|ウルフ|オースティン|ブロンテ|モリスン|ル=グウィン|クリストフ|デュラス|プラス/.test(b.author)));
add('19世紀文学','🎩',BOOKS.filter(b=>b.year>=1800&&b.year<1900));
add('21世紀文学','💻',BOOKS.filter(b=>b.year>=2000));
['家族','孤独','戦争','成長と青春'].forEach(t=>add('テーマ：'+t,'🧭',BOOKS.filter(b=>themesFor(b).includes(t))));return sets}
function renderCollections(){let sets=collectionData();collectionsView.innerHTML=`<div class="panel adventure-hero"><h2 style="margin-top:0">🗃 文学コレクション</h2><p>地域・時代・思想・テーマごとに読書の埋まり具合を確認する。</p></div><div class="collection-grid">${sets.map(x=>{let n=x.books.filter(b=>entry(b.no).got).length,total=x.books.length,p=Math.round(n/Math.max(1,total)*100);return `<div class="collection-card ${n===total&&total?'complete':''}"><h3>${x.icon} ${esc(x.name)}</h3><div class="collection-progress">${n} / ${total}</div><div class="progress"><i style="width:${p}%"></i></div><div class="collection-blocks">${Array.from({length:Math.min(10,total)},(_,i)=>`<i class="${i<Math.round(n/Math.max(1,total)*Math.min(10,total))?'on':''}"></i>`).join('')}</div><button class="open-btn" onclick="setView('books');setTimeout(()=>{document.getElementById('q').value='${esc(x.name.replace('テーマ：',''))}';filterBooks()},0)">作品を見る</button></div>`}).join('')}</div>`}
function renderTitles(){let c=stats();titlesView.innerHTML=`<div class="panel adventure-hero"><h2 style="margin-top:0">👑 文学称号</h2><p>読書傾向によって解放される特別称号。解除済みは装備できる。</p></div><div class="title-grid">${LIT_TITLES.map(t=>{let ok=t.test(c),eq=equippedTitle()===t.name;return `<div class="title-card ${ok?'':'locked'} ${eq?'equipped':''}"><div style="font-size:28px">${t.icon}</div><h3>${esc(t.name)}</h3><p class="meta">${esc(t.desc)}</p>${ok?`<button class="open-btn" onclick="setTitle('${esc(t.name)}');renderTitles()">${eq?'装備中':'装備する'}</button>`:'<span class="mini-badge">未解除</span>'}</div>`}).join('')}</div>`}
function renderTimeline(){let list=BOOKS.filter(b=>timelineMode==='all'||(timelineMode==='jp'?b.category==='日本':b.category!=='日本')).sort((a,b)=>a.year-b.year||a.no-b.no),years={};list.forEach(b=>(years[b.year]||(years[b.year]=[])).push(b));let events=HISTORY_EVENTS.filter(e=>(e[1]==='jp'&&timelineHistory.jp)||(e[1]==='world'&&timelineHistory.world));events.forEach(e=>years[e[0]]||(years[e[0]]=[]));let ys=Object.keys(years).map(Number).sort((a,b)=>a-b);timelineView.innerHTML=`<div class="panel"><h2 class="section-title">⏳ 文学史・世界史統合年表</h2><p class="meta">作品を西暦1年単位で並べ、日本史・世界史の出来事を同じ時間軸に重ねる。</p><div class="timeline-tabs"><button class="${timelineMode==='all'?'active':''}" onclick="setTimelineMode('all')">すべて</button><button class="${timelineMode==='jp'?'active':''}" onclick="setTimelineMode('jp')">日本文学</button><button class="${timelineMode==='world'?'active':''}" onclick="setTimelineMode('world')">世界文学</button></div><div class="timeline-controls"><button class="${timelineHistory.jp?'active':''}" onclick="toggleTimelineHistory('jp')">日本史</button><button class="${timelineHistory.world?'active':''}" onclick="toggleTimelineHistory('world')">世界史</button></div><div class="meta">${list.length}作品・${ys.length}年</div></div><div class="timeline-era">${ys.map(y=>{let es=events.filter(e=>e[0]===y),bs=years[y];return `<div class="timeline-year"><div class="timeline-year-label"><strong class="year-anchor">${y}年</strong></div><div class="timeline-list">${es.map(e=>`<div class="history-event ${e[1]}"><b>${e[1]==='jp'?'🗾 日本史':'🌐 世界史'}</b>　${esc(e[2])}</div>`).join('')}${bs.sort((a,b)=>a.no-b.no).map(b=>`<button class="timeline-item ${entry(b.no).got?'got':''}" onclick="openDetail(${b.no})"><b>${entry(b.no).got?'✅ ':''}『${esc(b.title)}』</b><span class="meta">${esc(b.author)}｜${esc(b.region)}｜${yearLabel(b)}｜Phase ${b.phase}</span></button>`).join('')}</div></div>`}).join('')}</div>`}

function renderBackup(){let read=BOOKS.filter(b=>entry(b.no).got).length,notes=BOOKS.filter(b=>(entry(b.no).note||'').trim()).length,shelves=BOOKS.filter(b=>entry(b.no).shelf).length;backupView.innerHTML=`<div class="panel"><h2 class="section-title">💾 バックアップと復元</h2><p>読書記録はこのサイトを開いているブラウザ内に保存される。端末変更やブラウザデータ削除に備え、定期的にJSONファイルを書き出してください。</p><div class="backup-summary"><div>読了<b>${read}</b></div><div>ノート<b>${notes}</b></div><div>本棚分類<b>${shelves}</b></div></div><div class="actions"><button class="export" onclick="exportData()">バックアップを書き出す</button><label class="filelabel">バックアップを復元<input id="fileInput" type="file" accept=".json,application/json" onchange="importData(event)"></label></div></div><div class="panel"><h3>復元時の注意</h3><p class="meta">読み込むと、現在の記録はバックアップ内容に置き換わる。念のため、復元前に現在のデータも書き出すことをおすすめします。</p></div><div class="panel"><h3>Ver.2.0について</h3><p class="meta">EXライブラリ、文学賞、統合マイページ、整理されたナビゲーションに対応。既存の読書記録との互換性を維持しています。</p><button class="reset" style="width:100%;border:0;border-radius:12px;padding:12px;color:white" onclick="resetData()">全記録をリセット</button></div>`}
function exportData(){let payload={app:'文学RPG',version:'2.0.0',exportedAt:new Date().toISOString(),data:state},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`文学RPG_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(ev){let f=ev.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let raw=JSON.parse(rd.result),incoming=raw&&raw.data&&raw.app==='文学RPG'?raw.data:raw;if(!incoming||typeof incoming!=='object'||!incoming.books||typeof incoming.books!=='object')throw new Error('invalid');if(!confirm('現在の記録を、このバックアップで置き換えますか？')){ev.target.value='';return}state=incoming;ensureProfile();saveState();toast('バックアップを復元しました');renderBackup()}catch(e){alert('文学RPGの有効なバックアップを読み込めませんでした。')}finally{ev.target.value=''}};rd.readAsText(f)}
function resetData(){if(confirm('読書記録をすべて消しますか？この操作は元に戻せません。')){state={books:{}};ensureProfile();saveState();renderBackup();toast('リセットしました')}} ensureProfile();saveState();
const MAP_REGIONS=[['北米','c-na'],['中南米','c-sa'],['ヨーロッパ','c-eu'],['アフリカ','c-af'],['アジア','c-as'],['オセアニア','c-oc']];
function regionBooks(name){return BOOKS.filter(b=>normRegion(b.region)===name)}function openRegion(name){selectedPhase=0;setView('books');setTimeout(()=>{advancedFilters.classList.remove('hidden');regionFilter.value=name;filterBooks()},0)}
function renderWorld(){let c=stats(),visited=MAP_REGIONS.filter(([r])=>(c.regionGroups[r]||0)>0).length,total=MAP_REGIONS.length;worldView.innerHTML=`<div class="panel map-hero"><h2 style="margin-top:0">🌍 文学世界地図</h2><b>${visited} / ${total} 地域を訪問</b><div class="xpbar"><i style="width:${pct(visited,total)}%"></i></div><div class="meta" style="color:#dce9e7">読了した地域が解放され、制覇率と次の目標が見える。</div></div><div class="world-map">${MAP_REGIONS.map(([r,cl])=>{let n=c.regionGroups[r]||0,max=regionBooks(r).length,cls=n===0?'locked-region':n>=max?'mastered':'visited';return `<button class="continent ${cl} ${cls}" onclick="openRegion('${r}')">${r}<small>${n} / ${max}冊</small></button>`}).join('')}</div><div class="map-legend"><span><i class="map-dot" style="background:#9da7a3"></i>未訪問</span><span><i class="map-dot" style="background:#d6ad55"></i>訪問済み</span><span><i class="map-dot" style="background:#6f9b65"></i>制覇</span></div><div class="panel"><h3>地域別制覇率</h3><table class="country-table">${MAP_REGIONS.map(([r])=>{let books=regionBooks(r),n=books.filter(b=>entry(b.no).got).length,max=books.length,authors=[...new Set(books.map(b=>b.author))].slice(0,3).join('・');return `<tr><td><b>${r}</b><div class="meta">${esc(authors||'登録作家なし')}</div></td><td>${n}/${max}<br><span class="mini-badge">${Math.round(n/Math.max(1,max)*100)}%</span></td></tr>`}).join('')}</table></div>`}
function render(v){({home:renderHome,phases:renderPhases,ex:renderEx,books:renderBooks,log:renderLog,analytics:renderAnalytics,profile:renderProfile,authors:renderAuthors,timeline:renderTimeline,awards:renderAwards,mypage:renderMyPage,glossary:renderGlossary,themes:renderThemes,collections:renderCollections,titles:renderTitles,achievements:renderAchievements,world:renderWorld,backup:renderBackup}[v])()}
function applyTheme(mode){document.body.classList.toggle('dark',mode==='dark');localStorage.setItem('literature-rpg-theme',mode);document.querySelector('meta[name=theme-color]')?.setAttribute('content',mode==='dark'?'#171310':'#1c1714')}
const themeToggle=document.getElementById('themeToggle');applyTheme(localStorage.getItem('literature-rpg-theme')||'light');themeToggle?.addEventListener('click',()=>applyTheme(document.body.classList.contains('dark')?'light':'dark'));

renderHome();
</script></body></html>
