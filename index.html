.rpg-hero{background:linear-gradient(145deg,#2c221d,#68412f);color:#fff;overflow:hidden;position:relative}.rpg-hero:after{content:"✦";position:absolute;right:18px;top:8px;font-size:88px;color:#fff1;transform:rotate(15deg)}.level-row{display:flex;align-items:center;gap:13px}.level-orb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f6d277,#a96d20);color:#2a1d12;border:4px solid #fff4;box-shadow:0 0 22px #f0bb5266;font-weight:900}.level-orb b{font-size:27px;line-height:1}.xpbar{height:13px;background:#ffffff25;border-radius:99px;overflow:hidden;margin-top:8px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#f2ca68,#fff1b6)}.achievement-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.achievement-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:125px;position:relative}.achievement-card.unlocked{border-color:#c39131;background:linear-gradient(145deg,#fffdf8,#fff3d0)}.achievement-card.locked-card{filter:none;opacity:.48}.achievement-icon{font-size:28px}.rarity{font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:900}.rarity.common{color:#746a64}.rarity.rare{color:#317056}.rarity.epic{color:#4d59a7}.rarity.legendary{color:#9a5a16}.achievement-name{font-weight:900;margin:5px 0}.achievement-desc{font-size:11px;line-height:1.55;color:var(--muted)}.achievement-progress{font-size:11px;margin-top:7px;font-weight:800}.profile-title{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.unlock-pop{position:fixed;inset:0;z-index:300;background:#000b;display:grid;place-items:center;padding:20px}.unlock-box{max-width:360px;width:100%;background:linear-gradient(145deg,#fffaf0,#ecd29c);border:3px solid #c69131;border-radius:24px;padding:25px;text-align:center;box-shadow:0 20px 80px #0008;animation:unlock .35s ease}.unlock-box .big{font-size:58px}.unlock-box button{border:0;border-radius:12px;bac .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:12px}.stat-card b{display:block;font-size:21px;margin-top:3px}.bar-row{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;margin:9px 0;font-size:12px}.bar-row .progress{margin:0;height:9px}.shelf-select,.date-input{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px}.shelf-mark{display:inline-block;border-radius:999px;padding:4px 7px;font-size:10px;margin-top:5px;background:#e9dfd2}.history-item{display:grid;grid-template-columns:72px 1fr;gap:10px;border-left:3px solid #b9862c;padding:9px 10px;margin:8px 0;background:#fff;border-radius:0 12px 12px 0}.author-list{display:grid;gap:8px}.author-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}@media(max-width:420px){.profile-grid{grid-template-columns:1fr}.bar-row{grid-template-columns:76px 1fr 38px}}

.author-toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.author-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.author-card{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:13px;text-align:left;color:var(--ink)}.author-card h3{font-size:15px;margin:0 0 5px}.author-card .author-progress{height:7px;background:#e8ddd0;border-radius:99px;overflow:hidden;margin-top:8px}.author-card .author-progress i{display:block;height:100%;background:linear-gradient(90deg,#7c3f2d,#d0a34b)}.author-hero{background:linear-gradient(145deg,#312822,#7b4d37);color:#fff}.author-books{display:grid;gap:8px}.author-book{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:9px 0}.author-book:last-child{border-bottom:0}.timeline-tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.timeline-tabs button{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;white-space:nowrap}.timeline-tabs button.active{background:var(--accent);color:white;border-color:var(--accent)}.timeline-era{position:relative;padding-left:25px;margin-bottom:19px}.timeline-era:before{content:"";position:absolute;left:8px;top:8px;bottom:-20px;width:2px;background:#d8c3ae}.timeline-era:last-child:before{bottom:8px}.timeline-era h3{margin:0 0 8px}.timeline-era h3:before{content:"";position:absolute;left:2px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--gold)}.timeline-year{margin:10px 0 14px}.timeline-year-label{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:14px}.timeline-year-label strong{font-size:17px;color:var(--accent)}.timeline-list{display:grid;gap:7px}.timeline-item{background:white;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;color:var(--ink)}.timeline-item.got{border-left:5px solid var(--green)}.timeline-item b{display:block}.backup-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.backup-summary div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.backup-summary b{display:block;font-size:20px}.library-back{border:0;background:none;color:var(--accent);font-weight:800;padding:0 0 10px}.master-badge{display:inline-block;background:#392a22;color:#f5d990;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}@media(max-width:430px){.author-grid{grid-template-columns:1fr}.backup-summary{grid-template-columns:1fr 1fr}}

.note-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.note-field label{display:block;font-size:12px;font-weight:800;color:var(--accent);margin-bottom:5px}.note-field textarea{min-height:88px}.reading-box{display:grid;grid-template-columns:1fr 1fr;gap:8px}.reading-box label{font-size:11px;color:var(--muted)}.reading-box input,.reading-box select{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px;background:white}.session-list{display:grid;gap:7px;margin-top:10px}.session-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#f7efe5;border-radius:11px;padding:9px}.session-row button{border:0;border-radius:9px;background:#8a3f35;color:#fff;padding:7px 9px}.reading-progress{height:9px;background:#e5d9ca;border-radius:99px;overflow:hidden;margin-top:7px}.reading-progress i{display:block;height:100%;background:linear-gradient(90deg,#376b52,#88ad74)}.now-reading{border-left:5px solid var(--green)}.char-count{text-align:right;font-size:11px;color:var(--muted)}@media(max-width:520px){.note-grid,.reading-box{grid-template-columns:1fr}}

.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.calendar-head button{border:0;border-radius:10px;background:#342b26;color:#fff;padding:9px 12px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.cal-dow{text-align:center;font-size:11px;color:var(--muted);padding:4px}.cal-day{min-height:74px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px;text-align:left;overflow:hidden}.cal-day.out{opacity:.32}.cal-day.today{outline:2px solid var(--gold)}.cal-num{font-size:11px;font-weight:900}.cal-event{display:block;margin-top:3px;padding:3px 4px;border-radius:6px;font-size:9px;line-height:1.2;background:#efe2d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal-event.start{background:#dce8df}.cal-event.note{background:#e5def0}.chart-row{display:grid;grid-template-columns:72px 1fr 42px;gap:8px;align-items:center;margin:9px 0;font-size:12px}.chart-track{height:14px;background:#e7ddd1;border-radius:99px;overflow:hidden}.chart-track i{display:block;height:100%;background:linear-gradient(90deg,#8f553d,#d6a346)}.report-hero{background:linear-gradient(145deg,#3d2d26,#211a17);color:#fff}.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.report-stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px}.report-stat b{display:block;font-size:20px;margin-top:4px}.year-select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.event-actions{display:flex;gap:5px;margin-left:auto}.event-actions button{border:0;border-radius:8px;padding:6px 8px;font-size:11px}.edit-btn{background:#e7dbc9}.delete-btn{background:#ecd1cc}.analytics-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.analytics-tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px}.analytics-tabs button.active{background:#352b26;color:#fff}.insight{border-left:4px solid var(--gold);padding:9px 11px;background:#fff8e8;border-radius:0 10px 10px 0;margin:7px 0}

.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}.data-cell{background:#f6efe7;border:1px solid #dfcdbb;border-radius:10px;padding:10px}.data-cell small{display:block;color:#786c62}.data-cell b{display:block;margin-top:3px}.link-chip{border:0;border-radius:999px;padding:6px 10px;margin:3px;background:#e9dac8;color:#553d2e;cursor:pointer}.glossary-grid,.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.glossary-card,.theme-card{background:#fffaf5;border:1px solid #ddc9b5;border-radius:14px;padding:14px;text-align:left}.glossary-card h3,.theme-card h3{margin:0 0 6px}.theme-count{font-size:22px;font-weight:800}.theme-era-bar{display:flex;height:9px;overflow:hidden;border-radius:9px;background:#eee}.theme-era-bar i{display:block;background:#8b6a4d}.related-books{display:grid;gap:7px}.related-book{display:flex;justify-content:space-between;align-items:center;padding:9px;border-radius:9px;background:#f7f0e8;border:1px solid #e4d4c3}

.adventure-hero{background:linear-gradient(145deg,#35253f,#70485b);color:#fff}.timeline-controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.timeline-controls button{border:1px solid #cdb9aa;background:#fffaf5;border-radius:999px;padding:7px 11px}.timeline-controls button.active{background:#5e3f52;color:white}.history-event{padding:8px 10px;margin:5px 0;border-left:4px solid #836b5b;background:#f6efe7;border-radius:8px}.history-event.jp{border-color:#a14a45}.history-event.world{border-color:#3e6f7a}.history-event.lit{border-color:#705786}.year-anchor{position:sticky;top:78px;z-index:2;background:#eadccf;border-radius:9px;padding:6px 9px;display:inline-block}.collection-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.collection-card{background:#fffaf5;border:1px solid #dbc8b7;border-radius:15px;padding:14px}.collection-card.complete{box-shadow:0 0 0 2px #b68a42 inset}.collection-blocks{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}.collection-blocks i{width:22px;height:22px;border-radius:5px;background:#ddd}.collection-blocks i.on{background:#6e4d3d}.title-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.title-card{border:1px solid #d9c6b6;background:#fffaf5;border-radius:14px;padding:13px}.title-card.locked{filter:grayscale(1);opacity:.62}.title-card.equipped{box-shadow:0 0 0 3px #956f45 inset}.daily-card{background:linear-gradient(135deg,#fff4d6,#f0dfb6);border:1px solid #d5b66e}.country-table{width:100%;border-collapse:collapse}.country-table td{padding:8px;border-bottom:1px solid #eaded2}.country-table td:last-child{text-align:right}.mini-badge{font-size:10px;padding:3px 6px;border-radius:999px;background:#e8dacb}.collection-progress{font-size:24px;font-weight:900}

.theme-toggle{position:absolute;right:14px;top:12px;border:1px solid #ffffff33;background:#ffffff12;color:#fff;border-radius:999px;width:38px;height:38px;font-size:20px}.theme-toggle:active{transform:scale(.96)}
:focus-visible{outline:3px solid #d8a94d;outline-offset:2px}

body.dark .hero{background:linear-gradient(145deg,#2b231d,#3b2d20)}body.dark .kpi{background:#2a221d}body.dark .book.got{background:#312817}

@media (min-width:900px){main{max-width:980px}.author-grid,.theme-grid,.collection-grid{grid-template-columns:repeat(3,1fr)}.profile-grid{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</main><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div><script>
const BOOKS=[{"no":1,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"コンビニ人間","author":"村田沙耶香","region":"日本","era":"現代","genre":"純文学","difficulty":1,"length":"短","why":"「普通」に適応することの不気味さを、軽快で鋭い語りで描く現代の代表作。\n社会の基準と自分の欲望を切り分けて考える視点が得られる。","hook":"「普通」に合わせることと、自分のまま生きること。どちらが本当に正しいのか。","synopsis":"36歳の古倉恵子は、大学卒業後も就職せず、18年間同じコンビニで働き続けている。幼い頃から周囲との感覚のずれを抱えてきた彼女にとって、店のマニュアルや同僚の話し方をまねることは、社会の一員として生きるための大切な方法だった。しかし、独身で非正規雇用の彼女を家族や友人は「普通ではない」と心配する。そこへ、同じく社会になじめない男性・白羽が現れ、恵子の整った生活は揺れ始める。","appeal":"主人公の奇妙さを眺める小説ではなく、彼女を「正常」に戻そうとする社会の方が次第に奇妙に見えてくる作品。短く読みやすいのに、仕事、結婚、幸福、世間体について鋭い疑問が残る。","recommend":"周囲に合わせることに疲れた経験がある人／短くて鋭い現代文学を読みたい人／「普通」という言葉に違和感がある人","before":"難しい予備知識は不要。主人公をすぐに善悪で評価せず、彼女の目に社会がどう映っているかを追うと面白い。","question":"古倉恵子は不幸なのか。それとも、周囲が勝手に彼女を不幸だと決めているだけなのか。","mood":[5,2,2,5],"year":2016},{"no":2,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"海外","title":"変身","author":"フランツ・カフカ","region":"チェコ／ドイツ語圏","era":"20世紀","genre":"世界文学","difficulty":1,"length":"短","why":"理由も説明もないまま人間が異物化する、不条理文学の入口。\n家族・労働・自己価値がいかに脆いかを体感できる。","hook":"ある朝、目覚めたら巨大な虫になっていた。それでも最初に心配するのは、仕事に遅れることだった。","synopsis":"旅行セールスマンのグレゴール・ザムザは、ある朝、自分が巨大な虫のような姿になっていることに気づく。原因は説明されず、元に戻る方法も示されない。働けなくなったグレゴールを前に、家族は当初こそ戸惑いながら世話をするが、暮らしが苦しくなるにつれて態度を変えていく。奇怪な出来事を淡々と描きながら、家族、労働、役に立つことと人間の価値の関係を浮かび上がらせる。","appeal":"荒唐無稽な設定なのに、読んでいるうちに「役に立たなくなった人間はどう扱われるのか」という生々しい現実へ変わる。不条理文学の代表作だが、家族ドラマとしても強烈。","recommend":"短い作品で世界文学に入りたい人／家族の愛情の条件について考えたい人／不思議で不穏な物語が好きな人","before":"虫の種類や変身の理由を解明する話ではない。説明されないこと自体を受け入れ、家族の変化を見る作品。","question":"グレゴールの価値は、働けなくなった瞬間に失われたのか。","mood":[4,5,4,5],"year":1915},{"no":3,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"キッチン","author":"吉本ばなな","region":"日本","era":"現代","genre":"純文学","difficulty":1,"length":"短","why":"喪失から再生へ向かう感情を、透明感のある文体で読ませる一冊。\n悲しみを抱えたまま生き直す感覚と、現代日本文学の軽やかさに触れられる。","hook":"大切な人を失ったあと、人はどこで眠り、何を食べて、どう生き直すのか。","synopsis":"祖母を亡くし、天涯孤独となったみかげは、知人の雄一とその母えり子の家に身を寄せる。深い喪失の中で、彼女が不思議と安らげるのは台所だった。食事を作り、人と暮らし、再び別れに直面しながら、みかげは悲しみを消すのではなく抱えたまま生きる方法を見つけていく。日常と死が近くにある世界を、透明で軽やかな文章で描く。","appeal":"悲しい物語なのに、読後には温かさが残る。料理、夜の街、台所の光といった感覚的な描写が、言葉にしにくい孤独をそっと包む。","recommend":"喪失から立ち直る物語を読みたい人／静かで優しい小説が好きな人／吉本ばななの文体に触れたい人","before":"筋を追うより、食べ物や部屋、夜の空気が人物の気持ちとどう結びつくかに注目すると楽しめる。","question":"悲しみを乗り越えることと、悲しみを抱えて生きることはどう違うのか。","mood":[5,3,4,4],"year":1988},{"no":4,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"海外","title":"異邦人","author":"アルベール・カミュ","region":"フランス","era":"20世紀","genre":"世界文学","difficulty":1,"length":"短","why":"社会と噛み合わない人間を通して「不条理」を最も明快に示す作品。\n感情・道徳・意味を当然視しない思考の入口になる。","hook":"母の葬儀で泣かなかった男は、殺人そのものより「泣かなかったこと」を裁かれていく。","synopsis":"アルジェリアで暮らすムルソーは、母の死の知らせを受けて葬儀に向かう。彼は周囲が期待するほど悲しみを示さず、翌日には海水浴や恋人との時間を楽しむ。その後、偶然と暑さに押されるように事件を起こした彼は裁判にかけられるが、法廷で問題にされるのは事件だけではなく、母の葬儀での態度だった。社会が求める感情と、本人が実際に感じるもののずれが露わになる。","appeal":"文章は平明で短いが、感情、道徳、人生の意味を当然視できなくなる。主人公に共感するか反発するかで、自分が何を「人間らしい」と考えているかも見えてくる。","recommend":"哲学的なテーマを物語で味わいたい人／短い海外文学を探している人／社会と個人のずれに関心がある人","before":"主人公を冷酷な人間と即断せず、彼が嘘をつかないことと社会の規範との衝突を見るとよい。","question":"社会が人に「正しい感情」を要求することは正当なのか。","mood":[3,4,4,5],"year":1942},{"no":5,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"博士の愛した数式","author":"小川洋子","region":"日本","era":"現代","genre":"純文学","difficulty":1.3,"length":"中","why":"記憶、数学、家族愛を静かに結びつけた読みやすい秀作。\n知性と優しさが共存する物語の作り方、記憶が人を結ぶ仕組みを味わえる。","hook":"記憶が80分しか続かなくても、人と人のつながりは残せるのか。","synopsis":"家政婦である「私」は、交通事故の後遺症で新しい記憶が80分しか続かない元大学教授の家へ派遣される。博士は毎朝、服に留めたメモを頼りに彼女を新しい家政婦として迎え、数字や数式の美しさを語る。やがて「私」の息子も博士と交流するようになり、三人の間には血縁とは別の穏やかな家族関係が育っていく。","appeal":"数学が苦手でも楽しめる。素数や完全数が、人を遠ざける難しい知識ではなく、相手を理解し愛するための言葉として描かれる。","recommend":"優しい読後感の作品を読みたい人／知性と愛情が結びつく物語が好きな人／静かな家族小説を探している人","before":"数学の説明を完璧に理解する必要はない。博士が数字を通して他者とつながろうとする姿に注目したい。","question":"記憶として残らなくても、誰かと過ごした時間には意味があるのか。","mood":[5,1,4,3],"year":2003},{"no":6,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"海外","title":"グレート・ギャツビー","author":"F・スコット・フィッツジェラルド","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1,"length":"短","why":"華やかな成功の裏にある空虚と執着を、簡潔で美しい文体で描く。\nアメリカン・ドリームの光と影、象徴を読む楽しさが身につく。","hook":"すべてを手に入れたように見える男が、どうしても取り戻せない一つの過去。","synopsis":"1920年代のニューヨーク近郊。語り手ニックは、毎夜豪華なパーティーを開く謎の富豪ジェイ・ギャツビーと知り合う。莫大な財産と華やかな人脈を持つギャツビーには、かつて愛した女性デイジーを取り戻すという秘めた目的があった。成功、恋愛、階級、過去への執着が交錯し、きらびやかな世界の裏側にある空虚が露わになっていく。","appeal":"短い物語の中に、アメリカン・ドリームの魅力と残酷さが凝縮されている。緑の灯、豪邸、車などの象徴を読み解く楽しさも強い。","recommend":"華やかで切ない物語が好きな人／恋愛と階級の関係を読みたい人／海外文学の象徴表現を味わいたい人","before":"ギャツビーの恋を純愛としてだけ見るのではなく、彼が愛しているのは女性か、過去か、成功の証明かを考えると深まる。","question":"過去は努力によって取り戻せるものなのか。","mood":[4,3,5,4],"year":1925},{"no":7,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"センセイの鞄","author":"川上弘美","region":"日本","era":"現代","genre":"純文学","difficulty":1.3,"length":"中","why":"年齢差のある二人の距離が少しずつ変わる過程を丁寧に描く。\n会話の間や食事など、日常の細部から感情を読む力が養われる。","hook":"恋愛なのか、友情なのか。名前をつける前の距離が、食事と酒の時間の中で少しずつ変わる。","synopsis":"会社員のツキコさんは、居酒屋で高校時代の国語教師だった「センセイ」と偶然再会する。年齢も生活も異なる二人は、酒を飲み、旬の料理を食べ、ときどき遠出をしながら、ゆっくりと親しくなっていく。大きな事件や激しい告白ではなく、会話の間、季節、食べ物を通して関係の変化が描かれる。","appeal":"何も起きていないようで、二人の距離が確実に変わっていく。日常の細部や沈黙から感情を読む楽しさを教えてくれる。","recommend":"静かな恋愛小説が好きな人／食事の描写を楽しみたい人／派手さより余韻を求める人","before":"結論を急がず、二人の呼び方や会話の調子、季節の移り変わりを味わうとよい。","question":"親密さは、言葉で確認されて初めて恋愛になるのか。","mood":[5,1,5,3],"year":2001},{"no":8,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"海外","title":"一九八四年","author":"ジョージ・オーウェル","region":"イギリス","era":"20世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"監視・言語統制・歴史改変が人間をどう支配するかを描くディストピアの基本作。\n政治権力と言葉の関係を疑う視点が得られる。","hook":"言葉を奪い、過去を書き換えれば、人間の考える力そのものを支配できる。","synopsis":"超大国オセアニアでは、党と指導者ビッグ・ブラザーが市民を常時監視している。政府機関で過去の新聞記事を書き換える仕事をするウィンストンは、党の支配に疑問を抱き、密かに日記を書き始める。やがて彼はジュリアと出会い、禁止された愛と抵抗へ踏み出す。しかし、党が求めるのは服従だけではなく、人の記憶と現実認識そのものの支配だった。","appeal":"監視社会の怖さだけでなく、言葉、歴史、真実が権力によってどう変形されるかを徹底して描く。現代のSNSや情報環境にも接続して読める。","recommend":"政治と文学に関心がある人／ディストピア作品が好きな人／言葉と権力の関係を考えたい人","before":"用語が多いが、最初から全部覚える必要はない。「二重思考」「ニュースピーク」が何を奪う仕組みなのかを見る。","question":"人が心の中で真実だと思っていることまで、権力は変えられるのか。","mood":[3,5,2,5],"year":1949},{"no":9,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"夜のピクニック","author":"恩田陸","region":"日本","era":"現代","genre":"青春","difficulty":1.3,"length":"中","why":"高校最後の一夜を歩き続けるだけで、友情と青春の揺れを描き切る群像劇。\n大事件のない時間から人物関係を立ち上げる技法を学べる。","hook":"高校生活最後の夜、ただ歩き続ける。それだけなのに、一生忘れられない秘密が動き出す。","synopsis":"高校の伝統行事「歩行祭」。生徒たちは朝から翌朝まで、80キロの道のりを歩き続ける。甲田貴子には、この夜にどうしても果たしたい小さな賭けがあった。同級生の西脇融との間にある、誰にも話していない複雑な関係を変えるためだ。長い行列の中で友人たちの会話や思いが交差し、青春の終わりが静かに近づいていく。","appeal":"大事件は起きないのに、歩く位置や会話の相手が変わるだけで人間関係が動く。青春のきらめきと、もう戻れない時間の切なさが濃い。","recommend":"青春群像劇が好きな人／学校行事の独特な高揚感が好きな人／読後に爽やかな余韻がほしい人","before":"秘密の解明だけを急がず、歩くことで会話が生まれ、人間関係が組み替わる過程を楽しみたい。","question":"青春の思い出を特別にするのは、出来事なのか、それを共有した時間なのか。","mood":[5,1,5,3],"year":2004},{"no":10,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"海外","title":"動物農場","author":"ジョージ・オーウェル","region":"イギリス","era":"20世紀","genre":"世界文学","difficulty":1,"length":"短","why":"革命が新たな独裁へ変質する過程を寓話として簡潔に示す。\n理想、権力、宣伝がどう結びつくかを直感的に理解できる。","hook":"平等を掲げた革命は、なぜ「すべての動物は平等だが、ある動物はもっと平等だ」に変わるのか。","synopsis":"人間に酷使されていた農場の動物たちは、豚たちの指導によって反乱を起こし、自分たちの農場を手に入れる。すべての動物が平等に働き、成果を分かち合う理想社会を目指すが、読み書きのできる豚たちは次第に特権を持ち始める。規則は少しずつ書き換えられ、革命の記憶さえ変えられていく。","appeal":"政治思想や歴史の知識がなくても、権力が腐敗する仕組みを直感的に理解できる。短く、物語としてもテンポがよい。","recommend":"短い社会派作品を読みたい人／革命や独裁の構造を知りたい人／寓話が好きな人","before":"ロシア革命の風刺として有名だが、特定の歴史だけでなく、組織や集団で権力が集中する一般的な物語として読める。","question":"理想を守るためには、指導者の善意以外に何が必要なのか。","mood":[4,4,2,5],"year":1945},{"no":11,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"アヒルと鴨のコインロッカー","author":"伊坂幸太郎","region":"日本","era":"現代","genre":"ミステリー","difficulty":1.3,"length":"中","why":"友情と罪、記憶のずれを巧みな構成で結ぶ青春ミステリー。\n語り手を信用しすぎず、伏線と視点の操作を読む楽しさが得られる。","hook":"隣人に頼まれた奇妙な「本屋襲撃」。それは、過去と現在が思いがけない形でつながる物語の入口だった。","synopsis":"大学進学を機に仙台へ引っ越してきた椎名は、隣人の河崎から突然「一緒に本屋を襲わないか」と誘われる。狙いは、広辞苑を一冊だけ盗むこと。戸惑いながらも計画に巻き込まれた椎名は、河崎やブータン人留学生ドルジ、その恋人琴美をめぐる二年前の出来事を知っていく。現在と過去が交互に語られ、ばらばらだった事実が少しずつ一つの物語へ結びついていく。","appeal":"軽妙な会話と青春小説の空気で進みながら、読み進めるほど見えていた景色が変わっていく。仕掛けの驚きだけでなく、孤独な人同士の友情や、他者を理解することの難しさが切なく残る。","recommend":"意外な構成のミステリーが好きな人／笑えて切ない青春小説を読みたい人／伊坂幸太郎を初めて読む人","before":"現在と二年前の出来事が交互に描かれる。人物関係を急いで整理しすぎず、会話の違和感や繰り返される言葉を覚えておくと面白い。","question":"人は ":"キューバの老漁師サンチャゴは、八十四日もの間、一匹の魚も釣れずにいた。周囲から運に見放されたと思われ、慕ってくれる少年も別の船へ移される。それでも海へ出た老人は、沖合で巨大なカジキに出会う。小舟を引き続ける獲物と一本の釣り糸で結ばれ、疲労や傷、孤独に耐えながら、サンチャゴは長い闘いを続ける。海と魚への敬意を失わず、自らの誇りを懸けて限界へ挑む物語。","appeal":"筋は極めて単純だが、短い文章の中に老い、誇り、敗北、自然との共存が凝縮されている。勝敗だけでは測れない人間の強さが、海上の静かな闘いを通して伝わる。","recommend":"短い海外文学から始めたい人／努力や敗北を描く物語が好きな人／簡潔で力強い文章を味わいたい人","before":"老人と魚の闘いを単なる根性物語として読むだけでなく、老人が魚を敵であり兄弟でもあると感じている点に注目したい。","question":"結果として何かを失っても、最後まで闘い抜いたことは「勝利」と呼べるのか。","mood":[4,3,5,4],"year":1952},{"no":15,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"火車","author":"宮部みゆき","region":"日本","era":"現代","genre":"社会派ミステリー","difficulty":1.6,"length":"長","why":"失踪した女性を追う物語から、借金と消費社会の闇を暴く社会派ミステリー。\n個人の犯罪を制度や経済の問題として見る視点が養われる。","hook":"失踪した婚約者を捜す男。調査を始めた刑事は、その女性の名前も人生も本物ではないことに気づく。","synopsis":"休職中の刑事・本間俊介は、甥の和也から、突然姿を消した婚約者・関根彰子を捜してほしいと頼まれる。彼女はクレジットカードを作ろうとした際、過去の自己破産が発覚し、その直後に失踪していた。調べるうち、本間は和也が知っていた彰子の経歴に不自然な点を見つける。戸籍、借金、カード社会を手がかりに、一人の女性が別人の人生を生きようとした理由を追っていく。","appeal":"失踪者を追うミステリーでありながら、消費者金融や自己破産が人間の人生をどう壊すかを描いた社会派小説。姿を見せない女性の切実さが、調査によって少しずつ立ち上がってくる。","recommend":"社会問題と結びついたミステリーが好きな人／宮部みゆきを初めて読む人／人が過去を捨てる理由を考えたい人","before":"刊行当時の日本では、カードや消費者金融の利用が急速に広がっていた。制度の説明は作中にあるので、金融の予備知識は必要ない。","question":"過去によって人生を奪われた人に、別の人生をやり直す権利はあるのか。","mood":[4,4,5,4],"year":1992},{"no":16,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"海外","title":"ライ麦畑でつかまえて","author":"J・D・サリンジャー","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"社会への苛立ちを抱えた少年の声が魅力の青春小説。\n反抗的な語りの奥にある孤独や優しさを読み取る力がつく。","hook":"大人の世界はインチキだらけだ。そう吐き捨てる少年は、本当は誰よりも傷つきやすかった。","synopsis":"名門高校を退学処分になった16歳のホールデンは、家族に知らせる前の数日間をニューヨークで過ごす。ホテルや酒場をさまよい、教師や旧友、見知らぬ人々と会いながら、周囲の大人を「インチキ」と批判し続ける。しかし、その乱暴で皮肉な語りの奥には、成長することへの恐れと、失われていく無垢なものを守りたいという切実な願いが隠れている。","appeal":"物語を動かすのは事件よりも、ホールデンの圧倒的な声。反抗的で矛盾だらけなのに、ふとした優しさや孤独がにじみ、読者は彼を嫌いになりきれない。若者の息苦しさを口語的な文体で刻んだ青春小説の古典。","recommend":"周囲の価値観になじめない人／一人称の強い語りが好きな人／成長することへの不安を描いた青春小説を読みたい人","before":"主人公の発言をすべて正しい意見として読む必要はない。彼が何を嫌うかだけでなく、何を失うことを恐れているかに注目すると印象が変わる。","question":"ホールデンが守りたい「子どもの純粋さ」は、本当に守れるものなのか。","mood":[5,3,4,4],"year":1951},{"no":17,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"泥の河","author":"宮本輝","region":"日本","era":"戦後","genre":"純文学","difficulty":1,"length":"短","why":"戦後の貧しい大阪を少年の目で描き、善悪で割り切れない人間を示す。\n歴史を生活の匂いや風景から感じ取る読書ができる。","hook":"川向こうの舟で暮らす姉弟との出会いが、少年に初めて貧しさと人生の残酷さを知らせる。","synopsis":"昭和三十年代の大阪。食堂の息子である信雄は、川に浮かぶ舟で暮らす喜一と銀子の姉弟に出会う。三人はすぐに親しくなり、川辺や路地で遊ぶようになるが、信雄は彼らの暮らしが自分の家庭とは大きく違うことを少しずつ知っていく。大人たちが抱える過去や貧しさを十分には理解できない少年の目を通して、戦後の街と人々の哀しみが描かれる。","appeal":"子どもの視点だからこそ、貧困や差別が説明ではなく、匂い、泥、食べ物、舟の景色として伝わる。善悪を簡単に決めず、人の暮らしをそっと見つめる文章が美しく、短い中に忘れがたい場面が多い。","recommend":"静かな人間ドラマが好きな人／戦後の暮らしを物語から知りたい人／子どもの視点で描かれる切ない作品を読みたい人","before":"当時の大阪の川沿いには、水上生活者も存在した。歴史知識より、信雄が初めて見るものへの戸惑いを一緒に感じる読み方が向いている。","question":"子ども同士の友情は、家庭環境や社会の境界を越えられるのか。","mood":[5,3,5,4],"year":1977},{"no":18,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"海外","title":"アルジャーノンに花束を","author":"ダニエル・キイス","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"知能が変化する主人公の日記形式を通し、幸福と知性の関係を問う。\n文章の変化から人物の内面を読む面白さと、尊厳への想像力が得られる。","hook":"頭がよくなれば、きっと幸せになれる。そう信じた青年が手にしたものと、失っていくもの。","synopsis":"知的障害のあるチャーリイ・ゴードンは、賢くなれば人々に認められると信じ、知能を高める実験手術を受ける。先に同じ実験を受けた白ネズミのアルジャーノンと競いながら、彼の知能は急速に向上していく。読み書きも人間関係も理解できるようになる一方で、以前は気づかなかった周囲の悪意や、自分自身の孤独にも直面していく。物語はチャーリイ自身の経過報告という形で綴られる。","appeal":"主人公の知能の変化が、文章の綴りや語彙そのものに表れる構成が見事。賢さを得ることがそのまま幸福にはならないという痛みと、人を尊重するとは何かという問いが、強い感情とともに残る。","recommend":"泣ける物語を読みたい人／知性と幸福の関係を考えたい人／文章表現の変化を楽しめる作品に興味がある人","before":"最初の文章の誤りは翻訳や印刷のミスではなく、主人公の状態を表す重要な表現。直そうとせず、その変化を追って読む。","question":"人間の価値を知能や能力で測る社会は、誰を傷つけるのか。","mood":[5,4,5,5],"year":1966},{"no":19,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"伊豆の踊子","author":"川端康成","region":"日本","era":"昭和前期","genre":"純文学","difficulty":1,"length":"短","why":"旅の出会いと別れを、簡潔で抑制された文章に凝縮した川端文学の入口。\n言葉にされない憧れや孤独を行間から読む感覚が身につく。","hook":"孤独な学生が旅先で出会った踊子。その淡い時間は、彼の心を静かにほどいていく。","synopsis":"二十歳の学生である「私」は、伊豆への一人旅の途中で旅芸人の一座と出会う。若い踊子・薫に心を引かれた彼は、一座と道を共にし、温泉町や峠を巡っていく。身分も生活も異なる彼らとの素朴な交流の中で、孤独と屈折を抱えていた青年の心は少しずつ軽くなる。恋と呼ぶにはまだ幼く、旅の終わりとともに消えてしまうような、短く清らかな出会いが描かれる。","appeal":"感情を説明しすぎず、視線、仕草、風景の美しさによって憧れを伝える川端康成の代表的な短編。淡い恋愛だけでなく、自分を嫌っていた青年が他者との交流によって救われる物語としても読める。","recommend":"短く美しい日本文学を読みたい人／旅と出会いの物語が好きな人／行間から感情を読む作品に触れたい人","before":"大正期には旅芸人への社会的な偏見が強かった。青年が一座から自然に受け入れられることが、彼にとってどれほど大きいかを見るとよい。","question":"一時的な出会いでも、人の自己認識を変えることはできるのか。","mood":[5,1,5,3],"year":1926},{"no":20,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"海外","title":"星の王子さま","author":"サン＝テグジュペリ","region":"フランス","era":"20世紀","genre":"世界文学","difficulty":1,"length":"短","why":"子どもの物語の姿を借りて、愛、責任、喪失を寓話的に語る世界的古典。\n単純な言葉に多層の意味を見つける読み方を学べる。","hook":"大切なものは目に見えない。けれど、それが見えなくなったのは子どもではなく大人の方かもしれない。","synopsis":"砂漠に不時着した飛行士は、小さな星から来たという不思議な少年に出会う。王様、うぬぼれ屋、実業家などが暮らす星々を旅してきた王子は、地球で飛行士にその体験を語る。故郷には一輪のバラを残してきたが、王子はその花との関係をうまく理解できずにいた。地球でキツネと出会い、誰かと関係を結ぶことの喜びと責任を学んでいく。","appeal":"子ども向けの平明な言葉で、大人の虚栄、孤独、愛することの責任を描く。年齢や経験によって心に残る箇所が変わり、読み返すたびに別の意味が立ち上がる寓話。","recommend":"短く哲学的な物語を読みたい人／大人社会への風刺が好きな人／愛情や別れについて静かに考えたい人","before":"作者サン＝テグジュペリ自身も飛行士で、砂漠への不時着経験がある。名言だけを拾うより、王子が旅を通して何を学ぶかを追いたい。","question":"誰かを「かけがえのない存在」にするのは、その人の特別さか、一緒に過ごした時間か。","mood":[5,2,5,4],"year":1943},{"no":21,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"檸檬","author":"梶井基次郎","region":"日本","era":"昭和前期","genre":"短編集","difficulty":1,"length":"短","why":"憂鬱な青年の感覚が、一個の檸檬によって鮮やかに反転する短編。\n色・匂い・重さなど、五感で文章を味わう方法が分かる。","hook":"何もかもが重苦しい街で、一個の鮮やかな檸檬だけが、世界を爆発させる想像力をくれた。","synopsis":"原因の分からない憂鬱と身体の不調を抱えた「私」は、以前は好きだった音楽や美術にも心を動かされず、京都の街をあてもなく歩いている。ある果物屋で、鮮やかな色と冷たい重みを持つ一個の檸檬を手にした瞬間、気分がふっと軽くなる。彼はその檸檬を持って行きつけの書店へ入り、画集を積み上げた上にそっと置き、奇妙で痛快な想像を膨らませる。","appeal":"ごく短い物語なのに、色、匂い、手触り、重さが鮮烈。憂鬱を理屈で解決するのではなく、美しい物の感覚と突飛な空想によって一瞬だけ反転させる。その瞬間の解放感が読む側にも伝わる。","recommend":"短編から近代文学に入りたい人／五感に訴える文章が好きな人／憂鬱と想像力の関係に興味がある人","before":"筋の大きな展開より、主人公の感覚が檸檬を境にどう変化するかを味わう作品。実際の京都の街を思い浮かべると楽しい。","question":"現実を変えられなくても、想像力は人を救えるのか。","mood":[4,2,5,3],"year":1925},{"no":22,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"海外","title":"夏への扉","author":"ロバート・A・ハインライン","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"時間旅行を使いながら、再起と希望を痛快に描く古典SF。\n複雑な設定を娯楽に変える構成力と、未来を選び直す発想が得られる。","hook":"裏切られ、すべてを奪われ、冬眠させられた男。それでも未来には、必ず『夏への扉』がある。","synopsis":"1970年、発明家ダンは家庭用ロボットの開発に成功するが、婚約者と共同経営者の裏切りによって会社も発明も奪われ、冷凍睡眠へ追いやられる。目覚めたのは三十年後の西暦2000年。失われた人生を取り戻そうとする彼は、過去と未来を結ぶ思いがけない可能性に出会う。愛猫ピートと、大切な少女リッキイへの思いを胸に、技術と機転を使った逆転に挑む。","appeal":"タイムトラベルの仕掛けが論理的に組み上がる快感と、どん底から人生を取り戻す爽快感が魅力。古い未来像の愛嬌も含めて、前向きなエネルギーに満ちたSF冒険小説。","recommend":"初めて古典SFを読む人／逆転劇や時間旅行が好きな人／読後に明るい気持ちになれる作品を探している人","before":"1956年に書かれたため、作中の2000年は当時想像された未来。予言の正確さより、人間の仕事や暮らしを技術がどう変えると考えたかを楽しむ。","question":"人生をやり直せるとして、変えるべきなのは過去そのものか、過去への向き合い方か。","mood":[5,2,4,3],"year":1957},{"no":23,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"羅生門・鼻","author":"芥川龍之介","region":"日本","era":"大正","genre":"短編集","difficulty":1,"length":"短","why":"極限状況の倫理と、自意識の滑稽さを描く芥川の代表短編。\n短い物語で人間の弱さを鋭く切り取る技術を味わえる。","hook":"生きるための悪は許されるのか。そして、自分の醜さを笑う他人を、人はなぜ許せないのか。","synopsis":"『羅生門』では、荒廃した京都で職を失った下人が、門の上で死体の髪を抜く老婆に出会い、生き延びるための善悪を迫られる。『鼻』では、長すぎる鼻に悩む僧・禅智内供が、どうにか短くしようと苦心する。極限状態で変わる倫理と、他人の目に振り回される自意識。異なる二作を通して、人間の弱さと身勝手さが鋭く描かれる。","appeal":"短い中で状況を一気に立ち上げ、最後の反転によって人物の本性を見せる芥川の技術が際立つ。暗い『羅生門』と滑稽な『鼻』を並べることで、人間の弱さを悲劇と喜劇の両方から味わえる。","recommend":"日本近代文学の短編を読みたい人／人間心理の皮肉が好きな人／短い作品を比較して読む練習をしたい人","before":"どちらも古典作品を素材にしているが、芥川は現代的な心理を加えて作り替えた。原話との比較を後から調べるのも面白い。","question":"人は他人の不幸には同情しても、その人が不幸を脱すると素直に喜べないのはなぜか。","mood":[4,4,4,5],"year":1915},{"no":24,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"海外","title":"チェスの話","author":"シュテファン・ツヴァイク","region":"オーストリア","era":"20世紀","genre":"世界文学","difficulty":1,"length":"短","why":"閉鎖空間でのチェスを通し、精神の自由と崩壊を描く緊迫した中編。\n心理戦と歴史的暴力を短い形式に凝縮する力を学べる。","hook":"独房で精神を守るため、男は頭の中だけでチェスを続けた。その救いは、やがて新たな牢獄になる。","synopsis":"ニューヨークからブエノスアイレスへ向かう客船に、世界チェス王者チェントヴィッチが乗り合わせる。乗客たちは彼に対局を挑むが、圧倒的な強さの前に追い詰められる。そのとき、謎めいた乗客B博士が鮮やかな助言を与える。彼はかつてナチスの秘密警察に拘束され、完全な孤独の中で偶然手に入れた棋譜集を暗記し、頭の中で何千局もの対戦を続けていた。","appeal":"チェスの知識がなくても、盤上の勝負が精神の自由をめぐる心理戦として読める。孤独から人を救った知的活動が、同時に精神を蝕むという逆説が緊迫感のある中編に凝縮されている。","recommend":"心理戦のある物語が好きな人／短い歴史小説を読みたい人／極限状態の人間心理に関心がある人","before":"作者ツヴァイクはナチスの台頭によって亡命したユダヤ系作家。本作は亡命生活の末期に書かれ、自由を奪う権力への恐怖が背景にある。","question":"精神を守るための逃避が、いつから新しい依存や監禁に変わるのか。","mood":[3,5,4,5],"year":1942},{"no":25,"phase":1,"phaseTitle":"読書の助走①：短く強い作品","category":"日本","title":"銀河鉄道の夜","author":"宮沢賢治","region":"日本","era":"昭和前期","genre":"幻想","difficulty":1,"length":"短","why":"死と別れを、幻想的な鉄道の旅に変えた日本児童文学の最高峰。\n象徴や未完性を受け入れ、自分なりに意味を組み立てる読書ができる。","hook":"銀河を走る列車に乗り、少年は『本当の幸い』を探す旅へ出る。","synopsis":"貧しい少年ジョバンニは、病気の母を支えながら学校へ通い、孤独な日々を送っている。星祭りの夜、丘の上で一人空を見上げていると、いつの間にか親友カムパネルラと銀河鉄道に乗っていた。二人は星座の間を走り、さまざまな乗客や不思議な光景に出会う。美しく幻想的な旅の中で、ジョバンニは別れ、犠牲、そして誰かの幸福のために生きることを考えていく。","appeal":"宝石のような宇宙の描写と、死や宗教をめぐる深い問いが重なる。未完の作品で決まった一つの解釈に閉じないため、年齢や経験によって旅の意味が変わる。宮沢賢治の世界観を最も強く味わえる一冊。","recommend":"幻想的な物語が好きな人／友情と別れを描く作品を読みたい人／答えの決まらない象徴的な文学を考えてみたい人","before":"作者が何度も書き直した未完作品で、版によって一部の内容が異なる。「正解」を探しすぎず、繰り返される言葉や光景を自分なりに結びたい。","question":"ジョバンニが探す「ほんとうのさいわい」とは、自分の幸福なのか、他者のために生きることなのか。","mood":[5,3,5,5],"year":1934},{"no":26,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"海外","title":"月と六ペンス","author":"サマセット・モーム","region":"イギリス","era":"20世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"安定した生活を捨てて芸術に向かう男を描き、才能と人間性の矛盾を問う。\n「偉大さ」を無条件に称賛しない批評的な視点が得られる。","hook":"家庭も仕事も捨て、絵を描くことだけを選んだ男。偉大な芸術は、醜い人間性を許すのか。","synopsis":"平凡な株式仲買人チャールズ・ストリックランドは、ある日突然、妻子と安定した生活を捨ててパリへ去る。理由は恋愛でも金でもなく、ただ絵を描くためだった。周囲を傷つけ、貧困や病にも頓着せず、彼は創作への衝動だけに従って生きていく。語り手は彼の足跡を追いながら、常識的な幸福や道徳から完全にはみ出した一人の芸術家の姿を見つめる。","appeal":"天才芸術家を美化せず、その才能と身勝手さを同時に描く冷静さが魅力。夢を追うことの美しさだけでなく、そこに巻き込まれた人々の犠牲まで見せるため、読者の評価が揺さぶられる。","recommend":"芸術家小説に興味がある人／才能と人格を分けて考えたい人／皮肉の効いた語りが好きな人","before":"画家ゴーギャンの人生から着想を得ているが、伝記ではない。題名の「月」と「六ペンス」が何を象徴するか考えながら読むとよい。","question":"圧倒的な才能があれば、他者を傷つける生き方まで正当化されるのか。","mood":[3,4,5,5],"year":1919},{"no":27,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"日本","title":"山椒魚","author":"井伏鱒二","region":"日本","era":"昭和前期","genre":"短編集","difficulty":1,"length":"短","why":"出口を失った山椒魚の寓話を通し、孤独と意地の可笑しさを描く。\n短い比喩的物語から人間心理を読み取る練習になる。","hook":"岩穴から出られなくなった山椒魚は、孤独をまぎらわせるため、他者まで閉じ込めようとする。","synopsis":"岩屋で暮らす山椒魚は、体が大きくなりすぎて入口から出られなくなったことに気づく。外の世界を眺めながら嘆き、自由に泳ぐ生き物たちを見ては悪態をつく。やがて岩屋に入ってきた蛙を閉じ込め、道連れにしようとするが、狭い空間で二匹は長い時間を過ごすことになる。意地と孤独が絡み合う、短く奇妙な寓話。","appeal":"数分で読めるほど短いのに、閉じ込められた人間のような山椒魚の滑稽さと哀しさが残る。自分が不幸だから他者も不幸にしたいという心理を、ユーモアのある寓話に変えている。","recommend":"ごく短い名作を読みたい人／寓話から人間心理を考えたい人／皮肉と哀愁のある作品が好きな人","before":"結末には版による違いがあることで知られる。まず手元の本文をそのまま読み、読後に改稿の経緯を調べると作品観が広がる。","question":"孤独な人が他者を傷つけるとき、その行為を理解することと許すことは同じなのか。","mood":[4,3,4,4],"year":1929},{"no":28,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"海外","title":"モモ","author":"ミヒャエル・エンデ","region":"ドイツ","era":"20世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"時間を奪う「灰色の男たち」と少女の対決を描く現代寓話。\n効率や忙しさに支配されない生き方を考えるきっかけになる。","hook":"『時間を節約すれば、もっと豊かになれる』。そう信じた街から、本当に生きる時間が消えていく。","synopsis":"町外れの円形劇場跡に暮らす少女モモには、人の話を心から聞く不思議な力がある。彼女と過ごすと、人々は自分の考えや喜びを取り戻していく。ところが町に灰色の男たちが現れ、時間を貯蓄すれば人生が豊かになると人々を説得する。大人たちは効率ばかりを求め、友人や家族と過ごす時間を失っていく。異変に気づいたモモは、奪われた時間を取り戻すために立ち上がる。","appeal":"冒険物語として読みやすい一方、忙しさ、効率、消費によって生活が空洞化する怖さを鋭く描く。スマートフォンやSNSに時間を奪われやすい現代にもそのまま重なる寓話。","recommend":"子どもから大人まで楽しめる長編を探している人／時間の使い方を見直したい人／優しい幻想文学が好きな人","before":"ここでいう「時間」は時計の数字だけではなく、人と話すこと、遊ぶこと、じっくり考えることを含む。灰色の男たちの提案がなぜ魅力的に見えるかにも注目したい。","question":"効率よく多くのことをこなす人生と、豊かな人生は同じなのか。","mood":[5,3,5,4],"year":1973},{"no":29,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"日本","title":"夫婦善哉","author":"織田作之助","region":"日本","era":"昭和前期","genre":"純文学","difficulty":1,"length":"短","why":"だらしない夫と世話を焼く妻の関係を、大阪の生活感とユーモアで描く。\n善悪では割れない男女関係と、方言文体の魅力を味わえる。","hook":"頼りない男に振り回されながら、それでも離れきれない。二人の関係は善でも悪でも割り切れない。","synopsis":"大阪の芸者・蝶子は、化粧問屋の若旦那・柳吉と駆け落ちする。柳吉は食道楽で働きも続かず、実家との関係にも振り回される頼りない男。それでも蝶子は商売を始め、生活を支え、何度裏切られても彼を見捨てきれない。大阪の店や料理を巡りながら、惚れた弱みと生活のしたたかさで結ばれた二人の、切っても切れない関係が描かれる。","appeal":"理想的な恋愛でも悲惨なだけの共依存でもなく、笑いと情けなさの中に男女の現実を描く。大阪弁の会話と食べ物の描写が生き生きしており、街そのものが登場人物のように感じられる。","recommend":"人間臭い恋愛小説が好きな人／大阪の文化や方言を楽しみたい人／善悪で割り切れない夫婦関係を読みたい人","before":"題名の「善哉」は甘味のぜんざいと、「よきかな」という意味を重ねている。料理や店の名前が二人の生活の浮き沈みと結びつく。","question":"何度失望しても離れられない関係は、愛なのか、依存なのか、それとも生活そのものなのか。","mood":[4,2,5,4],"year":1940},{"no":30,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"海外","title":"華氏451度","author":"レイ・ブラッドベリ","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"本を禁じる社会を通して、思考停止と娯楽依存の怖さを描く。\n読書がなぜ必要なのかを、物語として考え直せる。","hook":"本を燃やすことが正義とされる社会で、一人の消防士が初めて『読むこと』を知る。","synopsis":"本の所持が禁じられた未来社会。消防士ガイ・モンターグの仕事は、火を消すことではなく、発見された本と家を焼くことだった。彼は高速道路と巨大テレビに囲まれた生活を当然と思っていたが、風変わりな少女クラリスとの出会いをきっかけに、自分の幸福や社会のあり方を疑い始める。ある火災現場での出来事を境に、モンターグは密かに本を持ち帰り、禁じられた言葉の世界へ踏み込んでいく。","appeal":"検閲だけでなく、人々自身が複雑なものを避け、刺激の強い娯楽を選び続けた結果として本が消える点が恐ろしい。読むことが知識の取得ではなく、自分で考え、他者の痛みを想像する行為として描かれる。","recommend":"ディストピア小説が好きな人／読書の意味を考え直したい人／メディアと社会の関係に関心がある人","before":"題名は紙が燃え始める温度とされる華氏451度に由来する。書かれた時代のテレビ文化への不安を、現代の短い動画や情報環境と重ねても読める。","question":"本を禁止する権力と、本を必要としなくなった社会では、どちらがより危険なのか。","mood":[4,5,4,5],"year":1953},{"no":31,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"日本","title":"ヴィヨンの妻","author":"太宰治","region":"日本","era":"昭和前期","genre":"短編集","difficulty":1,"length":"短","why":"破滅的な夫を支える妻の視点から、愛情と生活のしたたかさを描く。\n太宰作品を自己告白だけでなく、周囲の人間から見る視点が得られる。","hook":"破滅的な夫を支える妻は、弱いのか。それとも誰より現実を見ているのか。","synopsis":"放蕩と酒に溺れる作家・大谷は、ある夜、飲み屋から金を盗んで逃げる。妻のさっちゃんは夫の行方を追う代わりに、その店で働いて借金を返すことを申し出る。客たちに囲まれ、生き生きと働き始める妻と、ますます不安定になっていく夫。戦後の混乱の中で、愛情、生活、罪悪感が奇妙に絡み合う夫婦の姿が描かれる。","appeal":"破滅する男の物語に見えて、実は生活を引き受ける女の強さが中心にある。太宰らしい自己嫌悪とユーモアが同居し、「人非人でもいいじゃないの。私たちは、生きていさえすればいいのよ」という感覚が鮮烈に残る。","recommend":"太宰治を短編から読みたい人／危うい夫婦関係を描く作品が好きな人／戦後文学の空気を味わいたい人","before":"語り手は妻。夫の言動をそのまま信じるより、妻が何を受け流し、何を選び取っているかに注目したい。","question":"さっちゃんが夫と生き続けるのは愛なのか、諦めなのか、それとも自分の生き方なのか。","mood":[5,2,3,2],"year":1947},{"no":32,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"海外","title":"アンドロイドは電気羊の夢を見るか？","author":"フィリップ・K・ディック","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"人造人間と人間の境界を、記憶・共感・生命の商品化から問うSFの名作。\n「人間らしさ」を能力ではなく倫理から考えられる。","hook":"人間そっくりのアンドロイドを殺す仕事。そのとき、人間らしさはどこに残るのか。","synopsis":"核戦争後の荒廃した地球。賞金稼ぎリック・デッカードは、火星から逃亡した最新型アンドロイドを処分する任務を受ける。人間と見分ける手がかりは、他者への共感能力だけ。しかし、標的たちは恐れ、考え、仲間を求める。任務を進めるほど、リックは人間と機械を隔てる境界に自信を失っていく。","appeal":"映画『ブレードランナー』の原作として有名だが、原作は動物信仰、共感装置、偽物の記憶など独自の要素が濃い。人間らしさを証明するはずの「共感」さえ制度化される世界が不穏で、読む側の倫理観を揺さぶる。","recommend":"思考実験型のSFが好きな人／AIと人間の境界を考えたい人／『ブレードランナー』との違いを楽しみたい人","before":"映画とは人物や結末、世界設定がかなり異なる。原作独自の「本物の動物を飼うこと」の意味に注目すると深まる。","question":"感情や記憶が人工的に作られたものでも、それを感じる存在には人格があると言えるのか。","mood":[5,3,3,3],"year":1968},{"no":33,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"日本","title":"人間失格","author":"太宰治","region":"日本","era":"昭和前期","genre":"純文学","difficulty":1,"length":"短","why":"社会に適応できない男の自己告白を通して、自意識と孤独を徹底的に描く。\n語り手への共感と距離の両方を保つ読み方が身につく。","hook":"人間を恐れ、道化を演じ続けた男が、自分を「失格」と呼ぶまで。","synopsis":"幼い頃から人間の考えが理解できず、恐怖を隠すために道化を演じてきた大庭葉蔵。成長した彼は、酒、女性、左翼運動へ逃げ込みながら、社会とのつながりを保とうとする。しかし、誰かに愛されても自分を信じられず、失敗を重ねるたびに生活は崩れていく。三冊の手記を通して、一人の男が自己否定を深めていく過程が語られる。","appeal":"極端な自己嫌悪の告白でありながら、文章には滑稽さと人を惹きつける軽さがある。葉蔵の苦しみに共感するだけでなく、彼が自分の責任や他者の姿をどう歪めて語っているかを読むと、より複雑な作品になる。","recommend":"太宰治の代表作を読みたい人／孤独や自己否定を描く文学に関心がある人／信頼できない語り手を読みたい人","before":"作者本人の人生と重なる部分はあるが、葉蔵＝太宰治と単純に同一視しない。手記を編集した「はしがき」と「あとがき」も重要。","question":"葉蔵は本当に人間失格なのか。それとも、そう名乗ることで他者の判断から逃げているのか。","mood":[5,2,3,2],"year":1948},{"no":34,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"海外","title":"闇の左手","author":"アーシュラ・K・ル＝グウィン","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"性別の固定されない異星人を描き、社会制度としてのジェンダーを問い直す。\n自分の常識を異文化の側から相対化する力が養われる。","hook":"性別が固定されない惑星で、男として生きる使節は何を見誤るのか。","synopsis":"宇宙連合の使節ゲンリー・アイは、惑星ゲセンを連合へ迎えるため単身派遣される。ゲセン人は通常は性を持たず、周期的に男性にも女性にもなり得る。厳寒の世界で政治的陰謀に巻き込まれたゲンリーは、理解しきれない現地人エストラーベンと長い旅に出る。文化と性の偏見を越え、二人は互いを知っていく。","appeal":"ジェンダーの常識を反転させたSFの古典。設定の奇抜さだけでなく、異文化理解の失敗、国家間政治、雪原を進む二人の友情が重なる。理解できない相手を、自分の枠組みから出て見る難しさが描かれる。","recommend":"ジェンダーを扱うSFに興味がある人／異文化理解の物語を読みたい人／壮大さと静かな友情の両方を求める人","before":"固有名詞や政治制度が多いが、最初から完全に整理しなくてよい。ゲンリーの偏見が少しずつ変わる過程を追う。","question":"相手を理解するとき、自分の性別や文化の物差しを本当に手放すことはできるのか。","mood":[5,2,3,3],"year":1969},{"no":35,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"日本","title":"こころ","author":"夏目漱石","region":"日本","era":"明治・大正","genre":"近代文学","difficulty":1.3,"length":"中","why":"友情、恋愛、罪悪感を通して近代人の孤独を描く、日本近代文学の中心作。\n告白の構造と、他者を完全には理解できない苦しさを味わえる。","hook":"「先生」が抱え続けた秘密は、なぜ親しい人を遠ざけ、人生全体を支配したのか。","synopsis":"東京で学ぶ「私」は、鎌倉で出会った謎めいた男性を「先生」と呼び、交流を深めていく。先生は知的で穏やかだが、人間を信じず、過去について語ろうとしない。やがて故郷の父が重病となり、「私」は家族と先生の間で揺れる。その最中、先生から長い手紙が届き、若き日の友情と恋愛、そして罪の記憶が明かされる。","appeal":"友情、恋愛、罪悪感、明治の終わりが一人の告白に集約される。先生の秘密そのものより、なぜ彼が何十年も過去から逃れられなかったかが重い。三部構成によって、世代と価値観の断絶も浮かぶ。","recommend":"日本近代文学の基本作を読みたい人／罪悪感を描く心理小説が好きな人／長い告白形式の物語を読みたい人","before":"「明治の精神」という言葉が鍵。乃木希典の殉死や明治天皇崩御という時代背景を軽く知ると、先生の選択が見えやすい。","question":"先生が手紙で過去を告白したことは、「私」への誠実さなのか、それとも最後の自己満足なのか。","mood":[5,3,4,2],"year":1914},{"no":36,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"海外","title":"侍女の物語","author":"マーガレット・アトウッド","region":"カナダ","era":"20世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"女性の身体と生殖を国家が管理する社会を描くディストピア。\n権利が失われる過程と、物語を語ることの抵抗性を考えられる。","hook":"子どもを産むための身体として管理された女性は、心の自由をどこに隠すのか。","synopsis":"環境汚染と出生率低下ののち、アメリカには宗教的独裁国家ギレアデが成立した。妊娠可能な女性オブフレッドは、司令官の家に配属される〈侍女〉として、妻の代わりに子を産む役割を課される。本名、家族、仕事、読書を奪われた彼女は、過去の記憶を語りながら、監視と処罰の社会でわずかな抵抗の可能性を探る。","appeal":"極端な未来社会を描きながら、制度が女性の身体と言葉をどう支配するかを具体的に示す。主人公の内面には恐怖だけでなく皮肉や欲望もあり、単純な英雄物語にしないところが強い。","recommend":"ディストピア小説が好きな人／ジェンダーと権力の問題を考えたい人／静かな抵抗の物語を読みたい人","before":"語りは断片的で、過去と現在を行き来する。終盤の「歴史資料についての注釈」まで読むことで、物語の見え方が変わる。","question":"自由を奪われた状況で、生き延びるための妥協は抵抗の放棄と言えるのか。","mood":[4,2,3,3],"year":1985},{"no":37,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"日本","title":"坊っちゃん","author":"夏目漱石","region":"日本","era":"明治","genre":"近代文学","difficulty":1,"length":"短","why":"正義感の強い青年が地方社会の欺瞞にぶつかる痛快な小説。\n語り口のテンポと、単純な正義が現実でどう揺らぐかを楽しめる。","hook":"正義感だけは強い新米教師が、田舎の学校で大人たちのずるさにぶつかる。","synopsis":"東京育ちで無鉄砲な青年「坊っちゃん」は、四国の中学校へ数学教師として赴任する。生徒たちのいたずら、教師同士の陰湿な駆け引き、気取った教頭「赤シャツ」への反感に振り回されながらも、坊っちゃんは自分なりの正義を貫こうとする。味方となる数学主任「山嵐」とともに、学校内の不正へ立ち向かう。","appeal":"語り手の短気で単純な性格が、そのまま文章のテンポと笑いになる。坊っちゃんの正義は乱暴で危なっかしいが、損得で立場を変える大人たちへの痛快な反発として読める。","recommend":"夏目漱石を読みやすい作品から始めたい人／風刺と笑いのある学校小説が好きな人／まっすぐな主人公を楽しみたい人","before":"人物にはあだ名が多い。「赤シャツ」「野だいこ」「山嵐」など、坊っちゃんの主観的な命名が人物評価そのものになっている。","question":"坊っちゃんの行動は正義なのか。それとも、他人の事情を考えない独善なのか。","mood":[5,2,3,2],"year":1906},{"no":38,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"海外","title":"ザ・ロード","author":"コーマック・マッカーシー","region":"アメリカ","era":"21世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"文明崩壊後を歩く父子を通し、極限の愛と倫理を描く。\n説明を削った文章から、希望と絶望を同時に読む力がつく。","hook":"文明が滅びた世界で、父は息子に「善い人間であれ」と教え続けられるか。","synopsis":"原因不明の大災害によって灰に覆われた世界。父と幼い息子は、寒さを避けるため南を目指して歩き続ける。食料は尽き、秩序を失った人間たちは略奪や殺人に走る。父は息子を守るためなら暴力も辞さない一方、自分たちは「火を運ぶ者」だと語り、人間らしさを失わないよう教える。","appeal":"説明を削ぎ落とした文体と灰色の風景が圧倒的。終末世界の恐怖以上に、父の愛が息子を守ると同時に縛る矛盾が胸に残る。希望がほとんどないからこそ、小さな善意が強く光る。","recommend":"重厚な終末小説を読みたい人／親子の愛を描く作品に弱い人／極限状態の倫理を考えたい人","before":"災害の原因は明かされない。世界設定の謎解きではなく、父子がどんな判断を重ねるかを見る作品。","question":"生き残るために他者を見捨てる父と、他者を信じようとする息子のどちらが「火」を守っているのか。","mood":[5,4,3,2],"year":2006},{"no":39,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"日本","title":"注文の多い料理店","author":"宮沢賢治","region":"日本","era":"大正・昭和","genre":"童話・短編集","difficulty":1,"length":"短","why":"客を食べようとする料理店という逆転の発想で、人間の傲慢を風刺する。\n童話の楽しさと不気味さが両立する寓話表現を味わえる。","hook":"山猫軒の看板どおりに準備を進めた二人の紳士は、いつの間にか料理される側になっていた。","synopsis":"狩りに出た二人の都会の紳士は、山奥で道に迷い、飼い犬も失ってしまう。空腹の彼らが見つけたのは、西洋料理店「山猫軒」。扉を開けるたびに「髪をとかしてください」「体に塩をもみこんでください」と奇妙な注文が現れる。客としてもてなされるつもりだった二人は、次第に自分たちが何のために準備させられているか気づく。","appeal":"子ども向けの童話として軽快に読める一方、人間が動物を食べ、自然を娯楽として扱う傲慢さを反転させた怖い寓話でもある。繰り返される扉と注文が、笑いから恐怖へ変わる構成が巧い。","recommend":"短く不思議な童話を読みたい人／怖さとユーモアのある作品が好きな人／宮沢賢治の自然観に触れたい人","before":"表題作を含む童話集として刊行されることが多い。まず表題作だけでも読めるが、他の童話と比べると賢治の世界が広がる。","question":"二人の紳士が最後まで本当には反省していないように見えるのは、なぜだろう。","mood":[5,1,3,2],"year":1924},{"no":40,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"海外","title":"菜食主義者","author":"ハン・ガン","region":"韓国","era":"21世紀","genre":"世界文学","difficulty":1,"length":"短","why":"肉を拒む女性をめぐる三つの視点から、家族と社会の暴力を描く。\n「異常」とされる人を誰の視点で見るかを意識できる。","hook":"ある日、妻が肉を食べなくなった。その小さな拒絶が、家族の秩序を壊していく。","synopsis":"平凡で従順な妻ヨンヘは、血にまみれた夢を見たことをきっかけに、突然肉を食べるのをやめる。夫や両親は理由を理解しようとせず、彼女を元の生活へ戻そうとする。拒絶は食事から身体、言葉、生き方へ広がり、夫、義兄、姉という三人の視点を通して、ヨンヘが人間社会から遠ざかっていく姿が描かれる。","appeal":"主人公自身の視点がほとんど与えられないため、周囲の欲望や暴力がむき出しになる。菜食という選択が、家父長制、性的支配、正常と異常の境界を揺らす。美しく静かな文章と残酷さの落差が強烈。","recommend":"短く衝撃のある文学を読みたい人／身体と社会の関係を考えたい人／ハン・ガンの作品に初めて触れる人","before":"菜食主義を論じる作品ではなく、一人の女性の拒絶を周囲がどう扱うかを描く。三部それぞれで語り手が変わる。","question":"ヨンヘの変化は病なのか、抵抗なのか。それを外側の人間が決めることはできるのか。","mood":[5,3,3,2],"year":2007},{"no":41,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"日本","title":"ジョゼと虎と魚たち","author":"田辺聖子","region":"日本","era":"現代","genre":"恋愛・短編集","difficulty":1,"length":"短","why":"障害のある女性と青年の関係を、甘さだけでなく自立の問題として描く。\n愛情と保護の境界を考える視点が得られる。","hook":"車椅子のジョゼが見たいのは、外の世界と、いつか一人になる未来だった。","synopsis":"大学生の恒夫は、夜道で乳母車のようなものに乗った少女と出会う。彼女は足が不自由で、祖母と二人きりで暮らし、自分を「ジョゼ」と呼んでいた。恒夫はジョゼの家へ通い、彼女が憧れていた場所へ連れ出すようになる。閉ざされた生活から外へ踏み出したジョゼと恒夫の関係は、恋愛の甘さだけでは進まない。","appeal":"短い作品の中に、恋愛、介護、自立、別れが凝縮されている。ジョゼを守られるだけの存在にせず、自分の欲望と覚悟を持つ人物として描くところが魅力。映画版とは異なる静かな余韻がある。","recommend":"大人の恋愛短編を読みたい人／甘いだけではない関係性を読みたい人／映画版との違いに興味がある人","before":"同名短編集の表題作。映像化作品は設定や展開が異なるので、原作は独立した短編として読むとよい。","question":"誰かを愛することと、その人の人生を背負い続けることは同じなのか。","mood":[5,2,3,2],"year":1984},{"no":42,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"海外","title":"少年が来る","author":"ハン・ガン","region":"韓国","era":"21世紀","genre":"世界文学","difficulty":1.3,"length":"中","why":"光州事件を複数の声から描き、国家暴力と記憶の継承を問う。\n歴史上の死者に文学がどう声を与えるかを体感できる。","hook":"虐殺された少年の声は、沈黙させられたあとも、生き残った人々の中で響き続ける。","synopsis":"1980年、韓国・光州。軍の弾圧で多くの市民が殺される中、中学生の少年ドンホは、遺体が集められた体育館で友人を捜し、死者の身元確認を手伝う。その後、少年に関わった生存者、編集者、元囚人、母親らの視点へ物語は移り、虐殺の記憶が数十年にわたって人々の身体と人生に残る様子が描かれる。","appeal":"歴史的事件を説明するだけでなく、暴力が人の尊厳、記憶、言葉をどう傷つけ続けるかを複数の声から描く。読むのは苦しいが、死者を数字にせず、一人ひとりの存在として記憶する力がある。","recommend":"歴史と個人の記憶を描く文学を読みたい人／韓国現代史に関心がある人／重くても忘れがたい作品を求める人","before":"光州事件（光州民主化運動）を扱う。凄惨な描写があるため、心身に余裕のあるときに読むのがおすすめ。","question":"国家が事件を忘れさせようとするとき、文学は死者と生存者のために何ができるのか。","mood":[5,4,4,3],"year":2014},{"no":43,"phase":2,"phaseTitle":"読書の助走②：物語の快感","category":"日本"," "era":"現代","genre":"純文学","difficulty":1.5,"length":"短","why":"病弱で気性の激しい少女と周囲の人々の夏を描く青春小説。\n魅力的だが傷つけもする人物を、単純に裁かず読む経験が得られる。","hook":"病弱で美しく、意地悪なつぐみ。最後の夏、海辺の町で彼女は初めて未来を望む。","synopsis":"海辺の旅館で育ったまりあは、東京へ引っ越した後、従姉妹のつぐみから手紙を受け取る。生まれつき病弱なつぐみは、わがままで口が悪く、周囲を振り回す一方、強烈な生命力を持っていた。旅館が閉まる最後の夏、まりあは故郷へ戻り、つぐみや新しく出会った恭一と過ごす。限りある時間の中で、少女たちは別れと未来に向き合う。","appeal":"つぐみは善良でも素直でもないが、死の近さに反抗するような生の勢いが魅力的。夏の海、旅館、手紙の情景に、青春の終わりと故郷を失う寂しさが重なる。","recommend":"夏の終わりを感じる青春小説が好きな人／欠点だらけでも魅力的な人物を読みたい人／吉本ばななの初期作品に触れたい人","before":"表記は『TUGUMI』だが主人公の名はつぐみ。語り手まりあの成長と、つぐみの変化の両方を見る。","question":"つぐみの攻撃的な態度は、生きることへの執着とどのようにつながっているのか。","mood":[4,3,3,2],"year":1989},{"no":52,"phase":3,"phaseTitle":"人物と感情①","category":"海外","title":"高慢と偏見","author":"ジェイン・オースティン","region":"イギリス","era":"19世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"恋愛喜劇の形で、階級、偏見、自己認識の変化を鮮やかに描く。\n会話の機知と、人物が誤解を修正していく過程を楽しめる。","hook":"第一印象は最悪。けれど、互いの高慢と偏見を捨てたとき、相手の本当の姿が見え始める。","synopsis":"五人姉妹の次女エリザベス・ベネットは、知性と観察眼に富み、結婚だけを人生の目的とは考えない女性。近隣に裕福な青年ビングリーと友人ダーシーが現れ、姉ジェインとの恋が始まる一方、エリザベスは高慢に見えるダーシーへ強い反感を抱く。しかし、求婚と拒絶、手紙、家族の騒動を経て、二人は自分の思い込みに気づいていく。","appeal":"恋愛小説の古典でありながら、会話の皮肉、家族の滑稽さ、財産と結婚の現実がテンポよく描かれる。エリザベスとダーシーが相手だけでなく、自分自身の欠点を認める成長物語として爽快。","recommend":"会話の面白い恋愛小説が好きな人／自立した女性主人公を読みたい人／海外古典に楽しく入りたい人","before":"当時の女性にとって結婚は経済的生存と直結していた。財産相続の制度を意識すると、母親の焦りも単なる滑稽さではなくなる。","question":"相手を正しく知るためには、第一印象を捨てるだけでなく、自分の判断力への自信も疑う必要があるのか。","mood":[4,1,3,3],"year":1813},{"no":53,"phase":3,"phaseTitle":"人物と感情①","category":"日本","title":"妊娠カレンダー","author":"小川洋子","region":"日本","era":"現代","genre":"短編集","difficulty":1.5,"length":"短","why":"妊娠を見つめる少女の冷静で不穏な視点が光る短編。\n祝福される出来事の裏側にある身体感覚や嫌悪を読む視点が得られる。","hook":"姉の妊娠を記録する妹の目には、祝福される生命が少しずつ不気味に映っていく。","synopsis":"語り手の少女は、妊娠した姉と義兄の家で暮らしながら、姉の体調や食事、腹部の変化を日記のように記録する。姉はつわりに苦しみ、特定の食べ物を拒み、家の空気は緊張していく。妹は冷静に姉を観察し、あるジャムを作って食べさせる。日常的な妊娠の風景は、彼女の無邪気とも悪意ともつかない視線によって静かな恐怖へ変わる。","appeal":"妊娠という生命の誕生を、温かさではなく異物感と身体の変化から描く。語り手の感情が説明されないため、親切と残酷さの境界が曖昧になり、読後に不穏さが残る。","recommend":"静かな恐怖を描く短編が好きな人／小川洋子の初期作品を読みたい人／身体をめぐる文学に関心がある人","before":"三編を収めた作品集の表題作。派手な展開より、食べ物、匂い、身体の細部に積み重なる違和感を読む。","question":"語り手は姉を傷つけようとしているのか。それとも、他人の身体への想像力が欠けているだけなのか。","mood":[4,2,3,2],"year":1991},{"no":54,"phase":3,"phaseTitle":"人物と感情①","category":"海外","title":"ジェイン・エア","author":"シャーロット・ブロンテ","region":"イギリス","era":"19世紀","genre":"世界文学","difficulty":2.1,"length":"長","why":"孤児の女性が自尊心を守りながら愛と自立を選ぶ成長小説。\n恋愛と経済的・精神的自立の関係を考えられる。","hook":"孤児で貧しい家庭教師は、愛する男の秘密を知っても、自分の尊厳を手放さない。","synopsis":"孤児ジェイン・エアは、冷遇された親戚の家と厳しい寄宿学校で育つ。成人後、家庭教師としてソーンフィールド邸に勤め、館の主人ロチェスターと惹かれ合う。しかし、屋敷では不可解な笑い声や事件が続き、結婚を目前に重大な秘密が明らかになる。ジェインは愛に従うか、自分の良心と独立を守るかを迫られる。","appeal":"ゴシック的な謎と激しい恋愛を楽しみながら、階級、宗教、女性の自立を読める。ジェインは愛されることを望みつつ、相手と対等であることを譲らない。その声の強さが現代にも響く。","recommend":"波乱のある恋愛古典を読みたい人／自立する女性主人公が好きな人／ゴシック小説の雰囲気を味わいたい人","before":"十九世紀の女性が経済的に自立する難しさが背景にある。恋愛の成否だけでなく、ジェインがどんな条件なら相手と結ばれるかを見る。","question":"ジェインが守ろうとする「自分自身」とは、愛情、道徳、経済的自立のどれによって支えられているのか。","mood":[4,2,3,3],"year":1847},{"no":55,"phase":3,"phaseTitle":"人物と感情①","category":"日本","title":"蛇を踏む","author":"川上弘美","region":"日本","era":"現代","genre":"幻想","difficulty":1.5,"length":"短","why":"日常に蛇や異界が入り込む、川上弘美らしい不思議な短編。\n現実と幻想の境目を曖昧なまま楽しむ感覚が身につく。","hook":"蛇を踏んだ女性の家に、母を名乗る蛇が上がり込み、奇妙な共同生活が始まる。","synopsis":"数珠屋で働くヒワ子は、草むらで蛇を踏む。蛇は人間の女の姿になって彼女の家へ現れ、「あたしはあんたのお母さんよ」と言い、料理や掃除を始める。周囲の人々も蛇の存在を特別には驚かず、日常は少しずつ異界へ侵食されていく。ヒワ子は蛇を拒絶しながらも、その親密さから完全には逃れられない。","appeal":"不思議な出来事が説明されないまま、淡々と生活へ入り込む川上弘美らしい作品。母娘関係、身体、他者との境界が、蛇という生々しい存在によって揺らぐ。奇妙で笑えるのに、底には不安がある。","recommend":"日常と幻想が混ざる小説が好きな人／短く不可思議な純文学を読みたい人／解釈の余白を楽しめる人","before":"出来事の原因や象徴の正解は示されない。「蛇＝何か」と固定せず、ヒワ子が感じる嫌悪と親密さの両方を見る。","question":"ヒワ子が蛇を恐れるのは、異形だからなのか、それとも自分の内側へ入り込む親密さそのものが怖いからなのか。","mood":[4,2,3,2],"year":1996},{"no":56,"phase":3,"phaseTitle":"人物と感情①","category":"海外","title":"嵐が丘","author":"エミリー・ブロンテ","region":"イギリス","era":"19世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"破壊的な愛と復讐が世代を越えて続く、激しいゴシック小説。\n語りの入れ子構造と、情熱を美化しすぎない読み方を学べる。","hook":"愛が深すぎて憎しみに変わり、死後まで二つの家族を破壊する。","synopsis":"荒野に建つ屋敷〈嵐が丘〉の主人アーンショーは、孤児ヒースクリフを引き取る。娘キャサリンとヒースクリフは強く結びつくが、身分の差と誤解によって引き離される。キャサリンが隣家のエドガーと結婚すると、姿を消していたヒースクリフは富を得て戻り、自分を傷つけた者たちとその子ども世代へ執拗な復讐を始める。","appeal":"美しい恋愛物語というより、愛、所有欲、階級、復讐が何世代にも連鎖する激しい悲劇。荒野と屋敷の風景が人物の感情と一体化し、ヒースクリフとキャサリンの関係は共感と拒絶の両方を呼ぶ。","recommend":"破滅的な愛の物語が好きな人／ゴシックな雰囲気を味わいたい人／複雑な家族小説を読みたい人","before":"同名・似た名前の人物が多く、二世代にわたる。簡単な家系図を手元に置くと読みやすい。語りも複数人を介している。","question":"ヒースクリフとキャサリンの結びつきは愛なのか、それとも互いを自分の一部として所有しようとする執着なのか。","mood":[5,3,3,3],"year":1847},{"no":57,"phase":3,"phaseTitle":"人物と感情①","category":"日本","title":"六番目の小夜子","author":"恩田陸","region":"日本","era":"現代","genre":"青春・幻想","difficulty":1.8,"length":"中","why":"学校に広がる伝説と集団心理を描いた学園ミステリー。\n噂が現実を作る仕組みと、青春群像の構成を楽しめる。","hook":"三年に一度、学校に現れる謎の生徒「サヨコ」。今年はなぜか、六番目がいた。","synopsis":"地方の高校には、三年に一度「サヨコ」と呼ばれる生徒が選ばれ、秘密の役目を果たすという伝説がある。その年、役目を引き継いだ関根秋は、始業式の日に津村沙世子という転校生が現れたことに戸惑う。誰にも正体を明かしていないはずなのに、沙世子は伝説を知っているように振る舞う。文化祭へ向け、学校全体が異様な熱気に包まれていく。","appeal":"学園の噂、演劇、閉鎖された校舎という青春の高揚感と、不気味な伝承が融合する。怪異の正体を完全には説明せず、集団の期待と恐怖が現実を作る感覚を残す。","recommend":"学園ミステリーが好きな人／学校の七不思議にわくわくする人／恩田陸の原点的作品を読みたい人","before":"視点人物が複数おり、人間関係が少しずつ交差する。謎の答えだけでなく、学校という集団が伝説に飲まれる過程を楽しむ。","question":"サヨコの力は本当に超自然的なものなのか。それとも、生徒たちが物語を信じる力が生み出したのか。","mood":[4,2,3,2],"year":1992},{"no":58,"phase":3,"phaseTitle":"人物と感情①","category":"海外","title":"若きウェルテルの悩み","author":"ゲーテ","region":"ドイツ","era":"18世紀","genre":"世界文学","difficulty":1.5,"length":"短","why":"報われない恋に没入する青年の手紙から、感情の暴走を描く。\nロマン主義の熱と、自分の物語に閉じこもる危うさが分かる。","hook":"かなわない恋を「純粋」と信じた青年は、自分の感情だけで世界を見失っていく。","synopsis":"青年ウェルテルは、自然豊かな土地でロッテと出会い、強く惹かれる。しかし彼女には、誠実な婚約者アルベルトがいた。ウェルテルは二人と親しく交流しながらも、ロッテへの思いを抑えられない。友人への手紙の中で、喜びは執着へ、憧れは絶望へ変わり、彼の世界は次第に恋だけに占められていく。","appeal":"若者の感情を社会的な規範より上に置いた、文学史上重要な作品。ウェルテルの情熱は美しくも危うく、読者は共感しながら、彼が他者を自分の物語の登場人物にしていく独善にも気づく。","recommend":"激しい恋愛文学を読みたい人／ロマン主義の入口を探している人／感情と自己陶酔の境界を考えたい人","before":"十八世紀の書簡体小説。刊行当時、若者に大きな影響を与えた。自死を扱うため、つらい時期には無理に読まない。","question":"ウェルテルの恋は純粋だから悲劇になったのか、それとも相手の意思を見ない自己中心性によって悲劇になったのか。","mood":[4,3,3,2],"year":1774},{"no":59,"phase":3,"phaseTitle":"人物と感情①","category":"日本","title":"重力ピエロ","author":"伊坂幸太郎","region":"日本","era":"現代","genre":"ミステリー","difficulty":1.8,"length":"中","why":"家族の傷と連続事件を軽快な会話で結ぶ伊坂作品の代表作。\n重い題材をユーモアで運ぶ方法と、家族の定義を考えられる。","hook":"連続放火事件と家族の秘密。重力に逆らうように、兄弟は過去を軽やかに受け止めようとする。","synopsis":"大学院生の泉水と、落書き消しを仕事にする弟・春。二人は父から「お前たちの生まれ方は深刻だが、人生まで深刻になる必要はない」と育てられた。街では、遺伝子に関係する施設を狙った連続放火事件が起きる。亡くなった母、癌を患う父、兄弟の出生にまつわる重い秘密が、事件と少しずつ結びついていく。","appeal":"性暴力や遺伝という重い題材を扱いながら、兄弟の会話と父のユーモアで物語を軽やかに進める。謎解き以上に、「生まれ」と「人生」は同じではないという家族の思想が印象に残る。","recommend":"家族を描くミステリーが好きな人／伊坂幸太郎らしい会話を楽しみたい人／重いテーマを希望のある形で読みたい人","before":"センシティブな出生の背景を扱う。事件の犯人探しだけでなく、父が家族に与えた言葉と態度を見る。","question":"人の性格や人生を決めるものとして、遺伝と育った環境をどこまで分けて考えられるのか。","mood":[5,3,3,3],"year":2003},{"no":60,"phase":3,"phaseTitle":"人物と感情①","category":"海外","title":"ドリアン・グレイの肖像","author":"オスカー・ワイルド","region":"アイルランド／イギリス","era":"19世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"美を保つ肖像と堕落する本人を対照させ、美と倫理の関係を問う。\n機知に富む文章と、欲望の自己正当化を読む楽しさが得られる。","hook":"美しい青年の代わりに肖像画だけが老い、彼の罪と腐敗を引き受けていく。","synopsis":"純真で美しい青年ドリアン・グレイは、画家バジルのモデルとなり、自分の肖像画を見て若さの儚さを知る。快楽主義者ヘンリー卿の言葉に影響され、「自分の代わりに肖像画が老いればいい」と願った彼は、美貌を保ったまま享楽と残酷さに身を委ねていく。その一方、隠された肖像だけが彼の年齢と罪を刻み続ける。","appeal":"退廃的で華麗な会話、ゴシック的な恐怖、芸術と道徳の問題が一つになった作品。外見が変わらなければ罪悪感も消えるのか、芸術は人間の本性を映すのかを問いかける。","recommend":"美と退廃を描く古典が好きな人／ゴシック小説を読みたい人／芸術と倫理の関係を考えたい人","before":"序文には芸術観を示す逆説的な警句が並ぶ。ヘンリー卿の言葉を作者の結論としてそのまま受け取らず、ドリアンへの影響を見る。","question":"ドリアンを堕落させたのはヘンリー卿の思想なのか、それを選び続けた本人なのか、それとも美を崇拝する社会なのか。","mood":[4,2,3,3],"year":1890},{"no":61,"phase":3,"phaseTitle":"人物と感情①","category":"日本","title":"白夜行","author":"東野圭吾","region":"日本","era":"現代","genre":"ミステリー","difficulty":2.1,"length":"長","why":"犯罪によって結びついた二人の人生を長い時間軸で追う。\n人物の内面をあえて描かないことで生まれる謎と余韻を体感できる。","hook":"光の届かない場所で結ばれた少年と少女は、互いを守るためにどこまで闇を深くするのか。","synopsis":"大阪の質屋で店主が殺される。容疑者は浮かぶものの事件は決着せず、その後、被害者の息子・桐原亮司と容疑者の娘・唐沢雪穂は別々の人生を歩み始める。二人は表立って交わらないまま成長するが、周囲では不可解な事件が次々と起こる。長い歳月を追いながら、二人の関係と過去の真相が少しずつ浮かび上がる。","appeal":"犯人探しよりも、二人がどんな人生を選び、周囲に何を残していくかを追う犯罪小説。直接語られない感情や関係を、断片から読者自身が組み立てる面白さがある。","recommend":"重厚な長編ミステリーが好きな人／暗い人間関係を描く物語を読みたい人／余白の多い構成に惹かれる人","before":"亮司と雪穂の内面はほとんど直接描かれない。二人を取り巻く人物の視点から、その行動と関係を推測して読む作品。","question":"互いを守るための行為が他者を傷つけ続けるとき、それを愛と呼べるのか。","mood":[3,2,4,3],"year":1999},{"no":62,"phase":3,"phaseTitle":"人物と感情①","category":"海外","title":"ジキル博士とハイド氏","author":"R・L・スティーヴンソン","region":"イギリス","era":"19世紀","genre":"世界文学","difficulty":1.5,"length":"短","why":"善と悪を別人格として分離する幻想から、人間の二面性を描く。\n単純な勧善懲悪を越えて、抑圧された欲望を考えられる。","hook":"善良な医師の中に生まれた邪悪な人格は、本当に別人だったのか。","synopsis":"ロンドンの弁護士アタスンは、友人ジキル博士の遺言に、見知らぬ男ハイドの名が記されていることを不審に思う。ハイドは残虐な事件を起こしながら、なぜかジキルの家へ自由に出入りしていた。二人の奇妙な関係を追ううち、善良な科学者と忌まわしい男を結ぶ秘密が明らかになっていく。","appeal":"「人間の中には善と悪が共存する」という主題を、短く強烈な怪奇小説にした古典。結末を知っていても、抑圧された欲望と自己分裂の恐ろしさを味わえる。","recommend":"短い怪奇小説を読みたい人／二重人格ものの原点に触れたい人／人間の善悪を考えたい人","before":"現代では有名な仕掛けだが、発表当時は謎解きとして読まれた。結末より、ジキルが何を望んだのかに注目したい。","question":"悪を自分から切り離そうとすることは、悪を克服することになるのか。","mood":[4,2,3,2],"year":1886},{"no":63,"phase":3,"phaseTitle":"人物と感情①","category":"日本","title":"模倣犯","author":"宮部みゆき","region":"日本","era":"現代","genre":"社会派ミステリー","difficulty":2.4,"length":"超長","why":"連続殺人と報道被害を、多数の人物の視点から描く大作。\n犯罪を犯人だけでなく、被害者・家族・メディアの構造から見る力がつく。","hook":"善意も悲しみも、巨大な事件の「物語」に消費されていく。","synopsis":"東京都内で起きた一家殺害事件を発端に、犯人を名乗る男が世間を挑発しながら新たな犯罪を重ねていく。遺族、捜査関係者、報道機関、事件に巻き込まれた人々の視点が交錯し、犯罪そのものだけでなく、それを見世物にする社会の姿まで描かれる。犯人はなぜ人々の注目を欲し、誰の痛みを利用しているのか。","appeal":"犯人と警察だけの物語ではなく、被害者遺族、メディア、傍観者まで含めて犯罪が社会に広がる過程を描く。長大だが、多数の人物が一つの事件へ集まる構成に引き込まれる。","recommend":"社会派ミステリーが好きな人／長編群像劇を読みたい人／犯罪報道のあり方を考えたい人","before":"登場人物が多く、視点も頻繁に変わる。犯人当てだけでなく、事件によって人生を変えられた人々を追うつもりで読むとよい。","question":"犯罪を知りたいという好奇心は、どこから被害者の痛みを消費する行為に変わるのか。","mood":[3,3,3,3],"year":2001},{"no":64,"phase":3,"phaseTitle":"人物と感情①","category":"海外","title":"宝島","author":"R・L・スティーヴンソン","region":"イギリス","era":"19世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"海賊と宝探しの原型を作った冒険小説。\nテンポある物語運びと、少年が危険を通して成長する型を楽しめる。","hook":"宝の地図を手にした少年は、海賊たちと同じ船で未知の島へ向かう。","synopsis":"宿屋で暮らす少年ジムは、ある老船乗りが残した宝島の地図を手に入れる。地主や医師とともに船を用意し、宝を探す航海へ出るが、乗組員の中には片脚の料理番ジョン・シルバーを中心とした海賊たちが紛れ込んでいた。島に着いた一行は、宝をめぐる裏切りと戦いに巻き込まれていく。","appeal":"海賊、宝の地図、孤島、反乱という冒険物語のイメージを決定づけた一冊。特にシルバーは、親しみやすさと危険さを併せ持つ忘れがたい人物。","recommend":"王道の冒険小説を読みたい人／少年の成長物語が好きな人／海賊ものの原点に触れたい人","before":"単純な善悪の対立ではなく、ジムが魅力的で恐ろしいシルバーに惹かれる点が重要。古い翻訳では言葉遣いに慣れが必要な場合がある。","question":"危険だと分かっている人物に、人はなぜ魅力を感じるのか。","mood":[4,2,3,2],"year":1883},{"no":65,"phase":3,"phaseTitle":"人物と感情①","category":"日本","title":"告白","author":"湊かなえ","region":"日本","era":"現代","genre":"ミステリー","difficulty":1.5,"length":"短","why":"教師の告白から複数の証言が重なる復讐劇。\n同じ事件が語り手によって変わることと、正義の危うさを学べる。","hook":"教師の静かな告白から、教室全体を巻き込む復讐が始まる。","synopsis":"中学校の終業式。担任の森口悠子は、生徒たちに「私の娘は、このクラスの生徒に殺されました」と告げる。犯人とされる二人の少年に対して、彼女は法ではない方法で復讐を開始する。その後、少年たちや家族、周囲の人物の告白が重なり、同じ事件が異なる姿を見せていく。","appeal":"複数の一人称によって、加害者も被害者も自分に都合のよい物語を作っていることが見えてくる。短く読みやすいが、復讐、少年犯罪、親子関係について重い問いを残す。","recommend":"一気読みできる心理ミステリーを探している人／語り手によって真実が変わる作品が好きな人／暗い復讐劇を読みたい人","before":"登場人物の告白をそのまま事実と思わず、何を語り、何を隠しているかを見ると面白い。","question":"法が十分に裁けないと感じたとき、個人の復讐は正当化されるのか。","mood":[5,2,3,2],"year":2008},{"no":66,"phase":3,"phaseTitle":"人物と感情①","category":"海外","title":"緋文字","author":"ナサニエル・ホーソーン","region":"アメリカ","era":"19世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"姦通の印を負わされた女性を通して、宗教共同体の偽善を描く。\n罪を個人に押しつける社会と、象徴の読み方を考えられる。","hook":"胸に刻まれた赤い「A」は、罪の印なのか、それとも生き抜いた証なのか。","synopsis":"清教徒社会のボストン。夫の不在中に子を産んだヘスター・プリンは、姦通の罪を示す赤い文字「A」を胸につけて生きるよう命じられる。しかし彼女は子の父親を明かさず、町の外れで娘パールを育てる。やがて、罪を公に背負う者、秘密を抱える者、復讐に取りつかれる者の運命が交差する。","appeal":"厳格な共同体が一人の女性へ押しつける恥と、その印を別の意味へ変えていく強さを描く。罪、偽善、赦しをめぐる象徴が豊かなアメリカ文学の古典。","recommend":"社会と個人の対立を描く古典が好きな人／宗教と道徳の問題に関心がある人／象徴を読み解く作品を楽しみたい人","before":"舞台は十七世紀の清教徒社会。姦通そのものより、罪を公開される者と隠せる者の違いに注目するとよい。","question":"罪を公に背負うことと、秘密のまま抱えることでは、どちらが人をより深く傷つけるのか。","mood":[4,2,3,3],"year":1850},{"no":67,"phase":3,"phaseTitle":"人物と感情①","category":"日本","title":"世界の中心で、愛をさけぶ","author":"片山恭一","region":"日本","era":"現代","genre":"恋愛","difficulty":1.5,"length":"短","why":"喪失した恋を回想する、平成を代表する純愛小説。\n感情を直線的に伝える物語の強さと、記憶が美化される仕組みを見られる。","hook":"最愛の人を失った少年は、彼女との時間を記憶の中でもう一度生きる。","synopsis":"高校生の朔太郎は、同級生のアキと親しくなり、二人は恋人同士になる。交換日記や無人島への旅行など、穏やかな時間を重ねるが、アキの体調に異変が現れる。現在の朔太郎は、故郷で ","synopsis":"ミシシッピ川沿いの町で暮らすトム・ソーヤーは、学校や礼拝を抜け出し、友人ハックと冒険ばかりしている。ある夜、墓地で思いがけず殺人を目撃した二人は、恐ろしい犯人に狙われる不安を抱える。洞窟探検、海賊ごっこ、宝探しを重ねながら、トムは勇気を試されていく。","appeal":"子どもの空想が現実の危険へ接続する、明るく活気ある冒険小説。白い柵塗りなど有名な場面には、人を動かすトムの知恵といたずら心が凝縮されている。","recommend":"子どもの冒険物語が好きな人／古典を楽しく読みたい人／友情と成長の物語を求める人","before":"ハックルベリー・フィンと同じ世界の物語だが、こちらの方が明るく少年小説らしい。時代背景による差別的表現には注意。","question":"大人の規則に逆らうことは、子どもが自分の世界を作るために必要なのか。","mood":[5,3,3,2],"year":1876},{"no":71,"phase":3,"phaseTitle":"人物と感情①","category":"日本","title":"雪国","author":"川端康成","region":"日本","era":"昭和","genre":"純文学","difficulty":1.5,"length":"短","why":"温泉町の芸者との関係を、雪景色と繊細な感覚で描く。\n筋よりも情景・音・余白を味わう川端文学の読み方が分かる。","hook":"雪に閉ざされた温泉町で、男は一人の芸者の激しい思いに触れる。","synopsis":"東京で無為に暮らす島村は、雪国の温泉町を訪れ、芸者の駒子と再会する。島村には家庭があり、駒子との関係に責任を負うつもりはない。それでも駒子は彼への思いを深め、病人を支える葉子という女性も二人の間に影を落とす。雪、火、鏡、音の美しい情景の中で、届かない感情が交錯する。","appeal":"物語を説明するより、雪景色や身体の動き、会話の間から感情を立ち上げる小説。美しい文章の裏に、島村の無責任さと駒子の切実さがある。","recommend":"日本語の美しい小説を読みたい人／余白の多い恋愛小説が好きな人／川端康成の代表作に触れたい人","before":"筋を急いで追うとつかみにくい。鏡、雪、火、星空などのイメージが人物の感情とどう響くかを味わいたい。","question":"相手の人生を引き受ける気がないまま、その愛情を受け取ることは残酷なのか。","mood":[4,2,3,2],"year":1935},{"no":72,"phase":3,"phaseTitle":"人物と感情①","category":"海外","title":"二十日鼠と人間","author":"ジョン・スタインベック","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.5,"length":"短","why":"大恐慌下の労働者二人の友情と夢を描く短い悲劇。\n善意だけでは救えない社会と、夢が人を支える力を考えられる。","hook":"小さな農場を持つ夢だけが、過酷な現実の中で二人をつないでいた。","synopsis":"大恐慌時代のアメリカ。季節労働者のジョージとレニーは、いつか自分たちの土地を買い、誰にも命令されず暮らすことを夢見て農場を渡り歩く。知的障害のある大男レニーは、柔らかいものを愛するが、自分の力を制御できない。新しい農場で働き始めた二人の夢は、少しずつ現実味を帯びるが、予期せぬ出来事が起こる。","appeal":"短い物語の中に、友情、貧困、障害、夢の脆さを凝縮している。二人が繰り返し語る小さな農場の夢が、希望であるほど切なく響く。","recommend":"短く重い海外文学を読みたい人／男同士の友情を描く作品が好きな人／社会的弱者の物語に関心がある人","before":"題名はロバート・バーンズの詩に由来し、最善の計画も崩れるという含意がある。結末の善悪を簡単に決めずに読みたい。","question":"愛する人を守るために、その人の望まない選択をすることは許されるのか。","mood":[4,3,3,2],"year":1937},{"no":73,"phase":3,"phaseTitle":"人物と感情①","category":"日本","title":"風立ちぬ","author":"堀辰雄","region":"日本","era":"昭和前期","genre":"純文学","difficulty":1.5,"length":"短","why":"病む婚約者との時間を、軽井沢の風景と静かな文体で描く。\n幸福と死が同時に存在する抒情小説の味わいを得られる。","hook":"死が近づく時間の中で、二人は「生きている幸福」を見つめ続ける。","synopsis":"主人公の「私」は、婚約者の節子とともに高原のサナトリウムで過ごす。節子は重い病を患い、二人の未来には死の影が差している。それでも自然の光や風、静かな会話の中で、二人は限られた時間を生きる意味を確かめようとする。後半では、喪失後の記憶と孤独が描かれる。","appeal":"悲劇を激しく語らず、風景と沈黙の中に愛と死を置く作品。美しい自然描写が、幸福と喪失が同時に存在する感覚を伝える。","recommend":"静かな恋愛小説が好きな人／死と向き合う文学を読みたい人／詩的な文章を味わいたい人","before":"題名はヴァレリーの詩句に由来する。筋よりも、高原の季節や風景が二人の感情をどう包むかに注目するとよい。","question":"終わりが近いと知っている時間は、不幸なのか、それとも一層濃く生きられる時間なのか。","mood":[4,3,4,3],"year":1937},{"no":74,"phase":3,"phaseTitle":"人物と感情①","category":"海外","title":"エデンの東","author":"ジョン・スタインベック","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":2.4,"length":"超長","why":"兄弟と家族の歴史を、善悪の選択という大きな主題で描く大河小説。\n人物の成長を世代と聖書的象徴から読む楽しさがある。","hook":"親から子へ受け継がれる善と悪の物語を、聖書の兄弟殺しになぞらえて描く。","synopsis":"十九世紀末から二十世紀初頭のカリフォルニア。トラスク家とハミルトン家、二つの家族の歴史が交差する。アダム・トラスクは美しいキャシーと結婚するが、彼女の冷酷さによって人生を壊される。やがて双子の息子キャルとアロンは、父の愛をめぐって対立し、旧約聖書のカインとアベルを思わせる運命に直面する。","appeal":"家族小説でありながら、善悪は生まれつきか、過去を乗り越えられるかという大きな問いを扱う。「汝は治めることができる」という思想が物語の核になる。","recommend":"壮大な家族史を読みたい人／聖書的な主題に関心がある人／善悪と自由意志を考えたい人","before":"カインとアベルの物語が繰り返し変奏される。登場人物の名前や兄弟関係に注目すると構造が見えやすい。","question":"人は親から受け継いだ性質や罪を、自分の選択によって乗り越えられるのか。","mood":[3,2,4,3],"year":1952},{"no":75,"phase":3,"phaseTitle":"人物と感情①","category":"日本","title":"斜陽","author":"太宰治","region":"日本","era":"昭和前期","genre":"純文学","difficulty":1.5,"length":"短","why":"没落する家族と新しい時代の価値観を、女性の視点から描く。\n太宰文学の自己破壊だけでなく、再生へ踏み出す意志を読める。","hook":"没落する家の中で、古い価値観を捨てて生き直そうとする女がいる。","synopsis":"敗戦後、華族の家に生まれたかず子は、母とともに東京を離れ、伊豆で暮らし始める。家は没落し、弟の直治は戦争から戻っても社会になじめず、薬物と酒に溺れている。かず子は既成の道徳から抜け出すため、妻子ある作家・上原との関係に自ら踏み込んでいく。","appeal":"没落階級の悲哀だけでなく、古い道徳を壊して新しく生きようとする女性の宣言でもある。弱さ、虚勢、自己破壊が太宰らしい言葉で鋭く描かれる。","recommend":"太宰治の長編を読みたい人／戦後の価値観の崩壊に関心がある人／破滅的な人物の告白が好きな人","before":"作中の手紙や日記によって複数の声が響く。かず子の「革命」を単純な恋愛としてだけ見ないことが重要。","question":"古い道徳を壊すことは、本当に自由になることなのか。","mood":[4,3,3,3],"year":1947},{"no":76,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"武器よさらば","author":"アーネスト・ヘミングウェイ","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"戦争のただ中で生まれる恋を、簡潔で抑えた文体で描く。\nロマンスと戦争の無意味さを同時に見る視点が得られる。","hook":"戦争の中で始まった恋は、二人を救うのか、それとも別の喪失へ導くのか。","synopsis":"第一次世界大戦中のイタリア戦線。アメリカ人の救急隊員フレデリック・ヘンリーは、イギリス人看護師キャサリンと出会う。当初は軽い関係として始まった恋は、戦場での負傷と再会を経て深まっていく。敗走する軍隊と崩壊する秩序の中で、二人は戦争から逃れ、自分たちだけの生活を求める。","appeal":"戦争の英雄物語ではなく、混乱から逃げようとする一人の男と恋人を描く。簡潔な文章の下に、愛、恐怖、死が抑制されたまま流れている。","recommend":"戦争と恋愛を描く古典を読みたい人／ヘミングウェイの文体を味わいたい人／静かな悲劇に惹かれる人","before":"第一次世界大戦のイタリア戦線が舞台。淡々とした会話や反復の裏にある感情を読むと深まる。","question":"世界が崩壊しているとき、二人だけの幸福へ逃れることは可能なのか。","mood":[4,4,3,2],"year":1929},{"no":77,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"桜の森の満開の下","author":"坂口安吾","region":"日本","era":"昭和前期","genre":"幻想","difficulty":1.5,"length":"短","why":"桜の美と死体の恐怖を結びつけ、美の裏側を暴く幻想短編。\n「美しいものは善い」という直感を疑う感覚が身につく。","hook":"満開の桜は美しいのではない。人を狂わせるほど恐ろしい。","synopsis":"山に棲む山賊は、旅人を襲い、女をさらって暮らしていた。ある日、美しい女を妻にするが、彼女の残酷な要求に従ううち、山賊は人の首を集めるようになる。都へ移っても二人の関係は満たされず、やがて山賊は女を連れて山へ戻る。満開の桜の下で、彼は恐怖と美の正体に直面する。","appeal":"桜を祝祭の象徴ではなく、孤独と狂気を呼び起こす不気味な存在として描く。昔話のような語りの中に、欲望、残酷さ、美への恐怖が混ざり合う。","recommend":"短い幻想文学を読みたい人／美しく残酷な物語が好きな人／坂口安吾の異色作に触れたい人","before":"現実的な心理小説ではなく、寓話や伝説のように読むとよい。桜の美しさと恐怖が同じものとして描かれる点に注目。","question":"人が「美しい」と感じるものの中には、なぜ恐怖や破壊への衝動が潜むのか。","mood":[4,3,3,2],"year":1947},{"no":78,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"日はまた昇る","author":"アーネスト・ヘミングウェイ","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"第一次大戦後の若者たちの虚無を、会話と移動の中に描く。\n失われた世代の空気と、説明しすぎない文体を味わえる。","hook":"戦争から生き残った若者たちは、酒と旅の中で失ったものを埋めようとする。","synopsis":"第一次世界大戦後のパリ。新聞記者ジェイクは、戦傷によって恋人ブレットとの関係を成就できずにいる。二人は友人たちと酒を飲み、スペインのパンプローナへ闘牛祭を見に行く。しかし、愛情、嫉妬、虚勢がぶつかり合い、享楽的な旅の裏から戦争で傷ついた世代の空虚が現れる。","appeal":"大きな感情を説明せず、会話、酒、移動、闘牛の場面から人物の傷を見せる。いわゆる「失われた世代」の倦怠と生の感触が鮮やか。","recommend":"抑制された恋愛小説が好きな人／戦後世代の空虚を描く作品を読みたい人／ヘミングウェイの代表作に触れたい人","before":"人物たちは本音をほとんど語らない。酒量や会話のずれ、旅先での振る舞いから関係を読む作品。","question":"傷を直視せず享楽に逃れることは、生き延びる方法なのか、それとも自己破壊なのか。","mood":[4,3,3,2],"year":1926},{"no":79,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"人間椅子","author":"江戸川乱歩","region":"日本","era":"大正・昭和","genre":"怪奇・短編","difficulty":1.5,"length":"短","why":"椅子の内部に潜む男という倒錯的発想で、欲望と恐怖を刺激する。\n読者の想像力を直接操作する怪奇小説の技法を楽しめる。","hook":"あなたが座っているその椅子の中に、人が潜んでいるとしたら。","synopsis":"人気女性作家のもとに、一通の長い手紙が届く。差出人は醜い容姿を持つ家具職人で、自分が作った巨大な椅子の内部に入り込み、そこで生活していると告白する。椅子に座る人々の体温や動きを内側から感じるうち、男は奇妙な快楽と恋情を抱くようになる。そして手紙は、作家自身の身近な場所へ迫ってくる。","appeal":"ありえない設定を細部まで具体的に語ることで、読者の身体感覚をじわじわ侵食する。短いのに、椅子に座ることそのものが怖くなる乱歩の代表的怪奇譚。","recommend":"短いホラーを読みたい人／倒錯的な想像力を楽しみたい人／江戸川乱歩の入口を探している人","before":"現実性よりも、告白文が読者の想像をどう操作するかを楽しむ作品。最後の反転まで一気に読みたい。","question":"他人に知られず触れることを、愛や親密さと呼ぶことはできるのか。","mood":[4,2,3,2],"year":1925},{"no":80,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"ティファニーで朝食を","author":"トルーマン・カポーティ","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.5,"length":"短","why":"自由奔放な女性の魅力と孤独を、都会的な短編に凝縮する。\n他者を理想化する視線と、その背後にある現実を読む力がつく。","hook":"自由奔放な女性ホリーは、誰にも所有されずに生きられるのか。","synopsis":"ニューヨークで作家を目指す語り手は、同じアパートに住むホリー・ゴライトリーと知り合う。彼女は華やかな社交界を渡り歩き、裕福な男性との結婚を夢見ながら、過去や本当の自分を隠している。語り手はホリーに惹かれるが、彼女はどこにも属さず、いつでも別の場所へ去ろうとする。","appeal":"映画版のロマンチックな印象とは異なり、原作はもっと孤独でほろ苦い。ホリーの軽やかさの裏に、貧困、逃亡、帰属できない不安が見える。","recommend":"都会的で洒落た短編を読みたい人／自由と孤独を描く女性像に惹かれる人／映画との違いを楽しみたい人","before":"映画版とは設定や結末が大きく異なる。ホリーを「自由な女性」と理想化しすぎず、その自由が何からの逃避かを見るとよい。","question":"どこにも属さない自由は、解放なのか、それとも帰る場所を持てない孤独なのか。","mood":[4,3,3,2],"year":1958},{"no":81,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"走れメロス","author":"太宰治","region":"日本","era":"昭和前期","genre":"短編集","difficulty":1.5,"length":"短","why":"友情と信頼を極端な試練にかける、寓話的で力強い短編。\n単純な筋を反復と速度で盛り上げる構成を学べる。","hook":"友を信じるために、男は日没まで走り続ける。","synopsis":"暴君ディオニスに激怒した羊飼いメロスは、王を殺そうとして捕らえられる。妹の結婚式を済ませるため三日間の猶予を求め、親友セリヌンティウスを人質として残す。故郷から戻る道には川の氾濫、盗賊、疲労が立ちはだかる。メロスは友を救い、人間への信頼を証明するため走り続ける。","appeal":"教科書で有名だが、友情の美談だけではない。疑い、自己弁護、怒り、肉体の限界が激しく描かれ、信頼が一度も揺れないものではないと分かる。","recommend":"短く熱い物語を読みたい人／友情と信頼を考えたい人／太宰治の読みやすい作品から入りたい人","before":"古代ギリシアの伝説をもとにした作品。メロスの心が途中で何度も揺れる点を見落とさないと、単純な美談を超えて読める。","question":"信頼とは、疑わないことなのか、それとも疑いながらも約束を守ることなのか。","mood":[5,2,3,2],"year":1940},{"no":82,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"ナイン・ストーリーズ","author":"J・D・サリンジャー","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.5,"length":"短","why":"戦争後の若者や子どもの傷を、短い会話と沈黙で描く短編集。\nサリンジャーの省略と余韻、壊れやすい人物への距離感を味わえる。","hook":"壊れそうな人々の一瞬を、九つの短編が静かにすくい取る。","synopsis":"戦争の記憶を抱える男、繊細な少年、理解し合えない夫婦、孤独な子どもたち。サリンジャーがグラース家の人々を含むさまざまな人物を描いた九編の短編集。日常会話の軽さの下に、精神的な傷、純粋さへの憧れ、他者とつながれない苦しさが潜んでいる。","appeal":"派手な事件より、会話のずれやふとした仕草から人物の危うさを感じさせる。特に「バナナフィッシュにうってつけの日」は、明るい海辺と深い絶望の落差が強烈。","recommend":"短編小説が好きな人／サリンジャーの世界を広く知りたい人／繊細で不穏な人物描写に惹かれる人","before":"各編は独立しているが、グラース家という一家が複数の作品に登場する。すべてを理解しようとせず、余韻を受け取る読み方が合う。","question":"繊細さや純粋さは、人を救う力になるのか、それとも世界に適応できなくするのか。","mood":[4,3,3,2],"year":1953},{"no":83,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"小僧の神様","author":"志賀直哉","region":"日本","era":"大正","genre":"短編集","difficulty":1.5,"length":"短","why":"少年の期待と大人の善意が微妙にすれ違う短編。\n志賀直哉の簡潔な文章と、行動から心理を読む方法が分かる。","hook":"一皿の寿司を食べたい少年と、それを偶然かなえてしまう大人の小さな物語。","synopsis":"奉公先で働く少年・仙吉は、寿司屋の前を通るたび高価な寿司に憧れていた。ある日、店の前で財布の中身を確かめる姿を見た若い貴族院議員Aは、身分を偽って仙吉に寿司をごちそうする。仙吉はその出来事を「小僧の神様」のような存在による奇跡だと思い、Aは自分の行為の意味に複雑な気持ちを抱く。","appeal":"善意の美しさだけでなく、施す側の自己満足や気恥ずかしさまで描く短編。結末では作者自身が語りへ入り込み、小説の作り物らしさも露わにする。","recommend":"短い日本文学を読みたい人／善意の複雑さを考えたい人／志賀直哉の端正な文章に触れたい人","before":"身分差が大きかった時代の東京が舞台。最後の作者の介入を、単なる変わった終わり方ではなく、語る責任の問題として考えたい。","question":"相手を助ける行為に自己満足が含まれていても、それは善意と呼べるのか。","mood":[4,2,3,2],"year":1920},{"no":84,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"フラニーとズーイ","author":"J・D・サリンジャー","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"精神的な危機にある兄妹の対話を通して、知性と救いを問う。\n長い会話の中で思想と感情を動かす技法を味わえる。","hook":"世間の「うまくやること」に疲れた妹を、兄は言葉で救えるのか。","synopsis":"大学生のフラニーは、周囲の知的な会話や成功への欲望に嫌気が差し、恋人との食事中に倒れてしまう。実家へ戻った彼女は、俳優の兄ズーイと激しく言い争う。二人は亡き兄たちの教えや宗教的な言葉をめぐって対話しながら、他人の偽善を嫌うフラニー自身の傲慢さにも向き合っていく。","appeal":"ほとんど会話だけで、精神的な危機と兄妹の愛情を描く。知性が人を救うどころか孤立させる危険と、それでも他者と関わるための視点を探る。","recommend":"会話中心の小説が好きな人／知的な自意識に悩んだ経験がある人／『ライ麦畑でつかまえて』の次を読みたい人","before":"グラース家シリーズの一作。東洋思想やキリスト教への言及があるが、すべて理解しなくても、フラニーの嫌悪とズーイの説得を追えばよい。","question":"偽善的な世界を嫌うこと自体が、自分を他人より上に置く傲慢さになることはあるか。","mood":[4,2,3,3],"year":1961},{"no":85,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"たけくらべ","author":"樋口一葉","region":"日本","era":"明治","genre":"近代文学","difficulty":1.5,"length":"短","why":"遊郭の町で大人になる少年少女を描く明治文学の名作。\n古い言葉の奥から、階級と初恋の痛みを読む力がつく。","hook":"子どもでいられる最後の季節に、少年と少女の距離は静かに離れていく。","synopsis":"明治初期、吉原近くの町。人気者の少女・美登利と寺の息子・信如は、互いを意識しながらも素直に近づけない。町の子どもたちは派閥を作り、祭りや喧嘩に夢中になるが、美登利には遊女になる未来が、信如には僧侶になる道が待っている。二人の淡い感情は、成長とともに言葉にされないまま変化していく。","appeal":"子どもたちの活気ある世界の背後に、身分や家業によって決められた未来が見える。美登利の変化を直接説明せず、町の空気と仕草から描くのが美しい。","recommend":"切ない初恋物語が好きな人／明治文学に挑戦したい人／子どもから大人への境目を描く作品を読みたい人","before":"文語調で難しく感じやすいので、現代語訳や注釈の多い版がおすすめ。吉原という場所と美登利の将来を知ると理解しやすい。","question":"成長とは、自分で未来を選べるようになることなのか、それとも選べない現実を知ることなのか。","mood":[4,2,3,2],"year":1895},{"no":86,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"わたしを離さないで","author":"カズオ・イシグロ","region":"イギリス","era":"21世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"特殊な運命を知らず育った若者たちを通し、命と愛の有限性を描く。\n真相よりも「知っていて受け入れる」悲しさを考えられる。","hook":"自分たちの命に決められた用途があると知っても、彼らは普通に恋をし、思い出を抱く。","synopsis":"介護人として働くキャシーは、寄宿学校ヘールシャムで過ごした子ども時代を振り返る。親友ルース、トミーと学び、遊び、恋愛や嫉妬を経験した日々。しかし彼らには、生まれたときから定められた特別な役割があった。三人は大人になるにつれ、自分たちの未来とヘールシャムの教育の意味を知っていく。","appeal":"衝撃的な設定を前面に出さず、穏やかな回想の中から少しずつ世界の残酷さを見せる。限られた命、記憶、愛が人間を人間たらしめるのかを静かに問う。","recommend":"静かなディストピアが好きな人／余韻の深い恋愛小説を読みたい人／カズオ・イシグロの代表作に触れたい人","before":"謎の解明を急ぐより、キャシーが何を覚え、どう語り直しているかに注目したい。淡々とした文章の裏に強い感情がある。","question":"自分の運命を変えられないと知っていても、愛したり記憶したりすることにはどんな意味があるのか。","mood":[4,2,3,3],"year":2005},{"no":87,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"舞姫","author":"森鴎外","region":"日本","era":"明治","genre":"近代文学","difficulty":1.5,"length":"短","why":"留学先での恋と出世の間で揺れる青年を描く近代的自我の物語。\n個人の選択が国家や家制度に縛られる構図を読める。","hook":"出世を選ぶか、愛を選ぶか。青年官僚の決断は誰を犠牲にしたのか。","synopsis":"明治政府の官僚・太田豊太郎は、留学先のベルリンで踊り子エリスと出会う。孤独と挫折の中で彼女に救われ、二人は愛し合うようになる。しかし友人の相沢が現れ、豊太郎に官僚として復帰する道を示す。国家への期待、将来への野心、エリスとの生活の間で、彼は決断を迫られる。","appeal":"日本近代文学初期の代表作で、個人の愛と国家・出世の対立を描く。豊太郎の自己弁護的な語りを読むほど、彼の弱さと責任が見えてくる。","recommend":"短い近代文学に挑戦したい人／恋愛とキャリアの葛藤を描く作品が好きな人／語り手の信頼性を考えたい人","before":"文語体なので注釈や現代語訳がある版が読みやすい。豊太郎の語りをそのまま正当化せず、エリスの立場からも考えたい。","question":"自分の将来を守るために相手を見捨てた人は、社会の犠牲者なのか、それとも加害者なのか。","mood":[5,2,3,3],"year":1890},{"no":88,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"日の名残り","author":"カズオ・イシグロ","region":"イギリス","era":"20世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"執事の回想から、忠誠と自己欺瞞を静かに描く。\n信頼できない語り手と、人生の取り返せなさを行間から読む力がつく。","hook":"完璧な執事として生きた男は、人生の終わりに自分が何を失ったかを知る。","synopsis":"イギリスの老執事スティーヴンスは、新しい主人の勧めで自動車旅行へ出る。目的の一つは、かつて同じ屋敷で働いた女中頭ミス・ケントンを訪ねること。旅の途中、彼は前主人ダーリントン卿に仕えた日々と、自らが抑え込んだ感情を回想する。職業的な「品格」を守った人生は、本当に誇るべきものだったのか。","appeal":"信頼できそうでいて、自分に都合よく過去を語る主人公の回想が少しずつ崩れていく。仕事への献身、政治的責任、言えなかった愛情が静かな痛みとして残る。","recommend":"抑制された文章が好きな人／仕事と人生の関係を考えたい人／後悔を描く静かな小説を読みたい人","before":"スティーヴンスは感情を直接語らない。丁寧な言葉の裏にある否認や言い訳を読むと、物語の深さが見える。","question":"役割を完璧に果たすために自分の感情を捨てた人生を、成功と呼べるのか。","mood":[4,2,3,3],"year":1989},{"no":89,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"野菊の墓","author":"伊藤左千夫","region":"日本","era":"明治","genre":"恋愛","difficulty":1.5,"length":"短","why":"身分差によって引き裂かれる初恋を、素朴で哀切な文章で描く。\n近代の家制度と、記憶の中で純化される恋を味わえる。","hook":"従姉弟として育った二人の恋は、家と世間の都合に引き裂かれる。","synopsis":"十五歳の政夫は、従姉の民子と親しく暮らしている。二人は互いに惹かれ合うが、家族は年上の民子との関係を好ましく思わず、二人を引き離そうとする。政夫が学業のため家を離れている間に、民子には別の縁談が進められる。野菊の咲く田園を背景に、言葉にしきれない初恋と別れが描かれる。","appeal":"素朴な文章と自然描写の中に、若い二人の切実な感情がある。野菊という象徴が、民子の可憐さと失われた時間を結びつける。","recommend":"古典的な純愛小説を読みたい人／田園風景の美しい作品が好きな人／短く切ない物語を求める人","before":"明治時代の家制度と結婚観が二人の運命を左右する。現代の恋愛観だけで判断せず、選択肢の少なさを見るとよい。","question":"本人たちの気持ちより家や世間の判断が優先されるとき、その悲劇の責任は誰にあるのか。","mood":[4,2,3,2],"year":1906},{"no":90,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"わたしの名は紅","author":"オルハン・パムク","region":"トルコ","era":"20世紀","genre":"世界文学","difficulty":2.1,"length":"長","why":"細密画家たちの殺人事件を通し、東西文化と芸術観の衝突を描く。\n複数の語り手、絵画と宗教、歴史ミステリーを同時に楽しめる。","hook":"一人の絵師の死をめぐり、愛、殺人、宗教、芸術が次々と語り手を変える。","synopsis":"十六世紀末のイスタンブール。細密画家たちは、スルタンの命で西洋画の技法を取り入れた秘密の書物を制作していた。その最中、一人の絵師が殺される。帰郷したカラは、かつて愛したシェキュレとの再会を望みながら、犯人探しに関わる。死者、犬、硬貨、色までもが語り手となり、芸術と信仰をめぐる争いが広がる。","appeal":"歴史ミステリー、恋愛小説、芸術論が一体になった多声的な長編。誰が語っているかが次々変わり、東洋の細密画と西洋の写実表現の衝突を物語として味わえる。","recommend":"歴史ミステリーが好きな人／イスラム圏の文学に触れたい人／芸術と宗教の対立に関心がある人","before":"十六世紀のオスマン帝国が舞台。細密画では個性より伝統と神の視点が重んじられ、西洋画の遠近法や署名が大きな思想的問題になる。","question":"芸術家が自分だけの見方を作品に刻むことは、創造なのか、それとも伝統への裏切りなのか。","mood":[3,3,3,3],"year":1998},{"no":91,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"友情","author":"武者小路実篤","region":"日本","era":"大正","genre":"白樺派","difficulty":1.5,"length":"短","why":"親友への恋愛感情と嫉妬を率直に描く青春小説。\n自尊心が友情を壊す過程を、シンプルな心理描写から学べる。","hook":"親友と同じ女性を愛したとき、友情はどこまで耐えられるのか。","synopsis":"野島と大宮は固い友情で結ばれた青年同士。野島は杉子に思いを寄せ、その恋を親友の大宮に打ち明ける。しかし大宮もまた杉子に惹かれていた。友情を裏切りたくない気持ちと、自分の恋を捨てきれない気持ちの間で、三人の関係は次第に揺れていく。理想的な友情と現実の欲望が衝突する青春小説。","appeal":"登場人物が感情を正面から語るため、恋と友情の苦しさがむき出しで伝わる。少し青臭いほど純粋な言葉が、かえって「自分ならどうするか」を強く迫ってくる。","recommend":"友情と恋愛の板挟みを描く作品が好きな人／白樺派の理想主義に触れたい人／短めの近代文学を読みたい人","before":"現代の会話より直截で熱い表現が多い。人物の未熟さを笑うより、彼らが守ろうとする理想に注目するとよい。","question":"友情のために恋を諦めることは誠実なのか、それとも自分にも相手にも不誠実なのか。","mood":[4,2,3,2],"year":1919},{"no":92,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"雪","author":"オルハン・パムク","region":"トルコ","era":"21世紀","genre":"世界文学","difficulty":2.1,"length":"長","why":"辺境都市の政治的不安と個人の孤独を重ねる現代トルコ文学。\n宗教・世俗・民族問題を、単純な対立ではなく人物の迷いとして読める。","hook":"雪に閉ざされた町で、詩人は政治と宗教と愛の渦に巻き込まれる。","synopsis":"亡命生活を送っていた詩人カは、地方都市カルスで相次ぐ少女たちの自殺を取材するため帰国する。折しも町は大雪に閉ざされ、イスラム主義者、世俗派、軍、演劇人たちの対立が激化していた。かつて思いを寄せた女性イペキとの再会を望むカは、政治的陰謀と個人的幸福の間をさまよう。","appeal":"雪の静けさと政治的暴力が同時に存在し、信仰、近代化、国家、孤独が一つの町に凝縮される。誰の立場にも完全には寄り切れない複雑さが魅力。","recommend":"政治と宗教を扱う文学に関心がある人／閉ざされた町の群像劇が好きな人／パムクの世界へ入りたい人","before":"トルコの世俗主義とイスラム主義の緊張が背景にあるが、細部を知らなくても人物の葛藤は追える。","question":"個人の幸福は、政治や信仰から切り離して守ることができるのか。","mood":[4,4,3,3],"year":2002},{"no":93,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"一房の葡萄","author":"有島武郎","region":"日本","era":"大正","genre":"短編集","difficulty":1.5,"length":"短","why":"盗みをしてしまった少年と教師の関係を描く児童文学の名短編。\n罪を罰するだけでなく、羞恥と赦しを考える視点が得られる。","hook":"ほんの小さな盗みが、少年の良心と優しさを目覚めさせる。","synopsis":"絵が好きな少年は、裕福な同級生の持ち物への羨望から、学校で絵の具を盗んでしまう。秘密はやがて教師に知られ、彼は強い恥と恐怖に襲われる。しかし、叱責だけではなく思いがけない理解と優しさに触れたことで、少年の心は大きく動く。表題作を中心に、子どもの繊細な感情を描く。","appeal":"罪悪感、嫉妬、恥ずかしさといった子どもの感情が驚くほど鮮明。善悪を教訓として押しつけず、人が優しさによって変わる瞬間を描く。","recommend":"短く読みやすい近代文学を探している人／子どもの心理を描く作品が好きな人／静かな感動を味わいたい人","before":"表題作は非常に短い。事件の大きさではなく、少年の内面の揺れに注目したい。","question":"人を反省させるのは、厳しい罰なのか、それとも理解される経験なのか。","mood":[5,2,3,2],"year":1920},{"no":94,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"崩れゆく絆","author":"チヌア・アチェベ","region":"ナイジェリア","era":"20世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"植民地化によって共同体が崩れていく過程を、内部の視点から描く。\nアフリカ社会を西洋の「他者」としてではなく読む入口になる。","hook":"誇り高い戦士の人生は、共同体の変化と植民地支配によって崩れていく。","synopsis":"ナイジェリアのイボ社会で、オコンクウォは強さと勤勉さによって尊敬を勝ち取ってきた。弱かった父への反発から、彼は感情や優しさを弱さとして退ける。やがて白人宣教師と植民地政府が村へ入り、宗教、裁判、権力の仕組みを変えていく。個人の悲劇と共同体の崩壊が重なる物語。","appeal":"植民地化される側の社会を、豊かな習慣と内部矛盾の両方から描く。単純な善悪ではなく、伝統の強さと暴力性、外来支配の巧妙さが見える。","recommend":"アフリカ文学の入口を探している人／植民地主義を物語から学びたい人／共同体と個人の衝突に関心がある人","before":"イボ社会の言葉や儀礼が多いが、説明を暗記せず生活のリズムとして受け取ればよい。","question":"共同体を守ろうとする強さは、いつ共同体そのものを傷つける暴力へ変わるのか。","mood":[4,4,3,3],"year":1958},{"no":95,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"二十四の瞳","author":"壺井栄","region":"日本","era":"昭和","genre":"戦争・教育","difficulty":1.8,"length":"中","why":"島の教師と子どもたちの年月を通して、戦争が日常を壊す過程を描く。\n歴史を普通の人々の生活と成長から見る感覚が得られる。","hook":"十二人の教え子たちの人生を通して、戦争が日常をどう壊すかを描く。","synopsis":"瀬戸内海の村へ赴任した若い女性教師・大石先生は、自転車で通勤する姿から「おなご先生」と呼ばれる。十二人の一年生と心を通わせるが、時代は次第に戦争へ傾いていく。子どもたちは成長し、それぞれの貧困や家族事情、徴兵に直面する。教師と教え子の長い歳月から戦争を見つめる。","appeal":"戦場を直接描かず、学校や家庭から失われていく未来を描くため、戦争の残酷さが身近に迫る。教師と子どもたちの関係が長い時間を通して胸に残る。","recommend":"戦争を市民の日常から考えたい人／教師と生徒の物語が好きな人／世代を追う作品を読みたい人","before":"舞台は小豆島を思わせる瀬戸内の村。方言や貧しい生活描写も時代の現実として味わいたい。","question":"教育は、国家が戦争へ向かう時代の中で子どもをどこまで守れるのか。","mood":[4,3,3,3],"year":1952},{"no":96,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"恥辱","author":"J・M・クッツェー","region":"南アフリカ","era":"20世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"大学教授の転落を通し、欲望・権力・人種の緊張を描く。\n簡単に救済や反省へ着地しない倫理小説を読む力がつく。","hook":"地位を失った男は、暴力に傷ついた娘の選択を理解できるのか。","synopsis":"南アフリカの大学教授デイヴィッドは、女子学生との関係を問題視され、職を追われる。彼は農村で暮らす娘ルーシーのもとへ身を寄せるが、二人は凶悪な襲撃を受ける。事件後、父は正義と報復を求める一方、娘は彼には理解しがたい決断を下す。人種、性、権力が反転する社会で親子は向き合う。","appeal":"主人公を簡単に擁護も断罪もできないまま、読者は「恥辱」と責任を考え続けることになる。アパルトヘイト後の社会変化が個人の身体と生活に刻まれている。","recommend":"倫理的に居心地の悪い小説を読みたい人／南アフリカ社会に関心がある人／加害と被害の複雑さを考えたい人","before":"アパルトヘイト廃止後の社会が背景。主人公の視点が作品全体の正解ではないことを意識したい。","question":"過去の支配に対する償いは、個人が受ける屈辱や暴力によって成立するのか。","mood":[4,3,3,3],"year":1999},{"no":97,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"夏の庭","author":"湯本香樹実","region":"日本","era":"現代","genre":"児童文学","difficulty":1.5,"length":"短","why":"子どもたちと孤独な老人の交流から、死を知ることを描く。\n恐怖の対象だった死が、具体的な人生へ変わる過程を味わえる。","hook":"死体を見たい三人の少年は、一人の老人の人生に触れていく。","synopsis":"人の死を実際に見たことがない少年三人は、近所に一人で暮らす老人を見張り始める。いつ死ぬのかという好奇心から始まった観察だったが、老人に気づかれたことで、彼らは庭仕事を手伝い、話を聞き、少しずつ親しくなる。夏休みの交流を通して、少年たちは死と生を初めて自分の問題として知る。","appeal":"不謹慎な好奇心が、友情と喪失の経験へ変わっていく過程が自然。子ども向けに読める平易さの中に、大人にも重い「死を知ること」がある。","recommend":"少年たちの成長物語が好きな人／死を静かに扱う作品を読みたい人／世代を越えた友情に弱い人","before":"児童文学だがテーマは軽くない。三人それぞれの家庭事情にも注目すると成長の意味が深まる。","question":"死を知ることは、生を怖くするのか、それとも大切にする力を与えるのか。","mood":[5,3,4,2],"year":1992},{"no":98,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"青い眼がほしい","author":"トニ・モリスン","region":"アメリカ","era":"20世紀","genre":"世界文学","difficulty":1.8,"length":"中","why":"白人の美の基準に傷つけられる黒人少女を描く。\n差別が外部の暴力だけでなく、自己認識の内側に入る仕組みを理解できる。","hook":"白い肌と青い目を願う少女に、社会は何を植えつけたのか。","synopsis":"黒人少女ペコーラは、貧困と家庭内暴力の中で暮らし、自分が醜いから不幸なのだと思い込んでいる。彼女は白人の少女のような青い目を手に入れれば、愛され、世界も変わると願う。周囲の子どもや大人たちの視点を交えながら、人種差別が美の基準と自己像を破壊していく過程を描く。","appeal":"差別を外からの暴力だけでなく、被差別者が自分自身を嫌うようになる内面化として描く。断片的な語りと美しい文章が、悲劇を単純な同情に終わらせない。","recommend":"人種と美の基準について考えたい人／トニ・モリスンを読み始めたい人／複数視点の小説が好きな人","before":"時系列と語り手が入れ替わる。何が起きたかだけでなく、誰がどんな言葉で語っているかを見る。","question":"自分を嫌う感情は、本当に自分の内側から生まれたものなのか。","mood":[3,4,3,3],"year":1970},{"no":99,"phase":4,"phaseTitle":"人物と感情②","category":"日本","title":"推し、燃ゆ","author":"宇佐見りん","region":"日本","era":"現代","genre":"純文学","difficulty":1.5,"length":"短","why":"「推し」に全存在を預ける少女を通して、現代の孤独と依存を描く。\n共感しにくい人物の内部を、身体感覚に近い文章で読む経験が得られる。","hook":"推しが炎上したとき、彼女の世界そのものが崩れ始める。","synopsis":"高校生のあかりは、アイドルグループのメンバー上野真幸を「推す」ことを生活の中心にしている。学校や家庭ではうまく振る舞えず、推しを解釈し記録することだけが彼女を支えていた。だが真幸がファンを殴ったという報道で炎上し、活動の先行きも揺らぐ。推しの危機とともに、あかり自身の日常も崩れていく。","appeal":"推し活を明るい趣味としてだけでなく、生きるための骨組みとして描く。簡潔で身体感覚の強い文章から、他者に自分を預ける危うさと切実さが伝わる。","recommend":"推し活の心理を文学で読みたい人／短い現代純文学を探している人／生きづらさを描く作品に惹かれる人","before":"主人公の依存をすぐに否定せず、推す行為が彼女に何を与えているかを見るとよい。","question":"誰かを推すことは、自分の人生から逃げることなのか、それとも生き延びる方法なのか。","mood":[4,2,3,2],"year":2019},{"no":100,"phase":4,"phaseTitle":"人物と感情②","category":"海外","title":"逃亡","author":"アリス・マンロー","region":"カナダ","era":"21世紀","genre":"世界文学","difficulty":1.7,"length":"短編集","why":"日常の小さな選択が人生を分岐させる、精密な短編集。\n劇的な事件に頼らず、人間関係の亀裂を描く短編技術を学べる。","hook":"逃げた女性たちは、本当に自由になれたのか。","synopsis":"表題作を含む短編では、家庭や恋愛、過去から離れようとする女性たちが描かれる。列車に乗る決意をした若い妻、長く抱えた秘密と向き合う人、偶然の再会によって過去を見直す人。大きな決断の裏にある迷いと、人生が思いどおりの物語にはならない感触を静かにすくい取る。","appeal":"劇的な事件より、選ばなかった道や言いそびれた言葉の重みを描く。結末で意味が反転するというより、読後にじわじわ人物像が変わるマンローらしい短編集。","recommend":"短編小説が好きな人／女性の人生の分岐を読みたい人／静かだが複雑な心理描写を味わいたい人","before":"説明されない時間の飛躍や省略が多い。結論を急がず、人物の沈黙や小さな選択を拾いたい。","question":"逃げるという選択は、弱さなのか、それとも自分を守るための勇気なのか。","mood":[4,2,3,3],"year":2004},{"no":101,"phase":5,"phaseTitle":"ジャンルを広げる①","category":"日本","title":"地球星人","author":"村田沙耶香","region":"日本","era":"現代","genre":"ディストピア","difficulty":2.3,"length":"中","why":"「人間社会に馴染めない」感覚を極端な設定まで押し広げた村田沙耶香の問題作。\n家族・性・常識が共同体によって作られる仕組みを考えられる。","hook":"この世界になじめない少女は、自分を地球人ではないと思うことで生き延びる。","synopsis":"奈月は幼い頃から家族にも学校にも居場所を感じられず、自分は宇宙から来た存在だと信じている。山の家で会う従兄の由宇と秘密を共有し、二人だけの世界を作るが、大人たちの暴力によってその時間は壊される。成長した奈月は社会の「普通」に適応したように見えながら、地球人の仕組みへの違和感を手放さない。","appeal":"前半の幻想的な少女物語が、後半で常識そのものを揺さぶる極端な展開へ進む。家族、結婚、出産を当然とする社会を、異星人の視点から異様に見せる。","recommend":"村田沙耶香の過激な作品を読みたい人／「普通」を疑うディストピアが好きな人／衝撃的な展開に耐えられる人","before":"性的虐待や暴力、グロテスクな描写を含む。『コンビニ人間』よりかなり
